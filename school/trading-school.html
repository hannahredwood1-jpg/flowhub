// slide: { t: title, p: explanation (html), spec?: tSvg spec | term?: 'CISD' (uses that term's chart), html?: extra html }
function wLearn(el, done, slides) {
  const box = h('div', 'w learn'); el.append(box); let i = 0, timer = null, finished = false;
  const T = (s) => (s.term ? termById(s.term) : null);
  const has = (s) => !!(s.spec || T(s));
  const svgAt = (s, f) => (s.spec ? tSvg(s.spec, f) : termSvg(T(s), f));
  const framesOf = (s) => (s.spec ? tFrames(s.spec) : termFrames(T(s)));
  const draw = () => {
    clearInterval(timer); const s = slides[i], sp = has(s);
    box.innerHTML = `<div class="dv-top"><span class="hud">Step ${i + 1} / ${slides.length}</span><span class="grow"></span>${sp && framesOf(s) ? '<button type="button" class="btn ghost" data-play>▶ Play it</button>' : ''}</div>
      <div class="learn-dots">${slides.map((_, k) => `<i class="${k < i ? 'on' : k === i ? 'now' : ''}"></i>`).join('')}</div>
      <h4 class="learn-h">${s.t}</h4>
      ${sp ? `<figure class="t-vis learn-fig" style="margin:0">${svgAt(s)}</figure>` : ''}${s.html || ''}
      <div class="learn-p">${s.p}</div>
      <div class="actions">${i > 0 ? '<button type="button" class="btn ghost" data-prev>← Back</button>' : ''}${i < slides.length - 1 ? `<button type="button" class="btn primary" data-nx>Next: ${esc(slides[i + 1].t.replace(/<[^>]+>/g, ''))} →</button>` : '<span class="hud" style="color:var(--win);align-self:center">✓ Lesson done. Now prove it below.</span>'}</div>`;
    if (i === slides.length - 1 && !finished) { finished = true; done(); }
  };
  const play = () => {
    const s = slides[i]; if (!has(s) || !framesOf(s)) return; clearInterval(timer); const fig = box.querySelector('.learn-fig'), total = framesOf(s), step = s.spec || !T(s).custom ? 110 : 650; let f = 0;
    timer = setInterval(() => { if (!fig.isConnected) return clearInterval(timer); fig.innerHTML = svgAt(s, f); f++; if (f >= total) { clearInterval(timer); setTimeout(() => { if (fig.isConnected) fig.innerHTML = svgAt(s); }, step); } }, RM() ? 1 : step);
  };
  box.addEventListener('click', (e) => {
    if (e.target.closest('[data-nx]')) { i++; draw(); play(); }
    else if (e.target.closest('[data-prev]')) { i--; draw(); }
    else if (e.target.closest('[data-play]')) play();
  });
  draw();
}

  { id: 'colors', title: 'Change your candle colors', body: '<p>Green and red are wired into your brain as <b>winning</b> and <b>losing</b>. A wall of red candles feels like danger even when it’s exactly the move you’re waiting for, and green feels like “buy now”. That pushes you into emotional clicks.</p><p>Switch your candles to <b>neutral colors</b> so you read structure, not feelings. For example: up candles <b>white</b>, down candles <b>gray</b> (or a light blue and a dark blue).</p>', w: (el, d) => { const box = h('div', 'w'); box.innerHTML = `<div class="w-stats"><div><span class="hud">Default · emotional</span><figure class="t-vis sm" style="margin:0">${tSvg({ c: CH_BEAR })}</figure></div><div><span class="hud">Neutral · structure</span><figure class="t-vis sm" style="margin:0">${tSvg({ c: CH_BEAR, mono: true })}</figure></div></div>`; el.append(box); wDoIt(el, d, ['TradingView: right-click the chart → <b>Settings</b> → <b>Symbol</b>', '<b>Body</b>: up candles white (or light blue), down candles gray (or dark blue)', '<b>Borders</b> and <b>Wick</b>: same colors as the bodies', 'Bottom-left <b>Template</b> → <b>Save as default</b> so every chart opens this way'], 'Done. Same chart, less emotion. You’ll still see who won each candle from where it closed.'); } },
  { id: 'tools', title: 'Drawing tools', body: '<p>You’ll mark levels, zones and fibs every day. Learn the four tools and their shortcuts.</p>', w: doItAfter((el, d) => wLearn(el, () => wTap(el, d, { spec: { c: CH_SR }, q: 'Practice: tap where you’d draw a <b>horizontal line</b> for the level price bounced from twice.', hit: hitBand(21498, 21504, 'Right on the ~21,500 level. That’s exactly where the line goes.', (p) => (p > 21504 ? 'Higher than the bounces. The line goes where the lows turned.' : 'Below where price turned.')) }), [
    { t: 'Horizontal line · Alt + H', p: '<p>Marks a price level across the whole chart: old highs and lows, opening prices, your entry. Use a <b>horizontal ray</b> instead to start the line at a candle and extend right.</p>' },
    { t: 'Rectangle · zones', p: '<p>Draw a box over an area instead of a single price: a fair value gap, an order block, a level. FLOWMTD levels are usually zones, not exact prices.</p>', term: 'FVG' },
    { t: 'Fib retracement · Alt + F', p: '<p>Click the swing low, then the swing high. TradingView draws the levels for you. You’ll use it for Orbit’s OTE zone (0.62–0.79): add those two levels in the fib settings.</p>', term: 'OTE' },
    { t: 'Measure · Shift + click', p: '<p>Hold <b>Shift</b> and click-drag on the chart to measure points, ticks and time between two prices. Use it to check your stop and target distances before every trade.</p>' },
  ]), ['Drew a horizontal line on a recent high', 'Drew a rectangle around a zone', 'Drew a fib on a swing and added the 0.62 and 0.79 levels', 'Measured a move with Shift + click'], 'Tools ready. Delete the practice drawings when you’re done.') },
  { id: 'indicators', title: 'Add Confluence Master', body: '<p>Members find ECHO X ORBIT trades with the <b>Confluence Master</b> indicator.</p>', w: doItAfter((el, d) => wLearn(el, d, [
    { t: 'Where to find it', p: '<p>Once your access is granted, open <b>Indicators</b> (top bar) → <b>Invite-only scripts</b> → <b>Confluence Master</b>. Click it once to add it to the chart. Click the ☆ so it’s in your favourites.</p>', html: tvMock(['ind'], true) },
    { t: 'Settings live in the gear', p: '<p>Hover the indicator name at the top-left of the chart and click the <b>gear</b> to open its settings. You’ll set it up for ECHO X ORBIT later in the school. For now, just get it on the chart.</p>' },
  ]), ['Opened Indicators → Invite-only scripts', 'Added <b>Confluence Master</b> to the chart', 'Starred it in favourites'], 'Confluence Master is on your chart.') },
  { id: 'save', title: 'Save it, alert it, replay it', body: '', w: doItAfter((el, d) => wLearn(el, d, [
    { t: 'Save your layout', p: '<p>Click <b>Save</b> (top right). Your symbol, timeframes, drawings and indicators come back exactly like this next time. Name it “FLOWMTD NQ”.</p>', html: tvMock(['save'], true) },
    { t: 'Alerts: stop staring at the chart', p: '<p>Right-click a level → <b>Add alert</b>, or press <b>Alt + A</b>. TradingView pings you when price gets there. Let the alert call you to the chart instead of watching every candle.</p>', html: tvMock(['alert'], true) },
    { t: 'Bar Replay: practise on past days', p: '<p><b>Replay</b> rewinds the chart to any day and plays it back candle by candle. It’s the best way to practise the models without risking money.</p>', html: tvMock(['replay'], true) },
  ]), ['Saved my layout as “FLOWMTD NQ”', 'Set one alert at a level (Alt + A)', 'Opened Bar Replay once and played a few candles'], 'Your TradingView is set up. Next: Platform Setup (New York time, paper trading, your 15/40 bracket).') },
] });

// ════════ Beginner · How futures & NQ work ════════
DIVES.push({ id: 'futures', title: 'How futures & NQ work', sub: 'What you’re actually trading, what one point is worth, and when the market is open.', secs: [
  { id: 'what', title: 'What a futures contract is', body: '<p>A <b>futures contract</b> is an agreement to buy or sell something at a set price on a future date. You never take delivery: traders open and close the contract the same day and keep the difference.</p><p>We trade <b>NQ</b>: futures on the <b>Nasdaq-100</b> index, the 100 biggest non-financial companies on the Nasdaq. When those stocks rise, NQ rises.</p>', w: (el, d) => wQs(el, d, [
    { q: 'You buy 1 NQ contract. What are you betting on?', o: ['The Nasdaq-100 goes up before you close', 'You’ll receive Nasdaq shares at expiry', 'One stock goes up'], why: 'You profit from the price moving your way. Day traders close before expiry, nothing is delivered.' },
    { q: 'What does NQ track?', o: ['The Nasdaq-100 index', 'The S&P 500', 'The price of gold'], why: 'NQ = Nasdaq-100. ES is the S&P 500. You’ll hear about ES later as a confirmation tool.' },
    { q: 'Do you need $400,000 to trade one NQ contract worth that much?', o: ['No. You only post margin, a small deposit', 'Yes, the full value', 'Only half'], why: 'Futures are leveraged. A small margin controls the whole contract, which is why size and stops matter so much.' },
  ]) },
  { id: 'nq', title: 'NQ vs MNQ: what a point is worth', body: '<p>Price moves in <b>ticks</b> of <b>0.25</b>. Four ticks make one <b>point</b>.</p><div class="w-stats"><div><span class="hud">NQ (mini)</span><span class="v">$20 / pt</span><span class="hud">$5 per tick</span></div><div><span class="hud">MNQ (micro)</span><span class="v">$2 / pt</span><span class="hud">$0.50 per tick</span></div></div><p>MNQ is one tenth of NQ. Same chart, same moves, one tenth of the money. Do these until they’re automatic.</p>', w: (el, d) => wNum(el, d, [
    { q: 'NQ moves <b>15 points</b> against you on 1 MNQ. How many dollars?', a: 30, unit: '$', why: '15 pts × $2 = $30.' },
    { q: 'Same 15 points on <b>1 NQ</b>?', a: 300, unit: '$', why: '15 pts × $20 = $300. Ten times MNQ.' },
    { q: 'A <b>40-point</b> target on <b>2 MNQ</b>?', a: 160, unit: '$', why: '40 × $2 × 2 = $160.' },
    { q: 'How many <b>ticks</b> is a 15-point stop?', a: 60, unit: 'ticks', why: '15 × 4 = 60 ticks.' },
    { q: 'How many <b>points</b> is 160 ticks?', a: 40, unit: 'pts', why: '160 ÷ 4 = 40 points.' },
    { q: 'Price goes from 21,500.00 to 21,512.50. How many points?', a: 12.5, unit: 'pts', why: '12.5 points (50 ticks).' },
  ]) },
  { id: 'clock', title: 'When NQ trades', body: '<p>NQ trades almost 24 hours: <b>Sunday 6 PM to Friday 5 PM ET</b>, with a one-hour break every day from <b>5 to 6 PM</b>. The day “starts” at 6 PM. Drag the clock and complete each task.</p>', w: (el, d) => wClock(el, d, [
    { q: 'Drag to a time when NQ is <b>closed</b>.', ok: (m) => m >= 17 * 60 && m < 18 * 60, why: '5–6 PM ET is the daily break.', hint: 'Look for the red break block near the end of the day.' },
    { q: 'Drag into the <b>Asia</b> session.', ok: (m) => inSess(SESS[0], m), why: 'Asia: 8 PM – midnight ET.', hint: 'Asia starts at 8 PM ET.' },
    { q: 'Drag to the <b>US stock market open</b>.', ok: (m) => m >= 9 * 60 + 30 && m < 9 * 60 + 35, why: '9:30 AM ET. The index opens and Range Settlement forms.', hint: 'The stock market opens at 9:30 AM ET.' },
    { q: 'Drag to the time <b>news</b> usually lands (CPI, jobs).', ok: (m) => m >= 8 * 60 + 25 && m <= 8 * 60 + 35, why: '8:30 AM ET. Never hold a fresh position into it.', hint: 'Big US data comes out at 8:30 AM ET.' },
  ]) },
  { id: 'side', title: 'Long and short', body: '<p>Going <b>long</b> means you buy first and profit if price rises. Going <b>short</b> means you sell first and profit if price falls. In futures, shorting is as easy as buying.</p>', w: (el, d) => wQs(el, d, [
    { q: 'You short NQ at 21,500 and close at 21,480. Result on 1 MNQ?', o: ['+$40', '−$40', '$0'], why: 'Short profits when price falls: 20 pts × $2 = +$40.' },
    { q: 'You buy at 21,500. Where does your stop go?', o: ['Below entry', 'Above entry', 'At entry'], why: 'A long loses if price falls, so the stop sits below.' },
    { q: 'You short at 21,500. Where does your target go?', o: ['Below entry', 'Above entry', 'Anywhere'], why: 'A short makes money as price drops, so the target is below.' },
  ]) },
  { id: 'roll', title: 'Contract months', body: '<p>Each NQ contract expires every quarter: <b>March, June, September, December</b>. On your chart use <b>MNQ1!</b> or <b>NQ1!</b>, the continuous contract that always shows the front month. Your broker trades the actual month (e.g. MNQZ6).</p>', w: (el, d) => wQuiz(el, d, { q: 'Why chart MNQ1! instead of a single month?', opts: [{ t: 'It always shows the active contract, so levels stay continuous', ok: true, fb: 'Right. You won’t be caught looking at an expired chart after the roll.' }, { t: 'It has lower fees', fb: 'Fees depend on the contract you trade, not the chart.' }, { t: 'It trades 24/7', fb: 'Same hours as every NQ contract.' }] }) },
] });

// ════════ Beginner · Module 2: Reading charts ════════
DIVES.push({ id: 'charts', title: 'Reading charts', sub: 'Candles, wicks, timeframes, highs and lows. Tap the chart until you can read it at a glance.', secs: [
  { id: 'candle', title: 'One candle, four prices', body: '<p>Each candle shows one slice of time: where price <b>opened</b>, the <b>high</b>, the <b>low</b>, and where it <b>closed</b>. The body is open → close. The thin lines are <b>wicks</b>: prices that were reached but rejected.</p><p><b>Green</b> = closed higher than it opened. <b>Red</b> = closed lower.</p>', w: (el, d) => wTap(el, d, { spec: { c: CH_WICK }, q: 'Tap the candle with the <b>longest upper wick</b>: buyers pushed up, sellers slammed it back.', hit: hitCandle([6], 'That wick shows rejection: price went up there and couldn’t stay.', 'Look for the tallest thin line above a body.') }) },
  { id: 'bear', title: 'Who won the candle?', body: '<p>A big body means one side was in control. A small body with long wicks means a fight nobody won.</p>', w: (el, d) => wTap(el, d, { spec: { c: CH_BEAR }, q: 'Tap the candle where <b>sellers took control</b>.', hit: hitCandle([5], 'Big red body, closed near its low. Sellers won that candle clearly.', 'Find the biggest red body.') }) },
  { id: 'tf', title: 'Timeframes', body: '<p>The same price action can be shown as 1-minute, 5-minute, 1-hour or 4-hour candles. <b>Higher timeframes (HTF)</b> show the big picture and stronger levels. <b>Lower timeframes (LTF)</b> show the detail for entries.</p>', w: (el, d) => wQs(el, d, [
    { q: 'How many 5-minute candles make one 1-hour candle?', o: ['12', '5', '60'], why: '60 ÷ 5 = 12.' },
    { q: 'A level shows up on the 4H chart. Compared to one on the 1m chart, it is usually…', o: ['Stronger and more watched', 'Weaker', 'The same'], why: 'More traders see HTF levels and more orders sit there.' },
    { q: 'Where do FLOWMTD traders usually fine-tune the entry?', o: ['A lower timeframe, inside a higher-timeframe idea', 'The daily chart only', 'Any timeframe, randomly'], why: 'HTF for the idea, LTF for precision. That’s how you keep stops small.' },
  ]) },
  { id: 'trend', title: 'Highs, lows and trend', body: '<p>An <b>uptrend</b> makes <b>higher highs</b> and <b>higher lows</b>. A downtrend makes lower highs and lower lows. A swing low is a candle with a higher low on each side.</p>', w: (el, d) => { const p = pivots(CH_TREND, 'low'); const hl = p.filter((i) => i > p[0]); wTap(el, d, { spec: { c: CH_TREND }, q: 'This is an uptrend. Tap a <b>higher low</b>: a swing low above the first one.', hit: hitCandle(hl, 'A higher low. Buyers stepped in earlier than last time: the uptrend is intact.', (i) => (i === p[0] ? 'That’s the first swing low. Find one that came later and higher.' : 'Look for a candle whose low is lower than the candles on both sides.')) }); } },
  { id: 'sr', title: 'Where price reacts', body: '<p>When price turns at the same area more than once, traders remember it. Those are <b>levels</b>: where orders sit and price is likely to react again.</p>', w: (el, d) => wTap(el, d, { spec: { c: CH_SR }, q: 'Price bounced from the same area twice. Tap that area.', hit: hitBand(21498, 21504, 'Two bounces from ~21,500. That’s a level buyers defend.', (p) => (p > 21504 ? 'Higher than the bounces. Look at where the lows turned.' : 'Below where price turned.')) }) },
] });

// ════════ Beginner · Module 3 add-on: orders & brackets ════════
DIVES.push({ id: 'orders', title: 'Orders & brackets', sub: 'Market, limit and stop orders, and the bracket that protects every trade.', secs: [
  { id: 'types', title: 'Three order types', body: '<p><b>Market</b>: fill now at the best price. <b>Limit</b>: fill only at your price or better (buy below, sell above). <b>Stop</b>: becomes a market order once price reaches it, used for stop losses.</p>', w: (el, d) => wQs(el, d, [
    { q: 'You want to buy only if price drops back to 21,480. Which order?', o: ['Buy limit at 21,480', 'Buy stop at 21,480', 'Market buy'], why: 'A buy limit waits below price and fills at your level or better.' },
    { q: 'A signal fires and you want in right now.', o: ['Market order', 'Limit order far away', 'No order'], why: 'Market fills immediately. You accept the current price.' },
    { q: 'What closes a losing long if price falls to your stop?', o: ['A sell stop', 'A buy limit', 'A sell limit above price'], why: 'A sell stop below price triggers when it’s hit and exits you.' },
  ]) },
  { id: 'bracket', title: 'The bracket', body: '<p>A <b>bracket</b> attaches a stop loss and a take profit to your entry. When one fills, the other cancels (OCO). The FLOWMTD default is <b>15 / 40</b>: 15-point stop, 40-point target.</p>', w: (el, d) => wNum(el, d, [
    { q: 'Long at 21,500 with a 15/40 bracket. Stop price?', a: 21485, why: '21,500 − 15 = 21,485.' },
    { q: 'Same trade. Target price?', a: 21540, why: '21,500 + 40 = 21,540.' },
    { q: 'Short at 21,620 with 15/40. Stop price?', a: 21635, why: 'Shorts put the stop above: 21,620 + 15.' },
    { q: 'Same short. Target price?', a: 21580, why: '21,620 − 40 = 21,580.' },
  ]) },
  { id: 'oco', title: 'What OCO saves you from', body: '', w: (el, d) => wQuiz(el, d, { q: 'Your target fills. With no OCO bracket, what happens to your stop order?', opts: [{ t: 'It stays working and can open a new trade you didn’t want', ok: true, fb: 'Exactly. A leftover stop can fill later and put you in a position by accident. Brackets cancel it for you.' }, { t: 'It disappears on its own', fb: 'Only if it’s linked (OCO). Standalone orders stay working.' }, { t: 'It moves to breakeven', fb: 'Orders don’t move by themselves.' }] }) },
] });

// ════════ Beginner · Module 4: Risk basics ════════
DIVES.push({ id: 'risk', title: 'Risk basics', sub: 'Size from your stop, a daily stop that ends the day, and why risk comes first.', secs: [
  { id: 'formula', title: 'Risk = points × $ per point × contracts', body: '<p>Decide the <b>dollars</b> you’re willing to lose first, then work out the size. Never the other way round.</p><p class="k">risk $ = stop points × $ per point × contracts</p>', w: (el, d) => wNum(el, d, [
    { q: '15-point stop on <b>3 MNQ</b>. Risk in dollars?', a: 90, unit: '$', why: '15 × $2 × 3 = $90.' },
    { q: 'You can risk <b>$150</b> with a 15-point stop. How many MNQ?', a: 5, unit: 'MNQ', why: '$150 ÷ (15 × $2) = 5.' },
    { q: 'You can risk <b>$300</b> with a 15-point stop. How many NQ?', a: 1, unit: 'NQ', why: '15 × $20 = $300 per NQ.' },
    { q: 'Risk <b>$100</b>, 15-point stop. Max MNQ (round down)?', a: 3, unit: 'MNQ', why: '$100 ÷ $30 = 3.33 → 3. Always round down.' },
  ]) },
  { id: 'r', title: 'Thinking in R', body: '<p><b>1R</b> = what you risk on a trade. A 15/40 trade risks 1R to make about 2.7R. Thinking in R keeps your results the same whatever your size.</p>', w: (el, d) => wQs(el, d, [
    { q: 'You risk $60 and make $160. How many R?', o: ['About 2.7R', '1R', '160R'], why: '160 ÷ 60 ≈ 2.7R.' },
    { q: 'Two losses and one win on 15/40. Net?', o: ['About +0.7R', '−1R', '0R'], why: '−1 −1 +2.7 ≈ +0.7R. One win pays for two losses.' },
  ]) },
  { id: 'daily', title: 'Your daily stop', body: '<p>A <b>daily stop</b> is the loss that ends your day. FLOWMTD’s default: <b>2 losses = done</b>. It keeps one bad morning from becoming a blown account.</p>', w: (el, d) => wQs(el, d, [
    { q: 'Two losses before 10 AM. A perfect setup appears.', o: ['Done for the day. Close the charts', 'Take it, it’s perfect', 'Take it with half size'], why: 'The daily stop is a rule, not a suggestion. Tomorrow there will be another perfect setup.' },
    { q: 'Why have a daily stop tighter than your prop firm’s daily loss limit?', o: ['So you never get near failing the account', 'To trade more', 'It doesn’t matter'], why: 'Your stop ends the day long before the firm’s limit can end the account.' },
  ]) },
] });

// ════════ Extended Learning: Range Settlement (first) ════════
DIVES.push({ id: 'rs', title: 'Range Settlement', sub: 'The first concept of Extended Learning: the 9:30 level that pulls the AM session.', secs: [
  { id: 'why', title: 'Why 9:30 matters', body: '<p>NQ trades all night, but the Nasdaq-100 <b>index</b> only trades from 9:30. Orders get left behind overnight. At the open they get filled, and price is drawn toward that level: the <b>Range Settlement (RS)</b>.</p>', w: (el, d) => wClock(el, d, [{ q: 'Drag to the moment RS forms.', ok: (m) => m >= 9 * 60 + 30 && m < 9 * 60 + 35, why: '9:30 AM ET, every weekday.', hint: 'It forms at the stock market open.' }]) },
  { id: 'side', title: 'Which way does it pull?', body: '<p><b>Open below RS → the AM draw is up</b> (longs). <b>Open above RS → the draw is down</b> (shorts). It only applies after 9:30, never overnight.</p>', w: (el, d) => { const c = cs([20, 20.6, 19.8, 21, 21.8, 23.4, 24.8, 26.2, 27.2]).map((k) => ({ o: 21480 + k.o * 4, c: 21480 + k.c * 4, h: 21480 + k.h * 4, l: 21480 + k.l * 4 })); wTap(el, d, { spec: { c, ann: [{ k: 'h', p: 21480 + 20.6 * 4, i0: 0.5, i1: 1.5, col: 'ink', t: '9:30 open', tpos: 'l', below: true, dash: false }, { k: 'h', p: 21588, col: 'lag', t: 'RS', tpos: 'l', at: HIDE }] }, q: 'Price opened at 9:30 below RS. Tap where the <b>RS draw</b> is.', hit: hitBand(21582, 21594, 'Above the open. Price was pulled up to fill it.', (p) => (p < 21582 ? 'Opened below RS means the draw is above.' : 'Too high.')) }); } },
  { id: 'qs', title: 'RS check', body: '', w: (el, d) => wQs(el, d, [
    { q: 'Price opens above RS. What does that favour?', o: ['Shorts toward RS', 'Longs', 'Nothing'], why: 'Above RS → the AM draw is down.' },
    { q: 'It’s 3 AM. Does RS apply?', o: ['No, only after 9:30', 'Yes, all day', 'Only on Fridays'], why: 'RS is an AM-session draw. Overnight it doesn’t exist yet.' },
    { q: 'RS is…', o: ['A draw: a level price is pulled to', 'A guaranteed reversal', 'An entry signal by itself'], why: 'It tells you where price is likely heading, not where to enter.' },
  ]) },
] });

// ════════ Intermediate: Build your trading plan ════════
DIVES.push({ id: 'planlesson', title: 'Build your trading plan', sub: 'Turn everything so far into one plan card: when you trade, what you trade, your risk and your limits.', secs: [
  { id: 'why', title: 'Why a written plan', body: '<p>Every decision you make before the session is one you don’t have to make under pressure. Your plan answers: <b>when</b> you trade, <b>which models</b>, <b>how you enter and exit</b>, your <b>risk and limits</b>, and <b>the numbers</b> you’re working toward.</p>', w: (el, d) => wQs(el, d, [
    { q: 'When should you decide your max losses for the day?', o: ['Before the session, in your plan', 'After the first loss', 'When you feel it'], why: 'Rules made in the moment are made by the emotion of the moment.' },
    { q: 'What makes a plan useful?', o: ['It’s specific and you check it before every trade', 'It’s long', 'It’s secret'], why: 'Specific rules you can check in two seconds. That’s what the plan card is for.' },
  ]) },
  { id: 'build', title: 'Build it in the Trading Plan tab', body: '<p>Open <b>Trading Plan → Build your plan</b>, go through the 6 steps and save. Your plan card then shows on your dashboard and feeds your pre-trade checklist. Coaches can see it too.</p>', w: (el, d) => wPlanCheck(el, d) },
] });

// ════════ ECHO X ORBIT ════════
// Concepts only. The full strategy guide and the private indicator stay private.
const echoScene = {
  title: 'Echo, start to finish', intro: 'Press Play. Each step adds one piece of the idea.', c: ECHO_C, extra: [ECHO.draw + 2],
  phases: [
    { until: 8, title: '1 · Liquidity first', cap: 'Stops rest under the old low. Price runs them: the sweep.', under: (a) => hline(a, ECHO.oldLow, 4, COL.ink2, 'old low'), over: (a, s) => { if (s >= 8) rings(a, a.m.x(7), a.m.y(21481), a.t, COL.signal); } },

  { id: 'watch', title: 'Watch the whole thing', body: '<p>The same Echo, start to finish, as one animation.</p>', w: (el, d) => scene(el, d, echoScene) },
  { id: 'cisd', title: 'Find the CISD', body: '<p>The <b>CISD</b> is the candle that <b>closes back above the open of the down-move</b> that made the sweep. Confluence Master won’t mark it: you read it by eye.</p>', w: (el, d) => wTap(el, d, { spec: ECHO_SPEC(12, [{ k: 'h', p: ECHO.cisd, i0: 6, i1: 11, col: 'ice', t: 'open of the down-move', at: HIDE }]), q: 'Tap the candle that confirms the <b>CISD</b>.', hit: hitCandle([9], 'That close is back above the open of the down-move: delivery changed.', (i) => (i === 7 ? 'That’s the sweep. The CISD comes after it.' : 'Find the first close back above where the down-move started.')) }) },
  { id: 'rb', title: 'Mark the rejection block', body: '<p>Price came back into the gap. Find the wick that got rejected <b>inside the FVG</b>.</p>', w: (el, d) => wTap(el, d, { spec: ECHO_SPEC(14, [{ k: 'band', lo: ECHO.fvgLo, hi: ECHO.fvgHi, i0: 7.5, i1: 10.5, col: 'ice', t: 'FVG' }, { k: 'band', lo: ECHO.rbLo, hi: ECHO.rbHi, i0: 11.5, i1: 12.5, col: 'signal', t: 'RB', tpos: 'below', at: HIDE }]), q: 'Tap the <b>rejection block</b>.', hit: hitCandle([12], 'Long lower wick inside the FVG. That’s the RB.', 'Look for the candle that wicked into the gap and closed back out of it.') }) },
  { id: 'rules', title: 'What makes an Echo valid', body: '<p>The 4H trend comes first: an Echo <b>with</b> the 4H trend beats one against it, however clean the counter-trend one looks.</p>', w: (el, d) => wQs(el, d, [
    { q: 'An RB sits just above the FVG, not inside it. Valid Echo?', o: ['No, the RB has to be inside the FVG', 'Yes, close enough', 'Only on Fridays'], why: 'Inside the gap is the whole point.' },
    { q: 'Two Echos: one with the 4H trend, one against it. Prefer?', o: ['The one with the 4H trend', 'The one against it', 'No difference'], why: 'With the trend is where the model earns.' },
    { q: 'Price sweeps a low but never closes back above the open of the down-move. Do you have an Echo?', o: ['No CISD, no Echo', 'Yes', 'Only if ES agrees'], why: 'Without the CISD it’s just a sweep that may keep going.' },
  ]) },
] });
DIVES.push({ id: 'orbit', title: 'Orbit', sub: 'Big swing, draw the fib, wait for the OTE zone, inversion on the leg in. Orbit maps the zone; the trend and the confirmation decide.', secs: [
  { id: 'learn', title: 'How Orbit works, step by step', body: '<p>Click through each step. Press <b>Play it</b> to watch the candles form.</p>', w: (el, d) => wLearn(el, d, LEARN.orbit) },
  { id: 'watch', title: 'Watch the whole thing', body: '<p>The same Orbit, start to finish, as one animation.</p>', w: (el, d) => scene(el, d, orbitScene) },
  { id: 'fib', title: 'Draw the fib', body: '<p>Confluence Master doesn’t draw fibs: you do it yourself. Long: anchor the <b>swing low</b>, drag to the <b>swing high</b>.</p>', w: (el, d) => wFib(el, d, { spec: { c: ORBIT_C }, upto: 13, lowI: 0, highI: 7, ok: 'Deep in the pullback, between 0.62 and 0.79. That’s where Orbit waits.' }) },
  { id: 'inv', title: 'Inversion on the leg in', body: '<p>The pullback into OTE leaves its own gap on the way down. When price <b>closes back through</b> that gap, it’s inverted.</p>', w: (el, d) => wTap(el, d, { spec: { c: ORBIT_C.slice(0, 15), slots: ORBIT_C.length, ann: [{ k: 'band', lo: fibLvl(0.79), hi: fibLvl(0.62), col: 'signal', t: 'OTE', fill: 0.12, tx: 'r' }, { k: 'band', lo: ORBIT.ifvgLo, hi: ORBIT.ifvgHi, i0: 9.5, i1: 12.5, col: 'lag', t: 'gap', tpos: 'above' }] }, q: 'Tap the candle that <b>inverts</b> the gap.', hit: hitCandle([13], 'Closed back above the gap: inverted. The pullback is done.', (i) => (i === 12 ? 'That’s the low in OTE. The inversion is the close back through the gap.' : 'Find the first close back above the purple gap.')) }) },
  { id: 'rules', title: 'What makes an Orbit valid', body: '', w: (el, d) => wQs(el, d, [
    { q: 'The pullback only reaches the 0.38 level. Orbit?', o: ['No, it hasn’t reached OTE', 'Yes', 'Only with ES'], why: 'Orbit wants the deep pullback: 0.62–0.79.' },
    { q: 'Which swing do you draw the fib on?', o: ['A big, clean swing that’s obvious on the chart', 'The last two candles', 'Any wiggle'], why: 'Small swings make meaningless fibs.' },
    { q: 'Price is in OTE but nothing has inverted yet.', o: ['Wait for the inversion', 'Buy now', 'Short it'], why: 'The inversion is your sign the leg in is finished.' },
  ]) },
] });
DIVES.push({ id: 'exo-rules', title: 'The shared rules', sub: 'The draw, the 2× rule and the 4H trend. Both engines use them.', secs: [
  { id: 'draw', title: 'No draw, no trade', body: '<p>Every ECHO X ORBIT trade needs a <b>draw on liquidity</b>: old highs/lows, session highs/lows, equal highs/lows. And it must be <b>at least 2× your stop</b> away.</p>', w: (el, d) => wLearn(el, () => wNum(el, d, [
    { q: 'Stop is 15 points. Minimum distance to the draw?', a: 30, unit: 'pts', why: '2 × 15 = 30 points.' },
    { q: 'Stop 12 points, draw 30 points away. How many times the stop?', a: 2.5, tol: 0.05, unit: '×', why: '30 ÷ 12 = 2.5×. Valid.' },
    { q: 'Stop 15, entry 21,500 long. Lowest valid draw price?', a: 21530, why: '21,500 + 30 = 21,530.' },
  ]), LEARN.draw) },
  { id: 'valid', title: 'Valid or not?', body: '', w: (el, d) => wQs(el, d, [
    { q: 'Long, stop 15. Old high 22 points above. Valid?', o: ['No, 22 is under 2× (30)', 'Yes', 'Only on the 1H'], why: 'Needs 30+.' },
    { q: 'Short, stop 14. Asia low 40 points below. Valid?', o: ['Yes, about 2.9×', 'No', 'Only with ES'], why: '40 ÷ 14 ≈ 2.9×.' },
    { q: 'Great setup, but there’s no clear liquidity in the direction of the trade.', o: ['No trade', 'Pick a round number as target', 'Hold until it works'], why: 'The draw is required, not optional.' },
  ]) },
  { id: 'trend', title: 'With the 4H trend', body: '<p>Open the <b>4H chart</b> before anything else. Five years of backtesting said the same thing every way it was cut: the setups that pay are the ones <b>with</b> the 4H trend.</p>', w: (el, d) => wLearn(el, () => wQs(el, d, [
    { q: 'NQ gives a clean Echo short, but the 4H is clearly trending up. Take it?', o: ['Pass, or wait for a long: it’s against the 4H trend', 'Yes, a clean setup is a clean setup', 'Yes, with double size'], why: 'Counter-trend setups are where the edge leaks away.' },
    { q: 'Your setup is valid and with the trend, but ES isn’t doing the same thing. Does that cancel it?', o: ['No: the trend, the real rejection and an open draw are what matter', 'Yes, ES is required', 'Trade ES instead'], why: 'Extra filters didn’t add to the edge in the backtest. Keep it simple.' },
    { q: 'You only have time for one session today. Which one?', o: ['New York', 'Whichever is quietest', 'It doesn’t matter, skip it'], why: 'Every session can set up, but New York comes first.' },
  ]), [
    { t: 'Read the 4H', p: '<p>Higher highs and higher lows on the 4H: up trend, look for <b>longs</b>. Lower highs and lower lows: down trend, look for <b>shorts</b>. Chopping sideways with no clear direction: be pickier and let setups come to you.</p>' },
    { t: 'More boxes isn’t better', p: '<p>It’s tempting to wait for ES to agree, or for a setup to tick every possible box. In the backtest, piling on extra filters didn’t add to the edge. What did: <b>the 4H trend, the true point of rejection, and an open draw.</b></p>' },
    { t: 'New York first', p: '<p>Valid setups form in every session, but <b>New York</b> is the priority. If you can only trade one session, make it New York.</p>' },
    { t: 'All-time highs', p: '<p>Near all-time highs nothing special happens: the model works the same. Stay with the trend, <b>don’t fade the high</b>, and don’t widen your stop.</p>' },
  ]) },
  { id: 'check', title: 'The ECHO X ORBIT checklist', body: '', w: (el, d) => wChecklist(el, d, ['Trade is <b>with the 4H trend</b>', 'Engine identified: <b>Echo</b> (RB inside FVG after CISD) or <b>Orbit</b> (OTE + inversion)', 'Draw on liquidity marked, <b>≥ 2× the stop</b>', 'Stop placed beyond the RB / the leg-in low. Target fixed at the draw', 'Under my daily cap · one trade at a time', 'No red-folder news in the next 15 minutes'], 'That’s the checklist. Run it on every call before you click.') },
] });

// ════════ Teach first: a step-through lesson before every Beginner and Range Settlement exercise ════════
function teachFirst(dv, sec, slides) { const s = DIVES.find((d) => d.id === dv).secs.find((x) => x.id === sec); const w0 = s.w; s.w = (el, d) => wLearn(el, () => w0(el, d), slides); }
const TABLE = (rows) => `<div class="w-stats">${rows.map(([a, b, c]) => `<div><span class="hud">${a}</span><span class="v">${b}</span>${c ? `<span class="hud">${c}</span>` : ''}</div>`).join('')}</div>`;
// How futures & NQ work
teachFirst('futures', 'what', [
  { t: 'A contract on a price', p: '<p>A futures contract is an agreement to buy or sell something at today’s price on a future date. Traders never hold it to that date. You open it, and close it minutes or hours later. <b>Your profit or loss is the difference between the two prices.</b></p>' },
  { t: 'What NQ is', p: '<p><b>NQ</b> is the futures contract on the <b>Nasdaq-100</b>: the 100 biggest non-financial companies on the Nasdaq (Apple, Microsoft, Nvidia, Amazon…). When those stocks rally, NQ goes up. It moves fast, trades almost 24 hours, and it’s what FLOWMTD trades.</p>' },
  { t: 'Margin: why size matters', p: '<p>One NQ contract controls hundreds of thousands of dollars of the index, but you only put up a small deposit called <b>margin</b>. That leverage is why a few points can mean hundreds of dollars, and why every trade needs a stop.</p>' },
]);
teachFirst('futures', 'nq', [
  { t: 'Ticks and points', p: '<p>NQ moves in steps of <b>0.25</b>. Each step is a <b>tick</b>. Four ticks make one <b>point</b>. 21,500.00 → 21,500.25 is one tick; 21,500 → 21,501 is one point.</p>', term: 'TICK' },
  { t: 'NQ vs MNQ', p: `<p>Same chart, same moves, different size. <b>MNQ</b> (micro) is one tenth of NQ. Start on MNQ while you learn.</p>${TABLE([['NQ · per point', '$20', '$5 per tick'], ['MNQ · per point', '$2', '$0.50 per tick']])}` },
  { t: 'The only formula you need', p: '<p class="k">dollars = points × $ per point × contracts</p><p>A 15-point move on 2 MNQ: 15 × $2 × 2 = <b>$60</b>. On 1 NQ: 15 × $20 = <b>$300</b>. Now try some yourself.</p>' },
]);
teachFirst('futures', 'clock', [
  { t: 'The futures day starts at 6 PM', p: '<p>NQ opens Sunday 6 PM ET and trades until Friday 5 PM, with a one-hour break every day from <b>5 to 6 PM</b>. Each new trading day starts at 6 PM, not midnight. Every time in FLOWMTD is New York time.</p>', term: 'SESSIONS' },
  { t: 'The three sessions', p: `<p>Price behaves differently depending on which part of the world is trading.</p>${TABLE([['Asia', '8 PM – 12 AM'], ['London', '2 – 5 AM'], ['New York', '7 – 10 AM']])}<p>The US stock market opens at <b>9:30 AM</b>. That’s when the most volume arrives.</p>` },
  { t: '8:30 AM: news time', p: '<p>Big US data (CPI, jobs) is released at <b>8:30 AM ET</b>. Price can jump 50+ points in seconds. Never hold a fresh trade into it unless your plan says so.</p>' },
]);
teachFirst('futures', 'side', [
  { t: 'Long: buy first', p: '<p>Going <b>long</b> means you buy now and sell later. You make money if price goes <b>up</b>. Your stop goes <b>below</b> your entry.</p>', term: 'LONG' },
  { t: 'Short: sell first', p: '<p>Going <b>short</b> means you sell now and buy back later. You make money if price goes <b>down</b>. In futures, shorting is as easy as buying. Your stop goes <b>above</b> your entry.</p>', term: 'SHORT' },
]);
// Reading charts
teachFirst('charts', 'candle', [
  { t: 'One candle = one slice of time', p: '<p>On a 5-minute chart, each candle shows 5 minutes. It records four prices: where it <b>opened</b>, the <b>high</b>, the <b>low</b>, and where it <b>closed</b>. Press Play to watch one form.</p>', term: 'CANDLE' },
  { t: 'Wicks are rejected prices', p: '<p>The thin lines above and below the body are <b>wicks</b>. Price reached there but couldn’t stay. A long upper wick means buyers pushed up and sellers slammed it back down.</p>', term: 'WICK' },
]);
teachFirst('charts', 'bear', [
  { t: 'Bodies show who was in control', p: '<p>A big body that closes near its extreme means one side dominated. A small body with long wicks means a fight nobody won. Look at the big down candle: sellers took control and closed it near the low.</p>', spec: { c: CH_BEAR, ann: [{ k: 'arrow', i: 5, p: 21486, dir: 'down', col: 'loss', t: 'sellers', at: 5 }] } },
]);
teachFirst('charts', 'tf', [
  { t: 'Same price, different zoom', p: '<p>Twelve 5-minute candles make one 1-hour candle. A <b>lower timeframe</b> (LTF) shows the detail; a <b>higher timeframe</b> (HTF) shows the big picture. Press Play.</p>', term: 'LTF' },
  { t: 'Higher timeframes carry more weight', p: '<p>More traders watch the 1H and 4H, so levels there hold more orders. The FLOWMTD way: find the idea on the higher timeframe, fine-tune the entry on a lower one to keep the stop small.</p>', term: 'HTF' },
]);
teachFirst('charts', 'trend', [
  { t: 'Swing highs and swing lows', p: '<p>A <b>swing low</b> is a candle with a higher low on each side: a turning point. Same for a swing high, upside down.</p>', spec: { c: CH_TREND, ann: pivots(CH_TREND, 'low').map((i) => ({ k: 'dot', i, p: CH_TREND[i].l, col: 'ice', at: i + 1 })) } },
  { t: 'Uptrend = higher highs and higher lows', p: '<p>When each swing low is above the last one, buyers are stepping in earlier each time. That’s an uptrend. When price breaks a previous high, that’s a <b>break of structure</b>.</p>', term: 'BOS' },
]);
teachFirst('charts', 'sr', [
  { t: 'Levels: where price reacted before', p: '<p>When price turns at the same area more than once, traders remember it and leave orders there. Watch price bounce from ~21,500 twice.</p>', spec: { c: CH_SR, ann: [{ k: 'band', lo: 21498, hi: 21504, col: 'win', t: 'level', at: 7 }, { k: 'arrow', i: 2, p: 21501, dir: 'up', col: 'win', at: 2 }, { k: 'arrow', i: 7, p: 21500, dir: 'up', col: 'win', at: 7 }] } },
]);
// Orders & brackets
teachFirst('orders', 'types', [
  { t: 'Market order', p: '<p>Fill <b>right now</b> at the best available price. Fast, but you accept whatever price you get.</p>', term: 'MARKET' },
  { t: 'Limit order', p: '<p>Fill only at <b>your price or better</b>. A buy limit waits below the current price; a sell limit waits above. If price never gets there, you never get in.</p>', term: 'LIMIT' },
  { t: 'Stop order', p: '<p>Becomes a market order once price <b>reaches</b> it. That’s how a stop loss works: a sell stop under your long gets you out if price falls there.</p>', term: 'STOP' },
]);
teachFirst('orders', 'bracket', [
  { t: 'The bracket protects every trade', p: '<p>A bracket attaches a <b>stop loss</b> and a <b>take profit</b> to your entry the moment it fills. FLOWMTD’s default is <b>15 / 40</b>: 15 points of risk, 40 points of target (60 / 160 ticks).</p>', term: 'BRACKET' },
  { t: 'Which side is which', p: `<p>Long: stop <b>below</b>, target <b>above</b>. Short: stop <b>above</b>, target <b>below</b>.</p>${TABLE([['Long at 21,500', 'stop 21,485', 'target 21,540'], ['Short at 21,500', 'stop 21,515', 'target 21,460']])}` },
]);
// Risk basics
teachFirst('risk', 'formula', [
  { t: 'Risk first, size second', p: '<p>Beginners pick a size that feels right, then hope. Pros decide the <b>dollars they can lose</b> on this trade, then work out the size from the stop.</p><p class="k">contracts = $ risk ÷ (stop points × $ per point)</p>' },
  { t: 'A worked example', p: '<p>You’ll risk <b>$150</b> with a <b>15-point</b> stop on MNQ. One MNQ loses 15 × $2 = $30. $150 ÷ $30 = <b>5 MNQ</b>. If the answer isn’t a whole number, always <b>round down</b>.</p>' },
]);
teachFirst('risk', 'r', [
  { t: 'R: risk as a unit', p: '<p><b>1R</b> is whatever you risk on a trade. Winning 40 points with a 15-point stop is about <b>2.7R</b>. Measuring in R makes results comparable whether you trade 1 MNQ or 5 NQ.</p>', term: 'RR' },
]);
teachFirst('risk', 'daily', [
  { t: 'A daily stop ends the day', p: '<p>Your <b>daily stop</b> is the loss that ends your trading day. FLOWMTD default: <b>2 losses = done</b>. It sits well inside your prop firm’s daily loss limit, so a bad morning never becomes a failed account.</p>', term: 'DLL' },
]);
// Range Settlement

]);
teachFirst('rs', 'side', [
  { t: 'Below RS → look up. Above RS → look down.', p: '<p>If price opens <b>below</b> RS at 9:30, the morning draw is <b>up</b> toward it: favour longs. If price opens <b>above</b>, the draw is down: favour shorts. It only applies after 9:30, never overnight.</p>', term: 'RS' },
]);

// ── Beginner · What trading actually is (first lesson of Module 1) ──
DIVES.push({ id: 'mindset', title: 'What trading actually is', sub: 'Before you touch a chart: what you’re actually here to learn, and the one mindset that blows up accounts.', secs: [
  { id: 'skill', title: 'Trading is a skill', body: '', w: (el, d) => wLearn(el, () => wQs(el, d, [
    { q: 'What is day trading?', o: ['Predicting where price is likely to go today, with high probability', 'Getting rich fast', 'Buying stocks for years'], why: 'A prediction skill. Money is the side effect of getting good at it.' },

    { t: 'A skill, like a sport', p: '<p>Trading isn’t about making money today. It’s a <b>skill</b>, like basketball. You get paid as a side effect of getting good at it, not because you showed up wanting money.</p>' },
    { t: 'The working definition', p: '<p class="k">Day trading = the ability to predict where price is likely to go, with high probability, on a daily basis.</p><p>You’ll hear this a lot. Everything in the school builds that one ability.</p>' },
    { t: '“I want to make money today”', p: '<p>That thought causes the exact habits that blow accounts: <b>FOMO entries</b>, <b>oversized risk</b> and <b>revenge trading</b>. The trader who sits down to <b>get better</b> today takes fewer, cleaner trades.</p>' },

] });

// ── Beginner · Liquidity & structure (new module, after Reading charts) ──
const LIQ_C = [K(21480, 21492, 21478, 21490), K(21490, 21502, 21488, 21499), K(21499, 21501, 21486, 21489), K(21489, 21497, 21484, 21495), K(21495, 21502, 21493, 21497), K(21497, 21499, 21482, 21485), K(21485, 21490, 21474, 21478), K(21478, 21507, 21477, 21505), K(21505, 21509, 21486, 21488), K(21488, 21490, 21470, 21473)];
const PD_C = cs([21400, 21420, 21438, 21452, 21468, 21480, 21471, 21460, 21447, 21438, 21452, 21470, 21490]).map((k) => ({ o: k.o, c: k.c, h: k.h + 2, l: k.l - 2 }));
const PD_LO = Math.min(...PD_C.slice(0, 6).map((k) => k.l)), PD_HI = Math.max(...PD_C.slice(0, 6).map((k) => k.h)), PD_EQ = (PD_LO + PD_HI) / 2;
DIVES.push({ id: 'liq', title: 'Liquidity & structure', sub: 'Why price moves where it does: resting orders, sweeps, breaks of structure, fair value gaps, premium and discount.', secs: [
  { id: 'what', title: 'Liquidity = resting orders', body: '', w: (el, d) => wLearn(el, () => wTap(el, d, { spec: { c: LIQ_C, ann: [{ k: 'h', p: 21502, i0: 1, i1: 4.5, col: 'ink2', t: 'equal highs', tpos: 'l' }] }, q: 'Price makes two equal highs at ~21,502. Tap the candle that <b>sweeps</b> them.', hit: hitCandle([7], 'Wicked above the highs, filled the orders, then the next candle dumped.', 'Find the candle whose wick pokes above the two highs.') }), [
    { t: 'The whole definition', p: '<p class="k">Liquidity = resting orders.</p><p>The market needs orders to move at all, so price is <b>drawn toward</b> places where lots of orders are waiting.</p>', term: 'LIQUIDITY' },
    { t: 'Where the orders sit', p: '<p><b>Above highs</b>: buy orders (breakout buyers getting in + short sellers’ stop losses). <b>Below lows</b>: sell orders (breakdown sellers + long buyers’ stops). Two stacked sets of orders at every obvious high and low.</p>' },
    { t: 'Why the sweep happens', p: '<p>Most retail traders buy above highs and sell below lows, predictably. Big players need a lot of opposite orders to fill their size, so price gets pushed <b>just past</b> the high or low to trigger those orders, then reverses. That’s the <b>sweep</b> (or stop hunt).</p>', term: 'SWEEP' },
    { t: 'A sweep is a chance, not a signal', p: '<p>A sweep only gives price the <b>opportunity</b> to reverse. It doesn’t guarantee it. That’s why the next lessons (break of structure, fair value gaps) exist: they confirm it.</p>' },
  ]) },
  { id: 'best', title: 'The best liquidity', body: '', w: (el, d) => wLearn(el, () => wQs(el, d, [
    { q: 'Which is the stronger magnet for price?', o: ['Three highs stacked close together', 'One random high', 'The middle of a range'], why: 'More highs stacked = more orders in one place.' },
    { q: 'Yesterday’s high and low are called…', o: ['PDH / PDL', 'FVG', 'BOS'], why: 'Previous day high / low: strong higher-timeframe draws.' },
    { q: 'Asia made a high overnight. Why does London or New York care?', o: ['New money targets the previous session’s highs and lows', 'It doesn’t', 'Asia levels are never traded'], why: 'Each session tends to run the last session’s levels.' },
  ]), [
    { t: 'Session highs and lows', p: '<p>Every session (Asia, London, New York) leaves a high and a low. When the next session’s money arrives, it often goes after them. Confluence Master marks them for you.</p>', term: 'SESSIONS' },
    { t: 'Previous day high and low', p: '<p>The high and low of the whole previous day. A strong higher-timeframe draw, often the target for the day.</p>', term: 'PDH / PDL' },
    { t: 'Low-resistance liquidity', p: '<p>Several highs (or lows) stacked close together with little in between. More orders packed into one small area = a stronger magnet.</p>', term: 'LRL' },
    { t: 'Equal highs and lows', p: '<p>Two or more highs at almost the same price. Same idea: orders doubled up in one precise spot, so it’s a high-probability target.</p>', term: 'EQL' },
  ]) },
  { id: 'bos', title: 'Break of structure', body: '', w: (el, d) => wLearn(el, () => wQs(el, d, [
    { q: 'Uptrend. A candle wicks below the last low but closes back above it. Break of structure?', o: ['No, it needs a close beyond the level', 'Yes', 'Only on the 1H'], why: 'Wicks don’t count. Closes do.' },
    { q: 'Which low do you watch for a break?', o: ['The most recent swing low in the trend', 'Any old low', 'The daily low'], why: 'Only the most recent swing matters.' },
    { q: 'Liquidity sweep, then break of structure. What did the BOS add?', o: ['Confirmation that the orders were filled and the trend changed', 'A target', 'Nothing'], why: 'Sweep = opportunity. BOS = confirmation.' },
  ]), [
    { t: 'Break of structure (BOS)', p: '<p>In an uptrend, structure breaks to the downside when a candle <b>closes below the most recent low</b>. In a downtrend, when a candle <b>closes above the most recent high</b>.</p>', term: 'BOS' },
    { t: 'Close, not wick', p: '<p>A wick poking through doesn’t count. Only a full candle <b>close</b> beyond the level. And only the <b>most recent</b> swing: older lows don’t matter.</p>' },
    { t: 'Where it fits', p: '<p class="k">Liquidity sweep (opportunity) → break of structure (confirmation) → continuation (next lesson)</p>' },
  ]) },
  { id: 'fvg', title: 'Fair value gaps', body: '', w: (el, d) => wLearn(el, () => wTap(el, d, { spec: { c: ECHO_C.slice(0, 12), slots: ECHO_C.length, ann: [{ k: 'band', lo: ECHO.fvgLo, hi: ECHO.fvgHi, i0: 7.5, i1: 10.5, col: 'ice', t: 'FVG', at: HIDE }] }, q: 'Tap the <b>middle candle</b> of the fair value gap: the fast candle that left the gap.', hit: hitCandle([9], 'That expansion candle moved so fast the wicks either side don’t overlap.', 'Find the big fast candle, then check the wicks either side of it don’t touch.') }), [
    { t: 'A three-candle gap', p: '<p>When a middle candle moves so fast that the <b>1st candle’s wick and the 3rd candle’s wick don’t overlap</b>, the empty space is a fair value gap. The colors of candles 1 and 3 don’t matter.</p>', term: 'FVG' },
    { t: 'Bullish and bearish', p: '<p><b>Bullish FVG</b>: from a strong up candle. A lack of sell orders in that zone. <b>Bearish FVG</b>: from a strong down candle. A lack of buy orders. When price comes back, it can move through quickly in the gap’s direction.</p>' },
    { t: 'Not a gap / a dead gap', p: '<p>If the wicks overlap, there’s no imbalance: no FVG. If a candle later <b>closes through</b> the gap, it’s been <b>disrespected</b>. That often means the trend is changing: the next lesson.</p>' },
  ]) },
  { id: 'ifvg', title: 'Inverse fair value gaps', body: '', w: (el, d) => wLearn(el, () => wQs(el, d, [
    { q: 'What is an inverse FVG?', o: ['A gap that price closed through, flipping its meaning', 'A gap upside down on the chart', 'A small gap'], why: 'Closed through = inverted.' },
    { q: 'Why can it beat waiting for a break of structure?', o: ['It often confirms earlier, so the stop is smaller and the R:R better', 'It never fails', 'It needs no context'], why: 'Earlier confirmation, tighter stop. Still needs context.' },
  ]), [
    { t: 'When a gap fails', p: '<p>An FVG is supposed to support the trend. When a candle <b>closes through it</b>, it’s an <b>inverse FVG</b>: a sign the trend is likely reversing. The inverted gap often acts as the new level in the other direction.</p>', term: 'IFVG' },
    { t: 'Earlier, tighter', p: '<p>An inversion often happens <b>before</b> a full break of structure. Entering off it can mean a much smaller stop and a better risk-to-reward on the same move. It still needs context: liquidity swept, trend, a draw.</p>' },
  ]) },
  { id: 'pd', title: 'Premium & discount', body: '', w: (el, d) => wLearn(el, () => wQs(el, d, [
    { q: 'Uptrend. Where do you look for buys?', o: ['Discount: below the 50% of the swing', 'Premium: above the 50%', 'Anywhere'], why: 'Buy cheap, sell expensive.' },
    { q: 'Which swing do you measure?', o: ['The most recent connected swing low to swing high', 'Any swing from last month', 'The daily range always'], why: 'Most recent swing in the current trend.' },
  ]), [
    { t: 'Equilibrium', p: '<p>Draw from the most recent swing low to the most recent swing high. The <b>50%</b> line is equilibrium. Above it is <b>premium</b> (expensive). Below it is <b>discount</b> (cheap).</p>', spec: { c: PD_C, ann: [{ k: 'band', lo: PD_EQ, hi: PD_HI, i0: 0, i1: 6, col: 'loss', t: 'premium', fill: 0.08 }, { k: 'band', lo: PD_LO, hi: PD_EQ, i0: 0, i1: 6, col: 'win', t: 'discount', fill: 0.08 }, { k: 'h', p: PD_EQ, i0: 0, col: 'ink2', t: '50% · equilibrium', tpos: 'l' }, { k: 'arrow', i: 9, p: PD_C[9].l, dir: 'up', col: 'win', t: 'buy in discount', at: 9 }] } },
    { t: 'Buy cheap, sell expensive', p: '<p>In an uptrend, look for buys when price pulls back <b>into discount</b>, not while it’s up in premium. Fair value gaps and premium/discount are the two “continuation” tools: either one shows the trend is likely to keep going.</p>' },
  ]) },
] });

// ── Intermediate · Bias, timing, SMT & gaps ──
DIVES.push({ id: 'bias', title: 'Daily bias & timing', sub: 'Decide the direction before the open, know when the moves happen, and read NQ against ES.', secs: [
  { id: 'build', title: 'Build your bias before the open', body: '', w: (el, d) => wLearn(el, () => wDoIt(el, d, ['Marked the higher-timeframe trend (1H / 4H)', 'Marked the draws: PDH/PDL, session highs/lows, equal highs/lows', 'Checked: has price just swept a level or broken structure?', 'Wrote my bias for today with one line of reasoning', 'After the close: compared my bias to what actually happened'], 'Do this every morning for 5 days. Bias can be wrong: the skill is letting the market prove it and adapting.'), [
    { t: 'Why bias comes first', p: '<p>You can’t look for an entry if you don’t know which way you expect price to go. Bias answers one question before the open: <b>where does price want to go today?</b></p>' },
    { t: 'The four steps', p: '<ol style="margin:6px 0;padding-left:20px;display:grid;gap:6px"><li><b>Trend</b> on the higher timeframe: up, down or sideways.</li><li><b>Draws</b> in that direction: stacked highs/lows, session levels, PDH/PDL.</li><li><b>What just happened</b>: a sweep? A break of structure or an inversion?</li><li><b>Continuation</b>: is price holding a gap or sitting in discount/premium, or due to pull back first?</li></ol>' },
    { t: 'Bias can be wrong', p: '<p>That’s fine. A good trader lets the market prove the bias wrong and adapts, instead of forcing trades to match an opinion.</p>' },
  ]) },
  { id: 'time', title: 'When the moves happen', body: '', w: (el, d) => wLearn(el, () => wClock(el, d, [
    { q: 'Drag into the New York <b>manipulation window</b>.', ok: (m) => m >= 9 * 60 + 30 && m < 9 * 60 + 50, why: '9:30–9:50: new money arrives and fakes a direction.', hint: 'Right after the 9:30 open.' },
    { q: 'Drag into the typical <b>entry window</b> after it.', ok: (m) => m >= 9 * 60 + 50 && m <= 10 * 60 + 10, why: '9:50–10:10 is where the cleanest entries usually come.', hint: 'Just before and after 10:00.' },
    { q: 'Drag to roughly when you <b>stop looking</b> if nothing has set up.', ok: (m) => m >= 10 * 60 + 25 && m <= 10 * 60 + 40, why: 'Around 10:30 the edge fades. No setup = no trade.', hint: 'Half an hour after 10:00.' },
  ]), [
    { t: 'Each session runs the last one', p: '<p>Asia, London and New York each bring new money, and that money tends to go after the previous session’s highs and lows. That’s why you mark them every morning.</p>', term: 'SESSIONS' },
    { t: 'The New York open', p: `<p>Typical windows (not hard rules):</p>${TABLE([['9:30 – 9:50', 'Manipulation', 'the fake move'], ['9:50 – 10:10', 'Entries', 'cleanest setups'], ['~10:30', 'Stop looking', 'if nothing set up']])}` },
  ]) },
  { id: 'smt', title: 'SMT: NQ vs ES', body: '', w: (el, d) => wLearn(el, () => wQs(el, d, [
    { q: 'At a key high, ES makes a higher high but NQ makes a lower high. What is it?', o: ['Bearish SMT divergence', 'Bullish SMT', 'Nothing'], why: 'They disagree at a high: bearish for both.' },
    { q: 'Which one do you trade?', o: ['The leading one, already showing the reversal', 'The lagging one', 'Both, double size'], why: 'Trade the one that already turned.' },
    { q: 'SMT in the middle of nowhere, far from any level?', o: ['Means little. It matters at a significant draw', 'Always trade it', 'Always fade it'], why: 'Divergences happen constantly. Context is what counts.' },
  ]), [
    { t: 'Two indexes that should agree', p: '<p>NQ (Nasdaq) and ES (S&P 500) usually move together. When they <b>disagree</b> at the same moment at a key level, that’s <b>SMT divergence</b>.</p>', term: 'ES CONF' },
    { t: 'Bullish and bearish', p: '<p><b>Bearish</b>: one sweeps a high and makes a lower high while the other makes a higher high. <b>Bullish</b>: one makes a higher low while the other makes a lower low. Expect the lagging one to follow the leader.</p>' },
    { t: 'Only at a level', p: '<p>SMT is powerful <b>at a significant draw on liquidity</b>. Away from one, it happens all the time and means little.</p>' },
  ]) },
  { id: 'gaps', title: 'Opening gaps', body: '', w: (el, d) => wLearn(el, () => wQs(el, d, [
    { q: 'The gap between Friday’s close and Sunday’s open is the…', o: ['New week opening gap', 'Fair value gap', 'Daily range'], why: 'NWOG. Usually bigger and more tradable than daily gaps.' },
    { q: 'What does price often do with an opening gap?', o: ['Come back to fill it, before or after continuing', 'Ignore it forever', 'Reverse at its exact middle every time'], why: 'Gaps are often filled. Use them as targets or entry areas.' },
  ]), [
    { t: 'New day opening gap', p: '<p>The jump between one day’s close and the next day’s open, across the daily break. Price often comes back to fill it.</p>' },
    { t: 'New week opening gap', p: '<p>Between <b>Friday’s close and Sunday’s open</b>. More time (and weekend news) passes, so it’s usually bigger and more useful. The most important of the opening gaps.</p>', term: 'NWOG' },
  ]) },
] });

// ── Advanced · H/L full breakdown (before the replay) ──
DIVES.push({ id: 'hl-learn', title: 'H/L: the full breakdown', sub: 'Mark a range, wait for a sweep, take the reversal back to the other side. Runs on NYFLOW and ASIAFLOW.', secs: [
  { id: 'model', title: 'The model in one sentence', body: '', w: (el, d) => wLearn(el, () => wQs(el, d, [
    { q: 'What are the H/L steps, in order?', o: ['Mark the range → wait for a sweep of one side → reversal toward the other side', 'Buy the breakout of the range', 'Trade inside the range'], why: 'Range, sweep, reversal.' },
    { q: 'The cutoff time passes with no sweep of either side. What now?', o: ['No trade. Stop looking for it', 'Take the best-looking move', 'Trade the range middle'], why: 'A no-trade day is the model working.' },
  ]), [
    { t: 'One sentence', p: '<p class="k">Mark the range high and low. Wait for a sweep of one side. Look for the reversal back toward the other side.</p><p>Simple, tested for years, and you get several chances to look for it every day.</p>' },
    { t: '1 · Mark the range', p: '<p>The <b>range high</b> and <b>range low</b> are the highest high and lowest low of a set time window. For the New York morning that’s the pre-market (about <b>7:00–9:25</b>). Mark both before the window ends.</p>', spec: { c: CH_SR, ann: [{ k: 'h', p: 21536, i0: 0, col: 'ice', t: 'range high', tpos: 'l' }, { k: 'h', p: 21500, i0: 0, col: 'ice', t: 'range low', tpos: 'l', below: true }] } },
    { t: '2 · The execution window and cutoff', p: '<p>After the range forms, there’s a window when you’re allowed to look for the setup. If the cutoff arrives and <b>neither side was swept</b>, the session is a <b>no-trade</b>. That one rule alone keeps you out of bad days.</p>' },
  ]) },
  { id: 'entry', title: 'Sweep, trigger, stop, target', body: '', w: (el, d) => wLearn(el, () => wQs(el, d, [
    { q: 'The range LOW was swept. Which way do you look?', o: ['Long, back toward the range high', 'Short, continuing lower', 'Either'], why: 'Low swept → reversal up.' },
    { q: 'Which are the two valid entry triggers?', o: ['An inverse FVG, or a structure shift with a fresh FVG', 'Any green candle', 'An RSI cross'], why: 'IFVG, or MSS + FVG. Wait for the close.' },
    { q: 'Where does the default target go?', o: ['The opposite side of the range', 'Double the stop, always', 'A round number'], why: 'Low swept → target the range high.' },
    { q: 'A setup completes in the first 30 minutes of the window. Grade?', o: ['The highest-quality version (A+)', 'Lower quality', 'Not valid'], why: 'Early in the window is the best version.' },
  ]), [
    { t: '3 · The sweep sets the bias', p: '<p>Inside the window, your only job is to watch for price to trade through the range high or low. <b>Low swept → look long toward the high. High swept → look short toward the low.</b></p>' },
    { t: '4 · Two valid triggers', p: '<p><b>A: inverse FVG.</b> After the sweep, a gap gets closed through in the reversal direction. Enter on that close.</p><p><b>B: structure shift + FVG.</b> Price breaks a recent swing point and leaves a fresh gap. Use that gap as the entry zone.</p>', term: 'IFVG' },
    { t: 'Stop, target, grade', p: '<p><b>Stop</b>: at the swept extreme, or at the inversion gap. <b>Target</b>: the opposite side of the range. <b>A+</b>: the setup completes in the first 30 minutes of the window.</p>' },
    { t: 'Take something off', p: '<p>Not every trade reaches the full target. Taking partials along the way is normal and healthy. Don’t give back a good trade insisting on the last point.</p>' },
  ]) },
  { id: 'windows', title: 'When it runs', body: '', w: (el, d) => wLearn(el, () => wClock(el, d, [
    { q: 'Drag into the New York <b>range-building</b> time.', ok: (m) => m >= 7 * 60 && m < 9 * 60 + 25, why: 'About 7:00–9:25: mark the high and low.', hint: 'The pre-market, before 9:30.' },
    { q: 'Drag into the A+ window right after the open.', ok: (m) => m >= 9 * 60 + 30 && m <= 10 * 60, why: '9:30–10:00: the first 30 minutes.', hint: 'The first half hour after 9:30.' },
    { q: 'Drag into the <b>Asia</b> session, where the same H/L logic runs.', ok: (m) => inSess(SESS[0], m), why: 'Asia, 8 PM–12 AM, on ASIAFLOW.', hint: 'The evening session.' },
  ]), [
    { t: 'Several chances a day', p: `<p>The same range → sweep → reversal logic repeats in different windows:</p>${TABLE([['New York AM', 'range ~7:00–9:25', 'A+ 9:30–10:00'], ['Lunch / PM', 'range ~11:30–1:30', 'window to ~3:00'], ['Asia', '8 PM – 12 AM', 'on ASIAFLOW']])}<p>Start with the New York morning. Back-test the later windows before trading them.</p>` },
  ]) },
  { id: 'rules', title: 'Discipline rules', body: '', w: (el, d) => wLearn(el, () => wDoIt(el, d, ['For two weeks: marked the range high/low every day and logged whether a sweep happened, and which side', 'Logged which trigger appeared (IFVG or structure shift + FVG)', 'Counted no-trade days vs valid setups', 'Compared A+ (first 30 min) trades to later ones'], 'That log tells you how often the model really shows up. Now replay a real morning in the next lesson.'), [
    { t: 'Three rules', p: '<ul><li><b>Skip big news days</b> (e.g. the day before NFP), however good it looks.</li><li><b>No sweep by the cutoff = no trade.</b> Walking away is following the rules.</li><li><b>Take partials.</b> Don’t demand the full target every time.</li></ul>' },
    { t: 'The cheat sheet', p: '<ol style="margin:6px 0;padding-left:20px;display:grid;gap:4px"><li>Mark range high/low for the window.</li><li>Know the execution window and cutoff.</li><li>Wait for a sweep of one side: that’s your bias.</li><li>Enter on an IFVG or structure shift + FVG.</li><li>Stop at the swept extreme or the inversion gap.</li><li>Target the other side of the range.</li><li>First 30 minutes = A+.</li><li>No sweep by the cutoff = no trade.</li></ol>' },
  ]) },
] });

// ── Advanced · PO3 full breakdown (before the replays) ──
DIVES.push({ id: 'po3-learn', title: 'PO3: the full breakdown', sub: 'Accumulation, manipulation, distribution: the pattern behind almost every move. Runs on NYFLOW and ASIAFLOW.', secs: [
  { id: 'fractal', title: 'A lens, not a single setup', body: '', w: (el, d) => wLearn(el, () => wQs(el, d, [
    { q: 'On which timeframes does PO3 show up?', o: ['All of them: it’s fractal', 'Only the 5m', 'Only the daily'], why: 'Same three phases at every zoom level.' },
    { q: 'What is PO3, really?', o: ['A way of reading every move: range, trap, real move', 'A single indicator signal', 'A news strategy'], why: 'It’s the structure behind other setups.' },
  ]), [
    { t: 'Three phases, every move', p: '<p>Every move cycles through <b>Accumulation</b> (sideways range), <b>Manipulation</b> (the fake move that sweeps liquidity) and <b>Distribution</b> (the real move). Also called Power of Three.</p>', term: 'PO3' },
    { t: 'It’s fractal', p: '<p>The same pattern plays out on the 1-minute, the 5-minute, the hourly and the daily. Only the size changes. Learn to see it as a lens you look through, not a box you tick once.</p>' },
  ]) },
  { id: 'phases', title: 'The three phases', body: '', w: (el, d) => wLearn(el, () => wQs(el, d, [
    { q: 'Price is chopping sideways in a tight range. Trade it?', o: ['No: accumulation is a no-trade zone', 'Yes, buy the bottom of the range', 'Yes, short the top'], why: 'You get chopped up with no edge.' },
    { q: 'Price breaks hard out of the range, against the higher-timeframe trend. Most likely?', o: ['Manipulation: the trap before the real move', 'The real move', 'A sign to stop trading'], why: 'Breaking the range against the trend is usually the trap.' },
    { q: 'Which phase pays?', o: ['Distribution', 'Accumulation', 'Manipulation'], why: 'The real move after the trap.' },
  ]), [
    { t: 'Accumulation: don’t touch it', p: '<p>Price chops sideways. It looks like it’s “about to break out”, which is exactly why people jump in too early. <b>No directional edge yet. No trade.</b></p>' },
    { t: 'Manipulation: the trap', p: '<p>A sharp move through one edge of the range, sweeping the stops and breakout orders there. It <b>looks</b> directional, but its job is to fuel the opposite move.</p>' },
    { t: 'Distribution: the real move', p: '<p>Once the liquidity is cleared, price moves in its true direction. Ideally that lines up with the higher-timeframe trend. This is the phase you’re trying to catch.</p>' },
  ]) },
  { id: 'trend', title: 'Rule #1: trade with the trend', body: '', w: (el, d) => wLearn(el, () => wQs(el, d, [
    { q: 'Higher timeframe is trending up. Which PO3 do you want?', o: ['Manipulation lower, distribution higher', 'Manipulation higher, distribution lower', 'Either, same quality'], why: 'Manipulate against the trend, distribute with it.' },
    { q: 'Price just broke below the accumulation range. What do you ask?', o: ['“Is this distribution, or the manipulation trap?” Check the trend', '“How fast can I short?”', 'Nothing'], why: 'The trend answers it fastest.' },
  ]), [
    { t: 'The biggest edge in PO3', p: '<p>If the higher timeframe is going up, look for manipulation to the <b>downside</b> and distribution <b>up</b>, with the trend. Fighting the trend is the lower-quality trade, every time.</p>' },
    { t: 'The mistake everyone makes', p: '<p>Price breaks out of the range down, and instinct says “we broke the range, it must keep falling”. During manipulation that’s exactly backwards. Treat the breakout as a possible trap and check it against the trend first.</p>' },
  ]) },
  { id: 'stack', title: 'Stack the confluence', body: '', w: (el, d) => wLearn(el, () => wDoIt(el, d, ['Marked accumulation, manipulation and distribution on 10 charts', 'For each: did distribution go with or against the higher-timeframe trend?', 'Found FVGs with a swing low (or high) inside them', 'Logged how often PO3 lined up with 9:30 or 10:00'], 'That’s the pattern-recognition muscle. Now replay it at both its New York and Asia times.'), [
    { t: 'What makes a PO3 high quality', p: `${TABLE([['FVG + swing point', 'a gap with a swing low inside it'], ['Gap not closed through', 'the market wants that direction'], ['Key time', '9:30 / 10:00 NY, 8 PM Asia'], ['Equal highs / lows', 'the obvious draw for distribution'], ['Order block respected', 'adds confidence']])}<p>Recognise the structure first. A lower-timeframe inverse FVG can refine the entry once it’s clear.</p>`, term: 'OB' },
  ]) },
] });

// ── Echo: more depth (concepts only) ──
addSecs('echo', [
  { id: 'narrative', title: 'Build the narrative first', body: '<p>No draw on liquidity, no trade. Before any Echo, decide which way you’re allowed to trade and where it pays.</p>', w: (el, d) => wLearn(el, () => wQs(el, d, [
    { q: 'The draw you were trading toward has already been hit. What now?', o: ['The trade is done: no new entries toward a target that’s gone', 'Take another entry toward it', 'Double size'], why: 'Confirm the draw is still open before every entry.' },
    { q: 'Price is at all-time highs. Short the rejection?', o: ['No: there’s no draw above, price retraces into its range and continues', 'Yes, it’s the top', 'Yes, with a wide stop'], why: 'Never fade the high. Near all-time highs the model works the same: with the trend.' },
    { q: 'Your draw is higher. Which trades are allowed?', o: ['Longs only', 'Shorts only', 'Both'], why: 'Never trade against your draw.' },
  ]), [
    { t: 'Mark the map', p: '<ol style="margin:6px 0;padding-left:20px;display:grid;gap:4px"><li><b>1H and 4H fair value gaps</b>: unfilled ones are where price is likely headed.</li><li><b>Key opens</b>: midnight, 6 PM, 8 PM, 10 AM, and the new week opening gap.</li><li><b>Liquidity pools</b>: prominent 1H highs/lows, equal highs/lows, Asia and London highs/lows, previous day high/low.</li></ol>' },
    { t: 'Pick the draw', p: '<p>The nearest prominent unfilled higher-timeframe gap, key open or untaken high/low in your direction. That’s your <b>target and your bias</b>. Then locate yourself: below the 50% of the 1H range is discount (favour longs), above is premium (favour shorts).</p>' },
    { t: 'Direction rules', p: '<ul><li>Trade with the <b>4H trend</b>.</li><li>Never trade against your draw.</li><li>Draw already hit = the trade is done.</li><li>Never short all-time highs, and don’t widen your stop near them.</li></ul>' },
  ]) },
], 0);
addSecs('echo', [
  { id: 'valid', title: 'Is it a real rejection?', body: '', w: (el, d) => wLearn(el, () => wQs(el, d, [
    { q: 'A wick sweeps the high but the candle closes ONE point back below it. Valid rejection?', o: ['Yes: even a one-point failure to close counts', 'No, it needs 10 points', 'Only on the 4H'], why: 'Sweep + no close beyond = rejection.' },
    { q: 'Which is stronger?', o: ['A sweep of the high that started the range (external)', 'A sweep of a minor high inside it (internal)', 'Same'], why: 'External beats internal.' },
    { q: 'A clean-looking wick at 4 PM with no gap or level behind it?', o: ['Ignore it: random wicks get blown through', 'Take it', 'Take it with double size'], why: 'Only wicks rejecting out of a PD array with confluence.' },
    { q: 'Price closed through your level earlier today. Use it again?', o: ['No: a closed-through level is dead', 'Yes, as support now', 'Only on Fridays'], why: 'Closed through = dead. No second life.' },
  ]), [
    { t: 'Two things make a rejection block', p: '<p>1. A wick <b>sweeps</b> a level that holds liquidity. 2. The candle <b>fails to close</b> beyond it. Even a one-point failure to close counts. The wick is the block.</p>', term: 'RB' },
    { t: 'External beats internal', p: '<p>A sweep of the high (or low) that <b>started</b> the range is stronger than a sweep of a minor high inside it. Find the rejection on a higher timeframe, then look at a lower one for the single most rejected wick.</p>' },
    { t: 'Every trade needs a gap behind it', p: `<p>The 4H and 1H are the <b>narrative</b>: the trend, what you deliver out of and what you trade toward. The lower timeframes are where the entry gets <b>refined</b>, only once that story is set. A wick with no higher-timeframe story behind it “looks” like a rejection and gets blown through.</p>${TABLE([['4H · 1H', 'trend, narrative & draw'], ['Lower timeframes', 'confirmation & the entry'], ['Low timeframe, no HTF story', 'chop']])}` },
    { t: 'CISD needs a retest', p: '<p>A CISD with no retest is just a candle close. You want price to come back, wick into the CISD level, and <b>fail to close through it</b>. If it never comes back for a while, the CISD stops being an entry and becomes liquidity price may sweep.</p>', term: 'CISD' },
    { t: 'Dead levels', p: '<p>Once price <b>closes through</b> a level on its timeframe, it’s dead: no using it as support afterwards. And a level that already reacted and played out isn’t taken again.</p>' },
  ]) },
  { id: 'losses', title: 'Why Echo trades lose', body: '<p>Almost every loss traces back to one of these. Name the cause after every losing trade.</p>', w: (el, d) => wLearn(el, () => wQs(el, d, [
    { q: 'Stopped by a few points, then price reverses exactly as planned. An untapped higher-timeframe gap sat just past your level. Cause?', o: ['Price needed to tap that gap first', 'Bad luck', 'The model is broken'], why: 'Wait for the gap to be tapped, then look for the rejection out of it.' },
    { q: 'NQ runs the high and takes your stop while ES doesn’t, then it dumps. What was that?', o: ['An SMT sweep', 'A breakout', 'News'], why: 'Leave room for SMT sweeps at key highs/lows.' },
    { q: 'You’ve hit your daily loss cap, then a perfect setup forms. Taking it is…', o: ['Overtrading / revenge', 'Persistence', 'A new strategy'], why: 'Respect the daily cap. The setup will come again.' },
  ]), [
    { t: 'The usual suspects', p: `${TABLE([['No HTF gap behind it', 'the wick gets blown through'], ['Untapped gap just past the level', 'stopped, then it works'], ['SMT sweep', 'NQ/ES run one high, then dump'], ['Used level', 'reacted earlier, fails now'], ['Draw already taken', 'valid entry, nowhere to go'], ['Against the 4H trend', 'the biggest leak in the backtest'], ['Against the draw / shorting ATH', 'fighting the bigger move'], ['Forcing it in chop', 'no gaps = no trade']])}` },
    { t: 'The one-line version', p: '<p>Most stop-outs come from a level that wasn’t the <b>true point of rejection</b>, or a trade against the 4H trend. Ticking extra boxes doesn’t fix it: trend + the real rejection + an open draw does.</p>' },
  ]) },
  { id: 'daily', title: 'Daily rules', body: '', w: (el, d) => wLearn(el, () => wDoIt(el, d, ['Wrote my daily limits where I can see them', 'Checked the news calendar before the session', 'Before every order: draw still open, gap behind it, under my daily limit'], 'These rules are what make the model work. Discipline, not the setup, is the edge.'), [
    { t: 'A fixed daily cap', p: `${TABLE([['Hit your loss cap', 'done for the day'], ['Hit your trade cap', 'done'], ['One trade at a time', 'never stack positions']])}<p>Your exact caps are set with you, based on your account. Ask after any loss: <b>“Would I rather be down one trade, or at my daily loss limit?”</b></p>` },
    { t: 'Losing streaks are real', p: '<p>Five years of data includes long losing streaks, in good years too. They don’t mean the model broke. Size so the <b>worst streak</b> can’t end your account, not for the average day.</p>' },
    { t: 'Discipline', p: '<ul><li>Write your rules down. If the list says size down and you don’t, that’s on you.</li><li>Accept the risk before you enter. If the loss bothers you, the size is wrong.</li><li>Don’t stare at charts all day without a model: that’s how you invent setups. Let alerts bring you to your levels.</li><li>Skipping a session when you feel off is a valid decision.</li></ul>' },
  ]) },
]);

// ── Orbit: more depth (concepts only) ──
addSecs('orbit', [
  { id: 'when', title: 'When Orbit works', body: '', w: (el, d) => wLearn(el, () => wQs(el, d, [
    { q: 'NQ has run straight up for weeks with barely any pullbacks. Orbit?', o: ['Rarely: no retracements means no OTE entries', 'Perfect conditions', 'Only shorts'], why: 'Orbit needs pullbacks. In expansion, use Echo and keep OTE as confluence.' },
    { q: 'How many areas of interest at once?', o: ['One', 'As many as you can draw', 'At least three'], why: 'Juggling several = looking for reasons to trade.' },
    { q: 'An OTE level is hit and price blows straight through with no inversion. What does that tell you?', o: ['Your bias or your range was wrong: zoom out and redraw', 'Add to the trade', 'Nothing'], why: 'No inversion, no trade. Re-read the chart.' },
  ]), [
    { t: 'A map, not a trigger', p: '<p>In the backtest, Orbit on its own wasn’t where the edge came from. It tells you <b>where</b> a pullback should end. The trade comes when price reaches that zone, confirms, and it lines up with the <b>4H trend</b> and an open draw.</p>' },
    { t: 'Orbit needs retracements', p: `<p>Orbit trades the pullback after a big move, so it shines in <b>two-sided, consolidating</b> markets. In a one-way expansion, price never pulls back deep enough and there are no entries.</p>${TABLE([['Consolidation', 'Orbit'], ['One-way expansion', 'Echo, OTE as confluence'], ['Big news move', 'wait for the deep pullback']])}` },
    { t: 'The area of interest', p: '<p>The best area of interest is the deep pullback zone of a <b>large move that broke out of a long consolidation</b>, and hasn’t been retraced into yet. The bigger the time range behind it, the more it’s worth. <b>One area at a time.</b></p>' },
    { t: 'It has to go somewhere first', p: '<p>Check the 1H and 4H for untapped gaps: they’re the draw. To go down, price usually has to retrace up into a level first. And trade with the original play: don’t long small bounces while the big move still has to reach its low.</p>' },
  ]) },
], 0);
addSecs('orbit', [
  { id: 'confirm', title: 'Confirmation, not anticipation', body: '', w: (el, d) => wLearn(el, () => wQs(el, d, [
    { q: 'Price is near the zone but hasn’t reached it. A gap inverts. Enter?', o: ['No: nothing counts until the zone is actually reached', 'Yes, close enough', 'Yes, with a bigger stop'], why: 'Jumping the gun is the #1 Orbit loss.' },
    { q: 'Which gap’s inversion counts?', o: ['A fresh gap formed out of the zone', 'Any old gap on the chart', 'A gap that already inverted earlier'], why: 'Fresh gaps only. Old or already-inverted gaps don’t count.' },
