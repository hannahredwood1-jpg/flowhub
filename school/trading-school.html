    return { c, ann: [H(1, 'H'), L(3, 'L'), { ...H(5, 'HH'), say: 'Higher high.' }, { ...L(7, 'HL'), say: 'Higher low.' }, H(9, 'HH'), L(11, 'HL'), { ...H(13, 'HH'), say: 'Higher highs and higher lows = uptrend. No indicators needed.' }] };
  }, cap: 'Just candles. Higher highs (HH) and higher lows (HL) tell you the trend.', rel: ['BOS', 'RT'] },

  // Risk Management
  { ab: 'SL', full: 'Stop Loss', cat: 1, def: 'Automatically closes a trade to limit losses.', vis() {
    const c = cs([20, 21, 20.6, 22, 21.4, 20, 18.2, 16.4, 15, 13.8]);
    const hit = c.findIndex((k) => k.l <= 17);
    return { c, ann: [
      { k: 'h', p: 21, i0: 0.5, i1: hit, col: 'ice', t: 'ENTRY · long', at: 0, say: 'Long at 21. The stop loss sits below at 17.' },
      { k: 'h', p: 17, i0: 0.5, i1: hit, col: 'loss', t: 'SL', below: true, at: 0 },
      { k: 'x', i: hit, p: 17, col: 'loss', t: 'SL hit · out', pos: 'below', dx: -18, at: hit, say: 'Price hits the stop. The trade closes automatically. Loss capped.' },
      { k: 'tag', i: 8, p: c[8].l, dy: 16, t: 'kept falling', col: 'ink3', at: 8, say: 'Price kept falling, but you were already out.' }] };
  }, cap: 'Price hits your stop loss and the trade closes on its own, before the loss gets bigger.', rel: ['TP', 'BRACKET', 'BE'] },
  { ab: 'TP', full: 'Take Profit', cat: 1, def: 'Automatically closes a trade to secure profits.', vis() {
    const c = cs([20, 21, 21.5, 22.6, 22, 23.6, 25, 26.6, 27.4, 26, 24.4]);
    const hit = c.findIndex((k) => k.h >= 26);
    return { c, ann: [
      { k: 'h', p: 21, i0: 0.5, i1: hit, col: 'ice', t: 'ENTRY', below: true, at: 0, say: 'Long at 21 with a take profit at 26.' },
      { k: 'h', p: 26, i0: 0.5, i1: hit, col: 'win', t: 'TP', tpos: 'l', at: 0 },
      { k: 'dot', i: hit, p: 26, col: 'win', t: 'TP hit · +profit', at: hit, say: 'Price touches the take profit. The trade closes and the profit is locked in.' },
      { k: 'tag', i: 9, p: c[9].l, dy: 14, t: 'price came back', col: 'ink3', at: 9, say: 'Price fell back afterwards, but the profit was already secured.' }] };
  }, cap: 'Price reaches your take profit and the trade closes on its own with the profit banked.', rel: ['SL', 'RR', 'BRACKET'] },
  { ab: 'RR', full: 'Risk to Reward Ratio', alias: 'RRR', cat: 1, def: 'Comparing potential profit to the amount being risked.', vis() {
    const c = cs([19, 20, 19.2, 18.4, 20.4, 22, 21.4, 24, 26, 25.4, 28, 29.6]);
    return { c, ann: [
      { k: 'band', lo: 17, hi: 20, i0: 0.5, col: 'loss', t: 'risk · 15-pt stop = 1R', tpos: 'below', at: 0, say: 'FLOWMTD standard: a 15-point stop. That’s your risk, called 1R.' },
      { k: 'band', lo: 20, hi: 28, i0: 0.5, col: 'win', fill: 0.07, t: 'reward · 40-pt target ≈ 2.7R', tx: 'r', at: 0, say: 'A 40-point target: 40 ÷ 15 ≈ 2.7R.' },
      { k: 'tag', i: 3, p: 26, t: 'RR 1:2.7', col: 'ink', big: true, at: 0 },
      { k: 'dot', i: 10, p: 28, col: 'win', at: 10, say: 'Risk 15 to make 40. Win just over 1 in 4 trades and you break even.' }] };
  }, cap: 'The FLOWMTD standard: 15-point stop, 40-point target, about 1:2.7. On 1 MNQ that’s $30 risked to make $80.', rel: ['SL', 'TP'] },
  { ab: 'BE', full: 'Break Even', cat: 1, def: 'Moving stop loss to entry so the trade can no longer lose.', vis() {
    const c = cs([19.5, 20, 21, 22, 23.4, 22.6, 21.6, 20.4, 19.4, 17.8, 16.4]);
    const k = 3, out = c.findIndex((q, i) => i > k && q.l <= 20);
    return { c, ann: [
      { k: 'h', p: 20, i0: 0.5, i1: k, col: 'ice', t: 'ENTRY', at: 0, say: 'Long at 20, stop at 17.' },
      { k: 'h', p: 17, i0: 0.5, i1: k, col: 'loss', t: 'SL', below: true, at: 0 },
      { k: 'h', p: 23, i0: k - 0.5, i1: k + 0.5, col: 'win', t: '1:1', at: k, dash: false, say: 'Price is 1:1 in your favor.' },
      { k: 'h', p: 20, i0: k, i1: out, col: 'signal', t: 'SL → BE', below: true, at: k, dash: false, say: 'Stop moves up to the entry: break even. This trade can’t lose now.' },
      { k: 'x', i: out, p: 20, col: 'signal', t: 'out at $0', pos: 'below', dx: 22, at: out, say: 'Price comes back and closes you out at $0 instead of a loss.' },
      { k: 'tag', i: 9, p: 17.8, dy: 16, t: 'the old stop would’ve been hit', col: 'ink3', at: 9, anchor: 'end', dx: 10 }] };
  }, cap: 'Once the trade is 1:1 in profit, the stop moves to entry. Worst case now: $0.', rel: ['SL', 'RR'], ch: 'dl' },
  { ab: 'DD', full: 'Drawdown', cat: 1, def: 'The amount an account is down from its highest balance.', vis() {
    const line = [50000, 50600, 51200, 50900, 51800, 52400, 51900, 51300, 50700, 51100, 51500];
    return { line, ann: [
      { k: 'h', p: 52400, i0: 5, col: 'ice', t: 'highest balance $52,400', at: 5, say: 'New highest balance: $52,400.' },
      { k: 'vr', i: 8, p0: 52400, p1: 50700, col: 'loss', t: 'DD −$1,700', at: 8, say: 'Now at $50,700. That’s $1,700 of drawdown from the peak.' }] };
  }, cap: 'Drawdown is measured from the highest balance, not from where you started.', rel: ['EVAL', 'DLL'] },

  // Trading Positions
  { ab: 'LONG', full: 'Buying Position', cat: 2, def: 'Entering a trade expecting price to rise.', vis() {
    const c = cs([18, 19, 18.6, 20, 21.6, 21, 23, 24.6, 26]);
    return { c, ann: [
      { k: 'arrow', i: 0, p: 18.6, dir: 'up', col: 'ice', t: 'BUY', at: 0, say: 'Buy here, expecting price to go up.' },
      { k: 'band', lo: 19, hi: 26, i0: 0.5, col: 'win', fill: 0.08, t: 'price up = profit', tx: 'r', tpos: 'below', at: 7, say: 'Price rises. The higher it goes, the more a long makes.' }] };
  }, cap: 'Buy first, sell later. You make money when price goes UP.', rel: ['SHORT', 'ENTRY'] },
  { ab: 'SHORT', full: 'Selling Position', cat: 2, def: 'Entering a trade expecting price to fall.', vis() {
    const c = cs([26, 25, 25.4, 24, 22.4, 23, 21, 19.4, 18]);
    return { c, ann: [
      { k: 'arrow', i: 0, p: 25.4, dir: 'down', col: 'loss', t: 'SELL', at: 0, say: 'Sell here, expecting price to go down.' },
      { k: 'band', lo: 18, hi: 25, i0: 0.5, col: 'win', fill: 0.08, t: 'price down = profit', tx: 'r', at: 7, say: 'Price falls. The lower it goes, the more a short makes.' }] };
  }, cap: 'Sell first, buy back later. You make money when price goes DOWN.', rel: ['LONG'] },
  { ab: 'ENTRY', full: 'Trade Entry', cat: 2, def: 'The price level where a trade is opened.', vis() {
    const c = cs([24, 23, 22, 21.4, 20.6, 21.8, 23, 24.2]);
    const f = c.findIndex((k) => k.l <= 21);
    return { c, ann: [
      { k: 'h', p: 21, col: 'ice', t: 'ENTRY 21', below: true, at: 0, say: 'Your order waits at 21.' },
      { k: 'dot', i: f, p: 21, col: 'ice', t: 'filled: trade open', pos: 'below', dx: 30, at: f, say: 'Price trades at 21: your order fills. This is your entry.' }] };
  }, cap: 'The exact price your order filled at. Everything (stop, target, P&L) is measured from here.', rel: ['EXIT', 'LIMIT'] },
  { ab: 'EXIT', full: 'Trade Exit', cat: 2, def: 'The price level where a trade is closed', vis() {
    const c = cs([20.5, 21, 22, 23, 22.5, 24, 25, 24.4, 23]);
    return { c, ann: [
      { k: 'h', p: 21, i0: 0.5, i1: 5, col: 'ice', t: 'entry', below: true, at: 0, say: 'In at 21.' },
      { k: 'band', lo: 21, hi: 25, i0: 0.5, i1: 5, col: 'win', fill: 0.07, at: 5 },
      { k: 'x', i: 5, p: 25, col: 'signal', t: 'EXIT 25', at: 5, say: 'Out at 25. Trade closed: +4 points.' }] };
  }, cap: 'Where you closed the trade: at your target, your stop, or by hand.', rel: ['ENTRY', 'TP', 'SL'] },

  // Time Frames
  { ab: 'LTF', full: 'Lower Time Frame', cat: 3, def: 'Smaller charts like 1m, 5m, or 15m.', custom: tfPair('ltf'), cap: 'Each small candle is 5 minutes. Twelve of them build one 1-hour candle.', rel: ['HTF'] },
  { ab: 'HTF', full: 'Higher Time Frame', cat: 3, def: 'Larger charts like 1H, 4H, or Daily.', custom: tfPair('htf'), cap: 'Same price, zoomed out: the whole hour in one candle. HTF sets the direction; LTF times the entry.', rel: ['LTF', 'OLHC'] },
  { ab: 'SESSIONS', full: 'Sessions & key times', cat: 3, def: 'The windows of the day the models trade, in New York time.', custom: sessions, cap: '6 PM daily open, Asia 8 PM–12 AM, midnight open, NY range 7:00–9:25, then the 9:30 open.', rel: ['OPENS', 'RANGE H/L'] },

  // Prop Firm Terms
  { ab: 'PROP FIRM', full: 'Proprietary Trading Firm', cat: 4, def: 'A company that provides traders with funded capital.', custom: propFlow, cap: 'You prove yourself on their rules, they give you capital, you split the profits.', rel: ['EVAL', 'FUNDED'] },
  { ab: 'EVAL', full: 'Evaluation Phase', cat: 4, def: 'The challenge phase required to earn a funded account.', vis() {
    const line = [50000, 50400, 50100, 50900, 51500, 51200, 52000, 52600, 53100];
    return { line, range: [48000, 53400], ann: [
      { k: 'h', p: 53000, col: 'win', t: 'PROFIT TARGET · pass', at: 0, say: 'Hit the profit target without breaking a rule…' },
      { k: 'h', p: 48000, col: 'loss', t: 'MAX DRAWDOWN · fail', below: true, at: 0, say: '…and never touch the drawdown limit.' },
      { k: 'tag', i: 8, p: 53100, dy: 16, t: 'PASSED', col: 'win', big: true, anchor: 'end', at: 8, say: 'Target reached: evaluation passed. Next: funded.' }] };
  }, cap: 'Example 50K eval: make the profit target before you hit the max drawdown.', rel: ['FUNDED', 'DD', 'DLL'] },
  { ab: 'FUNDED', full: 'Funded Account', cat: 4, def: 'The account you get after passing the eval: you trade the firm’s capital under its rules and request payouts.', custom: ladder('FUNDED'), cap: 'Pass the eval → funded. Same rules still apply, and now profits can be paid out.', rel: ['EVAL', 'LIVE'] },
  { ab: 'LIVE', full: 'Live Account', cat: 4, def: 'Trading with real money.', custom: ladder('LIVE'), cap: 'Real money on the line. Every rule you practiced matters most here.', rel: ['FUNDED', 'PROP FIRM'] },
  { ab: 'DLL', full: 'Daily Loss Limit', cat: 4, def: 'The most your account can lose in one day. Hit it and you’re done for the day (or the account fails, depending on the firm).', vis() {
    const line = [0, -200, 150, -300, -550, -400, -750, -1000];
    return { line, range: [-1150, 300], ann: [
      { k: 'h', p: 0, col: 'ink3', t: 'start of day', at: 0 },
      { k: 'h', p: -1000, col: 'loss', t: 'DLL −$1,000', below: true, at: 0, say: 'Today’s P&L. The daily loss limit sits at −$1,000.' },
      { k: 'x', i: 7, p: -1000, col: 'loss', t: 'done for today', anchor: 'end', dx: -6, at: 7, say: 'Limit hit. No more trades today.' }] };
  }, cap: 'Your firm’s daily limit is a wall. Your own daily stop should be well above it.', rel: ['DD', 'EVAL'] },

  // Charts & Orders (from the lessons)
  { ab: 'CANDLE', full: 'Candlestick · OHLC', cat: 5, def: 'One bar of price over one time period: where it Opened, its High, its Low and where it Closed. Green closed higher, red closed lower.', vis() {
    const c = [null, K(12, 22, 8, 19), null, null, K(19, 23, 9, 12), null];
    const lab = (i, p, t, col) => ({ k: 'tag', i, p, dx: 14, dy: 3, t, col: col || 'ink2', anchor: 'start', at: i });
    return { c, slots: 6, ann: [lab(1, 22, 'High'), lab(1, 19, 'Close', 'win'), lab(1, 12, 'Open'), lab(1, 8, 'Low'), lab(4, 23, 'High'), lab(4, 19, 'Open'), lab(4, 12, 'Close', 'loss'), lab(4, 9, 'Low'),
      { k: 'tag', i: 1, p: 5.5, t: 'UP candle', col: 'win', at: 1, say: 'Green: it closed higher than it opened.' }, { k: 'tag', i: 4, p: 5.5, t: 'DOWN candle', col: 'loss', at: 4, say: 'Red: it closed lower than it opened.' }] };
  }, cap: 'Press play and watch each candle form: open, one extreme, the other, then the close.', rel: ['WICK', 'OLHC'], ch: 'chart' },
  { ab: 'WICK', full: 'Wick', cat: 5, def: 'The thin line above or below the body. Price traded there during the candle but didn’t close there.', vis() {
    const c = cs([16, 15.5, 16.2, 15.6], { 2: { l: 9.5, h: 16.4, c: 15.6 } });
    c.push(K(15.6, 18, 15.2, 17.6));
    return { c, slots: 6, ann: [
      { k: 'band', lo: 9.5, hi: 15.2, i0: 1.6, i1: 2.4, col: 'signal', fill: 0.12, at: 2 },
      { k: 'tag', i: 2, p: 12, dx: 12, t: 'long wick: sellers pushed down,', col: 'signal', anchor: 'start', at: 2, say: 'Price dropped hard during the candle…' },
      { k: 'tag', i: 2, p: 12, dx: 12, dy: 12, t: 'buyers pushed it back', col: 'signal', anchor: 'start', at: 2, say: '…then got rejected and closed back up. The wick shows where it went.' }] };
  }, cap: 'Wicks show where price went and got rejected. That’s where stops and orders traded.', rel: ['CANDLE', 'SWEEP'] },
  { ab: 'TICK', full: 'Tick & Point', cat: 5, def: 'The smallest price move. On NQ/MNQ one tick is 0.25, and 4 ticks make 1 point.', raw: () => VIS.ticks(), cap: 'MNQ: $0.50 a tick, $2 a point. NQ: $5 a tick, $20 a point.', rel: ['SL', 'RR'], ch: 'chart' },
  { ab: 'MARKET', full: 'Market Order', cat: 5, def: 'Buy or sell right now at the current price.', vis() {
    const c = cs([20, 21, 20.4, 21.6, 22.8, 22.2, 23.6]);
    return { c, slots: 7, ann: [{ k: 'dot', i: 2, p: c[2].c, col: 'win', t: 'MARKET BUY · filled now', pos: 'below', at: 2, say: 'Press buy: filled instantly at whatever price it is.' }] };
  }, cap: 'Fastest fill, but you take whatever price is there.', rel: ['LIMIT', 'STOP'], ch: 'order' },
  { ab: 'LIMIT', full: 'Limit Order', cat: 5, def: 'Waits at your price. A buy limit sits below price and fills if price dips to it.', vis() {
    const c = cs([24, 23.4, 22.4, 21.6, 20.6, 21.6, 23, 24.4]);
    const f = c.findIndex((k) => k.l <= 21);
    return { c, ann: [
      { k: 'h', p: 21, i1: f, col: 'ice', t: 'BUY LIMIT 21 · waiting', below: true, at: 0, say: 'The order waits below price at 21.' },
      { k: 'dot', i: f, p: 21, col: 'win', t: 'filled', pos: 'below', at: f, say: 'Price dips to 21: filled. You got the price you wanted.' }] };
  }, cap: 'You pick the price. It only fills if price comes to you.', rel: ['MARKET', 'STOP', 'ENTRY'], ch: 'order' },
  { ab: 'STOP', full: 'Stop Order', cat: 5, def: 'Waits at your price and fills when price breaks through it. A buy stop sits above price.', vis() {
    const c = cs([20, 20.6, 20.2, 21, 20.6, 22.4, 24, 25.2]);
    const f = c.findIndex((k) => k.h >= 22);
    return { c, ann: [
      { k: 'h', p: 22, i1: f, col: 'ice', t: 'BUY STOP 22 · waiting', at: 0, say: 'The order waits ABOVE price at 22.' },
      { k: 'dot', i: f, p: 22, col: 'win', t: 'filled on the break', pos: 'below', dx: 26, at: f, say: 'Price breaks up through 22: filled.' }] };
  }, cap: 'Fills on a break. It’s also how a stop loss works: it fires when price reaches it.', rel: ['LIMIT', 'SL'], ch: 'order' },
  { ab: 'BRACKET', full: 'Bracket Order · OCO', cat: 5, def: 'An entry with a stop loss and take profit attached. When one of them fills, the other cancels (One Cancels Other).', vis() {
    const c = cs([20, 20.8, 21.6, 21, 22.6, 24, 25.2, 26.4, 25]);
    const hit = c.findIndex((k) => k.h >= 26);
    return { c, ann: [
      { k: 'h', p: 20.5, i1: hit, col: 'ice', t: 'ENTRY', below: true, at: 0, say: 'Entry with the stop and target attached.' },
      { k: 'h', p: 26, i1: hit, col: 'win', t: 'TP', tpos: 'l', at: 0 },
      { k: 'h', p: 17.5, i1: hit, col: 'loss', t: 'SL', below: true, at: 0 },
      { k: 'dot', i: hit, p: 26, col: 'win', t: 'TP filled', at: hit, say: 'Target fills…' },
      { k: 'x', i: hit, p: 17.5, col: 'ink3', t: 'SL cancelled', pos: 'below', at: hit, say: '…and the stop cancels itself. One cancels other.' }] };
  }, cap: 'Set it once. Whichever side gets hit first closes the trade and cancels the other.', rel: ['SL', 'TP'], ch: 'order' },

  // FLOWMTD Models (definitions from the teaching guides / lessons)
  { ab: 'LIQUIDITY', full: 'Liquidity', cat: 6, def: 'Stop orders resting above old highs and below old lows. Price is drawn to them: they’re the draw, your target.', vis() {
    const c = cs([16, 19, 21, 19, 16.5, 14, 12, 14, 16.5, 19, 21.5, 23]);
    return { c, ann: [
      { k: 'h', p: c[1].h, i0: 1, i1: 9.5, col: 'lag', t: 'buy stops above', at: 1 },
      { k: 'h', p: c[5].l, i0: 5, col: 'lag', t: 'sell stops below', below: true, at: 5, say: 'Every obvious high and low has stops parked beyond it.' },
      { k: 'tag', i: 10, p: c[10].h, dy: -6, t: 'draw taken', col: 'signal', at: 10, say: 'Price travels to the pool of stops and takes it.' }] };
  }, cap: 'Stops sit just past obvious highs and lows. Price gets pulled toward them.', rel: ['EQH', 'EQL', 'SWEEP'], ch: 'po3' },
  { ab: 'SWEEP', full: 'Liquidity Sweep', cat: 6, def: 'Price trades through a high or low, grabs the stops parked there, and comes back. It traps traders on the wrong side.', vis() {
    const c = cs([20, 22, 20.6, 19, 21, 22.2, 20.4, 19.6, 20.6, 22.8, 24.6, 26], { 6: { l: 16.6 } });
    return { c, ann: [
      { k: 'band', lo: 18.4, hi: 22.9, i0: -0.5, i1: 5.5, col: 'ice', fill: 0.06, t: 'range', at: 0 },
      { k: 'h', p: 18.4, i0: -0.5, i1: 7, col: 'ice', t: 'range low', below: true, tpos: 'l', at: 3 },
      { k: 'dot', i: 6, p: 16.6, col: 'signal', t: 'SWEEP', pos: 'below', at: 6, say: 'A wick runs under the range low, grabs the stops… and closes back inside.' },
      { k: 'tag', i: 10, p: c[10].h, dy: -6, t: 'reversal', col: 'win', at: 10, say: 'Trapped sellers fuel the move back up.' }] };
  }, cap: 'Run the stops, close back inside, reverse. Low swept → look for longs.', rel: ['LIQUIDITY', 'IFVG', 'RANGE H/L', 'TURTLE SOUP'], ch: 'hl' },
  { ab: 'IFVG', full: 'Inverted Fair Value Gap', alias: 'IFG', cat: 6, def: 'A gap that flipped. Sellers made the gap; when a candle CLOSES back above it, old resistance becomes support.', vis() {
    const c = [K(22, 22.6, 20.8, 21), K(21, 21.4, 16, 16.4), K(16.4, 17.6, 14.2, 15), K(15, 17.2, 14.6, 16.8), K(16.8, 19.8, 16.4, 19.2), K(19.2, 20.6, 17.4, 20.2), K(20.2, 22.8, 19.8, 22.4)];
    return { c, ann: [
      { k: 'band', lo: 17.6, hi: 20.8, i0: 0, col: 'loss', t: 'bearish FVG', tx: 'r', at: 2, say: 'The drop leaves a bearish gap.' },
      { k: 'tag', i: 3, p: 17.2, dy: -6, t: 'wick in: not yet', col: 'ink3', at: 3 },
      { k: 'band', lo: 17.6, hi: 20.8, i0: 4, col: 'win', t: 'iFVG · now support', tx: 'r', tpos: 'below', at: 5, say: 'A candle CLOSES above the gap. It has inverted: support now.' },
      { k: 'arrow', i: 5, p: 17.4, dir: 'up', col: 'win', at: 5 }] };
  }, cap: 'A wick inside isn’t enough. It needs a close back through the gap.', rel: ['FVG', 'SWEEP'], ch: 'hl' },
  { ab: 'RANGE H/L', full: 'Range High / Range Low', cat: 6, def: 'NYFlow H/L: the highest high and lowest low from 7:00 to 9:25 AM ET. At 9:25 the range locks.', vis() {
    const c = cs([20, 21.4, 20.2, 22.6, 21.4, 19.6, 18.6, 20.4, 21.8, 20.6, 19.4, 20.8, 17.6, 19.8, 22.4], { 11: { l: 16.8 } });
    return { c, ann: [
      { k: 'band', lo: c[5].l, hi: c[2].h, i0: -0.5, i1: 9.5, col: 'ice', fill: 0.06, t: '7:00–9:25', at: 9, say: 'The range locks at 9:25.' },
      { k: 'h', p: c[2].h, i0: 2, col: 'ice', t: 'range high', at: 2, say: 'Every new extreme moves a line.' },
      { k: 'h', p: c[5].l, i0: 5, col: 'ice', t: 'range low', below: true, at: 5 },
      { k: 'dot', i: 11, p: 16.8, col: 'signal', t: 'low swept → longs', pos: 'below', at: 11, say: 'After 9:30 one side gets swept. Low swept → longs toward the range high.' }] };
  }, cap: 'Mark the high and low of the pre-market. The fuel sits just past them.', rel: ['SWEEP', 'SESSIONS'], ch: 'hl' },
  { ab: 'PO3', full: 'Power of Three · AMD', alias: 'AMD', cat: 6, def: 'Price moves in three phases: Accumulation (sideways chop), Manipulation (a fake move that sweeps stops), Distribution (the real move).', vis() {
    const c = cs([20, 21, 20, 21.2, 19.8, 20.8, 19.6, 18, 16.6, 18.6, 21.6, 24, 26.4]);
    return { c, ann: [
      { k: 'band', lo: 19.2, hi: 21.8, i0: -0.5, i1: 5.5, col: 'ink2', fill: 0.08, t: 'A · accumulation', tpos: 'above', at: 5, say: 'A: chop. No trades here.' },
      { k: 'tag', i: 7, p: c[7].l, dy: 16, t: 'M · manipulation', col: 'loss', at: 7, say: 'M: the fake move down that sweeps stops. Not the real move.' },
      { k: 'tag', i: 10, p: c[11].h, dy: -4, t: 'D · distribution', col: 'win', anchor: 'end', at: 11, say: 'D: the real move, with the trend.' }] };
  }, cap: 'Chop, fake-out, real move. The model trades the real move after the fake one.', rel: ['OLHC', 'SWEEP', 'LIQUIDITY'], ch: 'po3' },

const LVL_BEGIN = ['SL', 'TP', 'LONG', 'SHORT', 'ENTRY', 'EXIT', 'LTF', 'HTF', 'PROP FIRM', 'EVAL', 'FUNDED', 'LIVE', 'DLL', 'CANDLE', 'WICK', 'TICK', 'MARKET', 'LIMIT', 'STOP', 'BRACKET', 'ATH', 'ATL'];
const LVL_MID = ['BOS', 'EQH', 'EQL', 'FVG', 'RT', 'PA', 'RR', 'BE', 'DD', 'SESSIONS', 'LIQUIDITY', 'SWEEP'];
const LVL_NAMES = ['Beginner', 'Intermediate', 'Advanced'];
TERMS.forEach((t, i) => { t.id = 't-' + t.ab.toLowerCase().replace(/[^a-z0-9]+/g, '-'); t.i = i; t.lvl = LVL_BEGIN.includes(t.ab) ? 0 : LVL_MID.includes(t.ab) ? 1 : 2; });
const termById = (ab) => TERMS.find((t) => t.ab === ab);
function termSpec(t) { if (!t._spec && t.vis) t._spec = t.vis(); return t._spec; }
function termSvg(t, frame, quiz) {
  if (t.raw) return t.raw();
  if (t.custom) return t.custom.draw(frame);
  return tSvg(termSpec(t), frame, quiz);
}
function termFrames(t) { if (t.raw) return 0; if (t.custom) return t.custom.frames; return tFrames(termSpec(t)); }
function termSay(t, frame) { if (!t.vis || frame == null) return t.cap; return tSay(termSpec(t), frame, t.cap); }

// ── View ───────────────────────────────────────────────────
const TV_ST = { q: '', cat: -1, lvl: -1, view: 'levels' };
const LESSON_NAME = (id) => (CH.find((c) => c.id === id) || {}).name;

  const lesson = t.ch && LESSON_NAME(t.ch);
  return `<article class="term" id="${t.id}" data-term="${t.i}">
    <div class="t-top"><h3 class="t-ab">${esc(t.ab)}</h3><span class="hud"><span class="lvl-dot l${t.lvl}"></span>${LVL_NAMES[t.lvl]} · ${esc(TCATS[t.cat])}</span></div>
    <div class="t-full">${esc(t.full)}${t.alias ? ` <span class="t-alias">· also ${esc(t.alias)}</span>` : ''}</div>
    <p class="t-def">${esc(t.def)}</p>
    <figure class="t-vis" data-vis>${termSvg(t)}</figure>

    svg += `<polyline points="${pts.map((p, i) => `${x(i)},${y(p.b)}`).join(' ')}" fill="none" stroke="${COL.ice}" stroke-width="2.4" stroke-linejoin="round"/>`;

    const status = fail >= 0 ? fbHtml(false, 'Account failed', `Balance touched the floor at ${money(pts[fail].b)}. ${model === 'intra' ? 'The floor had trailed up with your peak, so giving back a winning day was enough to fail.' : ''}`) : `<p class="t-cap"><b>Room left</b>${money(pts[pts.length - 1].b - lf)} above the floor. ${note}</p>`;

const simRun = (n, wr, win, loss) => { let b = 0, peak = 0, dd = 0, streak = 0, worst = 0; const pts = [0]; for (let i = 0; i < n; i++) { const w = Math.random() < wr; b += w ? win : -loss; streak = w ? 0 : streak + 1; worst = Math.max(worst, streak); peak = Math.max(peak, b); dd = Math.max(dd, peak - b); pts.push(b); } return { pts, final: b, dd, worst }; };

// ════════ Rendering ════════
const diveProg = (dv) => dv.secs.filter((s) => (DP[dv.id] || {})[s.id]).length;
function renderCourses() {
  const body = $('#c-body'); if (!body) return;
  body.innerHTML = `<div class="t-hero"><div><h1 class="t-title">Deep Dives</h1><p class="t-sub">Short, hands-on courses on the things that actually decide whether you pass and get paid. Every one is interactive, and your progress stays on this device.</p></div></div>
    <div class="dv-grid">${DIVES.map((dv, i) => { const n = diveProg(dv), t = dv.secs.length; return `<button type="button" class="dv-card" data-dive="${dv.id}"><span class="big">${i + 1}</span><span class="hud">${t} part${t > 1 ? 's' : ''}</span><h3>${esc(dv.title)}</h3><p>${esc(dv.sub)}</p><span class="dv-meta"><span class="pbar"><i style="width:${(n / t) * 100}%"></i></span><span class="hud num">${n === t ? 'Done ✓' : n ? `${n}/${t}` : 'Start →'}</span></span></button>`; }).join('')}</div>`;
}
function openCourse(id) {
  const i = DIVES.findIndex((d) => d.id === id); if (i < 0) return renderCourses();
  const dv = DIVES[i], body = $('#c-body');
  body.innerHTML = '';
  const top = h('div', 't-hero', `<div><button type="button" class="btn ghost" data-back style="padding-left:0">← ${esc(crumbText())}</button><h1 class="t-title">${esc(dv.title)}</h1><p class="t-sub">${esc(dv.sub)}</p></div><div class="dv-meta" style="min-width:200px;margin:0"><span class="pbar"><i id="dv-bar" style="width:${(diveProg(dv) / dv.secs.length) * 100}%"></i></span><span class="hud num" id="dv-n">${diveProg(dv)}/${dv.secs.length}</span></div>`);
  body.append(top);
  dv.secs.forEach((s, k) => {

// ════════ New widgets: tap the chart, number reps, question series, session clock, fib/OTE, ECHO x ORBIT animations ════════
const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const RM = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
function svgPt(svg, e) { const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal; return { x: (e.clientX - r.left) / r.width * vb.width, y: (e.clientY - r.top) / r.height * vb.height }; }
function chartMap(spec) {
  const n = (spec.c || []).length, slots = spec.slots || n, [lo, hi] = tRange(spec), H = spec.h || TH, bw = (TW - TPAD.l - TPAD.r) / slots;
  return { idx: (x) => Math.floor((x - TPAD.l) / bw), price: (y) => hi - ((y - TPAD.t) / (H - TPAD.t - TPAD.b)) * (hi - lo) };
}
// Annotations listed with at: 1e9 stay hidden (and keep the price scale stable) until revealed.
const HIDE = 1e9;
const revealed = (spec, keys) => ({ ...spec, ann: (spec.ann || []).map((a) => (a.at === HIDE && (!keys || keys.includes(a.key)) ? { ...a, at: 0 } : a)) });

// ── Tap the chart: tap a candle (or a price) and get graded. exam(ok) = one attempt, no retry. ──
function wTap(el, done, o) {
  const box = h('div', 'w'), fig = h('figure', 't-vis'), q = h('p', 'w-q', o.q), out = h('div', '');
  fig.style.margin = '0'; fig.style.cursor = 'crosshair'; box.append(q, fig, out); el.append(box);
  let spec = o.spec, over = false;
  const paint = (s) => { fig.innerHTML = tSvg(s); };
  paint(spec);
  fig.addEventListener('click', (e) => {
    if (over) return; const svg = fig.querySelector('svg'); if (!svg) return;
    const p = svgPt(svg, e), m = chartMap(o.spec), i = m.idx(p.x), price = m.price(p.y);
    const [good, msg] = o.hit(i, price);
    if (good) {
      over = true; fig.style.cursor = 'default'; paint(revealed(spec));
      out.innerHTML = fbHtml(true, 'Right', msg || o.ok || '');
      if (o.exam) o.exam(true); else done();
    } else if (o.exam) {
      over = true; fig.style.cursor = 'default'; paint(revealed(spec)); out.innerHTML = fbHtml(false, 'Not quite', msg); o.exam(false);
    } else {
      const k = (o.spec.c || [])[i];
      spec = k ? { ...o.spec, ann: [...(o.spec.ann || []), { k: 'x', i, p: (k.h + k.l) / 2, col: 'lag' }] } : o.spec; paint(spec);
      out.innerHTML = fbHtml(false, 'Not quite', msg + ' Try again.');
    }
  });
}
// Hit helpers
const hitCandle = (want, okMsg, why) => (i) => (want.includes(i) ? [true, okMsg] : [false, typeof why === 'function' ? why(i) : why]);
const hitBand = (lo, hi, okMsg, why) => (i, p) => (p >= lo && p <= hi ? [true, okMsg] : [false, typeof why === 'function' ? why(p) : why]);

// ── Number reps: answer each, wrong answers explain and let you retry ──
function wNum(el, done, items) {
  const box = h('div', 'w'); el.append(box); let i = 0;
  const draw = (msg) => {
    if (i >= items.length) { box.innerHTML = fbHtml(true, 'All correct', `${items.length} of ${items.length}. This math needs to be automatic before every trade.`); return; }
    const it = items[i];
    box.innerHTML = `<div class="dv-top"><span class="hud">Rep ${i + 1} / ${items.length}</span></div><p class="w-q">${it.q}</p>
      <div class="w-row"><input class="in num" type="text" inputmode="decimal" aria-label="Your answer" style="max-width:160px">${it.unit ? `<span class="hud">${esc(it.unit)}</span>` : ''}<button type="button" class="btn primary" data-ck>Check</button></div>${msg || ''}`;
    const inp = box.querySelector('input'); inp.focus({ preventScroll: true });
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') box.querySelector('[data-ck]').click(); });
  };
  box.addEventListener('click', (e) => {
    if (e.target.closest('[data-ck]')) {
      const v = parseFloat(String(box.querySelector('input').value).replace(/[$,\s]/g, '')); if (isNaN(v)) return;
      const it = items[i];
      if (Math.abs(v - it.a) <= (it.tol || 0)) { i++; if (i >= items.length) { draw(); done(); } else draw(fbHtml(true, 'Right', it.why)); }
      else draw(fbHtml(false, `Not ${v}`, it.why));
    }
  });
  draw();
}

// ── Question series: several multiple-choice questions in a row (first option is the right one; shuffled) ──
function wQs(el, done, items) {
  const box = h('div', 'w'); el.append(box); let i = 0, pick = null, order = [];
  const setup = () => { order = shuf(items[i].o.map((_, k) => k)); pick = null; };
  const draw = () => {
    if (i >= items.length) { box.innerHTML = fbHtml(true, 'Done', `All ${items.length} right.`); return; }
    const it = items[i];
    box.innerHTML = `<div class="dv-top"><span class="hud">Question ${i + 1} / ${items.length}</span></div><p class="w-q">${it.q}</p>
      <div class="opts">${order.map((k) => `<button type="button" class="opt${pick == null ? '' : k === 0 ? ' right' : k === pick ? ' wrong' : ''}" data-k="${k}" ${pick != null ? 'disabled' : ''}>${it.o[k]}</button>`).join('')}</div>
      ${pick == null ? '' : fbHtml(pick === 0, pick === 0 ? 'Right' : 'Not quite', it.why) + `<div class="actions">${pick === 0 ? `<button type="button" class="btn primary" data-next>${i < items.length - 1 ? 'Next →' : 'Finish'}</button>` : '<button type="button" class="btn ghost" data-retry>Try again</button>'}</div>`}`;
  };
  box.addEventListener('click', (e) => {
    const b = e.target.closest('[data-k]'); if (b && pick == null) { pick = +b.dataset.k; draw(); return; }
    if (e.target.closest('[data-retry]')) { setup(); draw(); }
    if (e.target.closest('[data-next]')) { i++; if (i < items.length) { setup(); draw(); } else { draw(); done(); } }
  });
  setup(); draw();
}

// ── Session clock: one futures day, 6 PM → 6 PM ET. Drag through it; complete the time tasks. ──
const SESS = [
  { id: 'asia', name: 'Asia', a: 20 * 60, b: 24 * 60, col: 'lag' },
  { id: 'london', name: 'London', a: 2 * 60, b: 5 * 60, col: 'ice' },
  { id: 'ny', name: 'New York', a: 7 * 60, b: 10 * 60, col: 'signal' },
];
const inSess = (s, m) => (s.a < s.b ? m >= s.a && m < s.b : m >= s.a || m < s.b);
const etLabel = (m) => { m = ((m % 1440) + 1440) % 1440; let hh = Math.floor(m / 60), mm = m % 60; const ap = hh >= 12 ? 'PM' : 'AM'; hh = hh % 12 || 12; return `${hh}:${String(mm).padStart(2, '0')} ${ap}`; };
function clockInfo(m) {
  const open = !(m >= 17 * 60 && m < 18 * 60);
  const s = SESS.filter((x) => inSess(x, m)).map((x) => x.name);
  const notes = [];
  if (!open) notes.push('Futures closed: daily break 5–6 PM');
  if (m >= 9 * 60 + 30 && m < 16 * 60) notes.push('US stock market open (9:30 AM – 4:00 PM)');
  if (m >= 9 * 60 + 30 && m < 9 * 60 + 35) notes.push('9:30: Range Settlement forms');
  if (m >= 8 * 60 + 25 && m <= 8 * 60 + 35) notes.push('8:30: major news releases land here');
  return { open, sessions: s, notes };
}
function wClock(el, done, tasks) {
  const box = h('div', 'w'); el.append(box); let t = 0, m = 21 * 60;
  const toPos = (mm) => (((mm - 18 * 60) % 1440) + 1440) % 1440;

    const seg = (a, b, col, label) => { const x0 = toPos(a) / 1440 * 100; let w = (toPos(b) - toPos(a)) / 1440 * 100; if (w <= 0) w += 100; return `<div style="position:absolute;left:${x0}%;width:${w}%;top:0;bottom:0;background:${alpha(COL[col] || COL.ice, 0.18)};border-left:1px solid ${alpha(COL[col] || COL.ice, 0.7)}"><span class="hud" style="position:absolute;left:4px;top:3px;color:${COL[col] || COL.ice};font-size:8.5px">${label}</span></div>`; };
    return SESS.map((s) => seg(s.a, s.b, s.col, s.name)).join('') + seg(17 * 60, 18 * 60, 'loss', 'Break');
  };
  const draw = (msg) => {
    const info = clockInfo(m), tk = tasks[t];
    box.innerHTML = `${tk ? `<div class="dv-top"><span class="hud">Task ${t + 1} / ${tasks.length}</span></div><p class="w-q">${tk.q}</p>` : ''}
      <div style="position:relative;height:42px;border:1px solid var(--line2);background:var(--panel)">${bands()}<div style="position:absolute;top:-3px;bottom:-3px;left:${toPos(m) / 1440 * 100}%;width:2px;background:var(--ink)"></div></div>
      <div class="w-row hud" style="justify-content:space-between"><span>6 PM</span><span>12 AM</span><span>6 AM</span><span>12 PM</span><span>5 PM</span></div>
      <input type="range" min="0" max="1435" step="5" value="${toPos(m)}" aria-label="Time of day (ET)">
      <div class="w-stats"><div><span class="hud">Time (ET)</span><span class="v">${etLabel(m)}</span></div><div><span class="hud">Session</span><span class="v">${info.sessions.join(' · ') || '—'}</span></div><div><span class="hud">Futures</span><span class="v">${info.open ? 'Open' : 'Closed'}</span></div></div>
      ${info.notes.length ? `<p class="t-cap">${info.notes.map(esc).join(' · ')}</p>` : ''}
      ${tk ? '<div class="actions"><button type="button" class="btn primary" data-ck>Check</button></div>' : fbHtml(true, 'Clock done', 'You know when NQ trades and where each session sits. Every time in FLOWMTD is New York time.')}${msg || ''}`;
  };
  box.addEventListener('input', (e) => { if (e.target.type === 'range') { m = (+e.target.value + 18 * 60) % 1440; const v = e.target.value; draw(); const r = box.querySelector('input[type=range]'); r.value = v; r.focus(); } });
  box.addEventListener('click', (e) => {

}

// ── Fib / OTE: tap the swing low and swing high, see the retracement, then tap the OTE zone ──
// o: { spec, upto, lowI, highI, dir: 'long' } — long: anchor low → high, OTE = 62–79% retracement down from the high.
function wFib(el, done, o) {
  const box = h('div', 'w'), fig = h('figure', 't-vis'), q = h('p', 'w-q'), out = h('div', '');
  fig.style.margin = '0'; fig.style.cursor = 'crosshair'; box.append(q, fig, out); el.append(box);
  const c = o.spec.c, lowP = c[o.lowI].l, highP = c[o.highI].h, rng = highP - lowP, lvl = (r) => highP - r * rng;
  let step = 0; // 0 tap low, 1 tap high, 2 tap OTE, 3 done
  const fibAnn = () => [
    { k: 'band', lo: lvl(0.79), hi: lvl(0.62), col: 'signal', t: 'OTE', fill: 0.16, i0: o.lowI, tx: 'r' },
    ...[[0, 'ice'], [0.5, 'ink2'], [0.62, 'signal'], [0.79, 'signal'], [1, 'ice']].map(([r, col]) => ({ k: 'h', p: lvl(r), col, i0: o.lowI, t: `${r}`, tpos: 'l', dash: '3 3', w: 1 })),
  ];
  const show = (n, extra = []) => ({ ...o.spec, c: c.slice(0, n), slots: o.spec.slots || c.length, ann: [...(o.spec.ann || []), ...extra] });
  const base = { ...o.spec, ann: [...(o.spec.ann || []), ...fibAnn().map((a) => ({ ...a, at: HIDE }))] };
  const paint = (s) => { fig.innerHTML = tSvg({ ...s, range: [lowP - rng * 0.15, highP + rng * 0.25] }); };
  const prompt = ['Tap the candle that made the <b>swing low</b> (where the move started).', 'Now tap the candle that made the <b>swing high</b>.', 'The fib is drawn. Tap inside the zone where Orbit looks for its entry.'];
  const draw = (msg) => {
    q.innerHTML = prompt[Math.min(step, 2)];
    if (step < 2) paint(show(o.upto, step === 1 ? [{ k: 'dot', i: o.lowI, p: lowP, col: 'ice' }] : []));
    else paint(show(o.upto, fibAnn()));
    out.innerHTML = msg || '';
  };
  fig.addEventListener('click', (e) => {
    if (step > 2) return; const svg = fig.querySelector('svg'); if (!svg) return;
    const p = svgPt(svg, e), m = chartMap({ ...base, c: c.slice(0, o.upto), slots: o.spec.slots || c.length, range: [lowP - rng * 0.15, highP + rng * 0.25] }), i = m.idx(p.x), price = m.price(p.y);
    if (step === 0) { if (i === o.lowI) { step = 1; draw(fbHtml(true, 'Swing low', `Anchor 1 at ${fmt(lowP)}.`)); } else draw(fbHtml(false, 'Not that one', 'Find the lowest point the whole move started from.')); }
    else if (step === 1) { if (i === o.highI) { step = 2; draw(fbHtml(true, 'Swing high', `Anchor 2 at ${fmt(highP)}. Range: ${fmt(rng)} points.`)); } else draw(fbHtml(false, 'Not that one', 'Find the highest point the move reached before pulling back.')); }
    else if (step === 2) {
      if (price <= lvl(0.62) && price >= lvl(0.79)) { step = 3; fig.style.cursor = 'default'; paint(show(c.length, fibAnn())); out.innerHTML = fbHtml(true, 'The OTE zone', o.ok || 'Deep in the pullback, between the 62% and 79% levels. Price pulled into it and turned.'); done(); }
      else draw(fbHtml(false, price > lvl(0.62) ? 'Too shallow' : 'Too deep', price > lvl(0.62) ? 'That’s above the zone. Orbit wants a deep pullback, between the 0.62 and 0.79 lines.' : 'That’s below the zone, close to where the idea fails.'));
    }
  });
  draw();
}

// ════════ ECHO x ORBIT animations (canvas) ════════
function cvs(el, ratio = 0.42, cap = 440) {
  const wrap = h('div', 'exo-cv'); const cv = h('canvas', ''); wrap.append(cv); el.append(wrap);
  const ctx = cv.getContext('2d');
  const fit = () => { const w = wrap.clientWidth || 600, hh = Math.min(cap, Math.max(200, Math.round(w * ratio))), d = devicePixelRatio || 1; cv.width = w * d; cv.height = hh * d; cv.style.height = hh + 'px'; ctx.setTransform(d, 0, 0, d, 0, 0); return { w, h: hh }; };
  return { wrap, cv, ctx, fit };
}
function exoHero(el) {
  const { ctx, fit, wrap } = cvs(el, 0.36, 340); let sz = fit(), t0 = performance.now(), raf = 0, stars = [];
  const mk = () => { stars = Array.from({ length: 60 }, () => [Math.random(), Math.random(), Math.random() * 0.8 + 0.2]); };
  mk();
  const ro = new ResizeObserver(() => { sz = fit(); }); ro.observe(wrap);
  const frame = (now) => {
    if (!wrap.isConnected) { cancelAnimationFrame(raf); ro.disconnect(); return; }
    const t = RM() ? 2.2 : Math.max(0, now - t0) / 1000, { w, h: hh } = sz, cx = w / 2, cy = hh / 2;
    ctx.clearRect(0, 0, w, hh);
    for (const [sx, sy, a] of stars) { ctx.fillStyle = alpha(COL.ink2, 0.15 * a + 0.1 * Math.sin(t * 2 + sx * 10) ** 2); ctx.fillRect(sx * w, sy * hh, 1.5, 1.5); }
    // echo rings
    for (let k = 0; k < 4; k++) { const ph = ((t * 0.55 + k / 4) % 1); const r = 12 + ph * Math.min(w, hh * 2.2) * 0.42; ctx.strokeStyle = alpha(k % 2 ? COL.ice : COL.signal, (1 - ph) * 0.55); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(cx, cy, r, r * 0.62, 0, 0, Math.PI * 2); ctx.stroke(); }
    // orbit path + body with trail
    const rx = Math.min(w * 0.36, 300), ry = hh * 0.3, tilt = -0.18;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(tilt);
    ctx.setLineDash([3, 6]); ctx.strokeStyle = alpha(COL.ice, 0.35); ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    for (let k = 14; k >= 0; k--) { const a = t * 1.1 - k * 0.045; const x = Math.cos(a) * rx, y = Math.sin(a) * ry; ctx.fillStyle = alpha(COL.signal, (1 - k / 15) * 0.6); ctx.beginPath(); ctx.arc(x, y, 3.2 - k * 0.15, 0, Math.PI * 2); ctx.fill(); }
    const a0 = t * 1.1, bx = Math.cos(a0) * rx, by = Math.sin(a0) * ry; const g = ctx.createRadialGradient(bx, by, 0, bx, by, 14); g.addColorStop(0, alpha(COL.signal, 0.9)); g.addColorStop(1, alpha(COL.signal, 0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, by, 14, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // core
    const pulse = 0.6 + 0.4 * Math.sin(t * 3.4); const gc = ctx.createRadialGradient(cx, cy, 0, cx, cy, 26); gc.addColorStop(0, alpha(COL.ice, 0.85 * pulse)); gc.addColorStop(1, alpha(COL.ice, 0)); ctx.fillStyle = gc; ctx.beginPath(); ctx.arc(cx, cy, 26, 0, Math.PI * 2); ctx.fill();
    if (!RM()) raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
  const mark = h('div', 'exo-mark', '<span>ECHO</span><b>x</b><span>ORBIT</span>'); wrap.append(mark);
  return wrap;
}
// Candle scene player: candles reveal over time, phases add overlays + captions, Next/Replay controls.
function scene(el, done, S) {
  const { ctx, fit, wrap } = cvs(el, S.ratio || 0.46); const cap = h('p', 't-cap'), ui = h('div', 'actions'); el.append(cap, ui);
  let sz = fit(), ph = -1, shown = 0, target = 0, raf = 0, last = 0, t0 = performance.now(), finished = false;
  const ro = new ResizeObserver(() => { sz = fit(); }); ro.observe(wrap);
  const C = S.c, lo = Math.min(...C.map((k) => k.l), ...(S.extra || [])), hi = Math.max(...C.map((k) => k.h), ...(S.extra || [])), pad = (hi - lo) * 0.12;
  const map = () => { const { w, h: hh } = sz, L = 10, Rm = 66, T = 16, B = 18, bw = (w - L - Rm) / (S.slots || C.length); return { w, hh, bw, x: (i) => L + (i + 0.5) * bw, y: (p) => T + ((hi + pad - p) / (hi - lo + 2 * pad)) * (hh - T - B), R: w - Rm }; };
  const tab = (x, y, txt, col, up) => { ctx.font = '600 10px JetBrains Mono, monospace'; const tw = ctx.measureText(txt).width + 10; const yy = up ? y - 18 : y + 4; ctx.fillStyle = alpha(COL.ink, 0.1); ctx.fillRect(x, yy, tw, 14); ctx.strokeStyle = alpha(COL.ink2, 0.5); ctx.strokeRect(x + 0.5, yy + 0.5, tw - 1, 13); ctx.fillStyle = col; ctx.fillText(txt, x + 5, yy + 10.5); };
  const api = { ctx, tab, col: COL, alpha, t: 0 };
  const frame = (now) => {
    if (!wrap.isConnected) { cancelAnimationFrame(raf); ro.disconnect(); return; }
    const m = map(); api.t = Math.max(0, now - t0) / 1000; api.m = m;
    if (shown < target && now - last > (RM() ? 0 : 95)) { shown = RM() ? target : shown + 1; last = now; }
    ctx.clearRect(0, 0, m.w, m.hh);
    ctx.strokeStyle = alpha(COL.ink2, 0.08); for (let g = 1; g < 5; g++) { const y = (m.hh * g) / 5; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(m.w, y); ctx.stroke(); }
    for (let k = 0; k <= ph; k++) if (S.phases[k].under) S.phases[k].under(api, shown, k === ph);
    const cw = Math.max(2, Math.min(12, m.bw * 0.62));
    for (let i = 0; i < shown; i++) { const k = C[i], up = k.c >= k.o, col = up ? COL.win : COL.loss, x = m.x(i); ctx.strokeStyle = col; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x, m.y(k.h)); ctx.lineTo(x, m.y(k.l)); ctx.stroke(); ctx.fillStyle = col; ctx.fillRect(x - cw / 2, m.y(Math.max(k.o, k.c)), cw, Math.max(1, Math.abs(m.y(k.o) - m.y(k.c)))); }
    for (let k = 0; k <= ph; k++) if (S.phases[k].over) S.phases[k].over(api, shown, k === ph);
    if (shown >= target && ph >= 0 && !ui.dataset.ready) { ui.dataset.ready = '1'; buttons(); }
    raf = requestAnimationFrame(frame);
  };
  const buttons = () => {
    const lastPh = ph >= S.phases.length - 1;
    ui.innerHTML = lastPh ? '<button type="button" class="btn ghost" data-replay>↻ Replay</button>' : `<button type="button" class="btn primary" data-go>${ph < 0 ? '▶ Play' : 'Next ▶'}</button>`;
    if (lastPh && !finished) { finished = true; done && done(); }
  };
  const go = () => { ph++; const P = S.phases[ph]; target = P.until; cap.innerHTML = `<b>${esc(P.title)}</b>${P.cap}`; ui.innerHTML = ''; delete ui.dataset.ready; };
  ui.addEventListener('click', (e) => {
    if (e.target.closest('[data-go]')) go();
    if (e.target.closest('[data-replay]')) { ph = -1; shown = 0; target = 0; go(); }
  });
  cap.innerHTML = `<b>${esc(S.title)}</b>${S.intro}`; buttons(); raf = requestAnimationFrame(frame);
}
const rings = (api, x, y, t, col, n = 3) => { const { ctx } = api; for (let k = 0; k < n; k++) { const ph = (t * 0.7 + k / n) % 1; ctx.strokeStyle = api.alpha(col, (1 - ph) * 0.7); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, 4 + ph * 46, 0, Math.PI * 2); ctx.stroke(); } };
const hline = (api, p, i0, col, label, dash = [5, 4]) => { const { ctx, m } = api; const y = m.y(p); ctx.strokeStyle = col; ctx.lineWidth = 1.2; ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(m.x(i0), y); ctx.lineTo(m.R, y); ctx.stroke(); ctx.setLineDash([]); if (label) { ctx.font = '10px JetBrains Mono, monospace'; ctx.fillStyle = col; ctx.fillText(label, m.R + 4, y + 3); } };
const zone = (api, i0, i1, a, b, col, label, up) => { const { ctx, m } = api; const y0 = m.y(Math.max(a, b)), y1 = m.y(Math.min(a, b)), x0 = m.x(i0) - m.bw / 2, x1 = m.x(i1) + m.bw / 2; ctx.fillStyle = alpha(col, 0.12); ctx.fillRect(x0, y0, x1 - x0, y1 - y0); ctx.strokeStyle = alpha(COL.ink2, 0.7); ctx.lineWidth = 1; ctx.strokeRect(x0 + 0.5, y0 + 0.5, x1 - x0 - 1, y1 - y0 - 1); if (label) api.tab(x0, up ? y0 : y1, label, col, up); };

// Keep the lesson coach inside the current level: only that level's chapters in the rail.
const levelChapters = () => { const l = LV_ST.from && LEVELS.find((x) => x.id === LV_ST.from); return l ? l.modules.flatMap((m) => m.lessons).filter((x) => x.kind === 'ch').flatMap((x) => [x.id, ...(x.also || [])]) : null; };
const _renderRail = renderRail;
renderRail = function () {
  _renderRail();
  const keep = levelChapters(); if (!keep) return;
  $$('#chapters [data-ch]').forEach((b) => { b.hidden = !keep.includes(b.dataset.ch); });
  $$('#chapters [data-ch]:not([hidden]) .n').forEach((n, i) => { if (n.textContent !== '✓') n.textContent = i + 1; });
};
const _next = next;
next = function () {
  const here = STEPS[cur], nx = STEPS[cur + 1];
  if (!nx && !CUR_STEP) return restart();
  if (CUR_STEP && CUR_STEP.kind === 'ch' && (!nx || nx.ch !== here.ch)) {
    const group = [CUR_STEP.id, ...(CUR_STEP.also || [])];
    if (nx && group.includes(nx.ch)) return _next();
    return goNext(CUR_STEP);
  }
  return _next();
};
function crumbText() { const l = LV_ST.from && LEVELS.find((x) => x.id === LV_ST.from); return l ? `${l.name}` : 'Trading School'; }
function goBack() { LV_ST.open = LV_ST.from || null; setView('levels'); window.scrollTo({ top: 0 }); }
// What comes after a lesson: next lesson → module checkpoint → next module → level exam → next level.
function nextStepOf(st) {
  const f = findLesson(st); if (!f) return null;
  const { l, m } = f, i = m.lessons.indexOf(f.x);
  if (i < m.lessons.length - 1) return { step: m.lessons[i + 1] };
  if (!m.noCheck && !ckPassed(m)) return { quiz: { k: 'ck', id: m.id }, label: `Checkpoint: ${m.title}` };
  const nm = l.modules[l.modules.indexOf(m) + 1];
  if (nm) return { step: nm.lessons[0] };
  if (l.exam && !examPassed(l.id)) return { quiz: { k: 'ex', id: l.id }, label: `${l.name} exam` };
  const nl = LEVELS[LEVELS.indexOf(l) + 1];
  return nl ? { level: nl } : null;
}
function goNext(st) { const n = nextStepOf(st); if (n && n.step) return openStep(n.step); if (n && n.quiz) return startQuiz(n.quiz.k, n.quiz.id); if (n && n.level) return openLevel(n.level.id); return goBack(); }
function nextStepButton(st) {
  const n = nextStepOf(st); if (!n) return '';
  if (n.step) return `<button type="button" class="btn primary" data-step='${JSON.stringify({ kind: n.step.kind, id: n.step.id })}'>Next: ${esc(n.step.title)} →</button>`;
  if (n.quiz) return `<button type="button" class="btn primary" data-quiz='${JSON.stringify(n.quiz)}'>${esc(n.label)} →</button>`;
  return `<button type="button" class="btn primary" data-level="${n.level.id}">Go to ${esc(n.level.name)} →</button>`;
}
let CUR_STEP = null;
function toastSchool(msg) { let t = $('#sc-toast'); if (!t) { t = h('div', 'sc-toast'); t.id = 'sc-toast'; document.body.append(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastSchool.t); toastSchool.t = setTimeout(() => { t.hidden = true; }, 2600); }
function openStep(st) {
  const f = findLesson(st), full = f ? f.x : st;
  if (f && !lessonUnlocked(full)) { toastSchool('Locked: finish the lessons before it first.'); return openLevel(f.l.id); }
  CUR_STEP = full;
  if (f) LV_ST.from = f.l.id;
  if (full.kind === 'dive') { setView('courses'); openCourse(full.id); }
  else if (full.kind === 'ch') { setView('lessons'); jumpChapter(full.id); window.scrollTo({ top: 0 }); if (!routing) try { history.replaceState(null, '', '#ch-' + full.id); } catch (e) { /* file:// */ } }
}
function updateCrumb(v) {
  const el = $('#crumb'); if (!el) return;
  if (v !== 'lessons' && v !== 'courses') { el.innerHTML = ''; return; }
  el.innerHTML = `<button type="button" class="btn ghost" data-back>← ${esc(crumbText())}</button>${v === 'lessons' && CUR_STEP && stepDone(CUR_STEP) ? nextStepButton(CUR_STEP).replace('btn primary', 'btn') : ''}`;
}

// ── Checkpoints & exams ──
const QZS = { run: null };
function buildQuiz(k, id) {
  if (k === 'ck') {
    const l = LEVELS.find((x) => x.modules.some((m) => m.id === id)), m = l.modules.find((x) => x.id === id);
    const pool = POOLS[id] || [], n = Math.min(pool.length, 6 + Math.floor(Math.random() * 3));
    const qs = shuf(pool).slice(0, n).map((q) => ({ ...q, mod: id }));
    const ct = CHART_TASKS[id] ? shuf(CHART_TASKS[id]).slice(0, 1).map((t) => ({ ...t, chart: true, mod: id })) : [];
    return { k, id, l, m, title: `Checkpoint · ${m.title}`, pass: 0.8, items: [...qs, ...ct] };
  }
  const l = LEVELS.find((x) => x.id === id), mods = l.modules.filter((m) => POOLS[m.id]);
  const per = Math.ceil(l.exam.n / mods.length) + 1;
  let qs = shuf(mods.flatMap((m) => shuf(POOLS[m.id]).slice(0, per).map((q) => ({ ...q, mod: m.id })))).slice(0, l.exam.n);
  const ctPool = [...l.modules.flatMap((m) => (CHART_TASKS[m.id] || []).map((t) => ({ ...t, mod: m.id }))), ...(l.exam.extraCharts || []).flatMap((mid) => (CHART_TASKS[mid] || []).map((t) => ({ ...t, mod: mid })))];
  const ct = shuf(ctPool).slice(0, l.exam.charts).map((t) => ({ ...t, chart: true }));
  return { k, id, l, title: `${l.name} exam`, pass: l.pass, items: [...qs, ...ct] };
}
function startQuiz(k, id) {
  const l = k === 'ck' ? LEVELS.find((x) => x.modules.some((m) => m.id === id)) : LEVELS.find((x) => x.id === id); if (!l) return;
  const m = k === 'ck' && l.modules.find((x) => x.id === id);
  if (k === 'ck' ? !checkUnlocked(l, m) : !examUnlocked(l)) { toastSchool(k === 'ck' ? 'Finish every lesson in this module first.' : 'Pass every module checkpoint first.'); return openLevel(l.id); }
  LV_ST.open = l.id; LV_ST.from = l.id; setView('levels');
  QZS.run = { ...buildQuiz(k, id), i: 0, score: 0, picked: null, order: [], missed: [] };
  drawQuiz(); window.scrollTo({ top: 0 });
}
function drawQuiz() {
  const R = QZS.run, body = $('#lv-body'), total = R.items.length;
  if (R.i >= total) return quizResult();
  const it = R.items[R.i];
  body.innerHTML = `<div class="t-hero lv-hero ${R.l.tone}"><div><button type="button" class="btn ghost" data-level="${R.l.id}" style="padding-left:0">← ${esc(R.l.name)}</button><span class="hud lv-tag" style="display:block">${R.k === 'ck' ? 'Module checkpoint' : 'Level exam'} · pass ${Math.round(R.pass * 100)}%</span><h1 class="t-title">${esc(R.title)}</h1></div>
    <div class="dv-meta" style="min-width:220px;margin:0"><span class="pbar"><i style="width:${(R.i / total) * 100}%"></i></span><span class="hud num">${R.i + 1} / ${total} · ${R.score} right</span></div></div><div id="qz-box" class="card"><div class="card-in"></div></div>`;
  const box = body.querySelector('#qz-box .card-in');
  if (it.chart) {
    box.innerHTML = '<div class="eyebrow"><span class="hud">Chart task · one attempt</span></div>';
    const holder = h('div', ''); box.append(holder); const nx = h('div', 'actions'); box.append(nx);
    wTap(holder, () => {}, { spec: it.spec, q: it.q, hit: it.hit, exam: (ok) => { if (ok) R.score++; else R.missed.push(it.mod); nx.innerHTML = `<button type="button" class="btn primary" data-qnext>${R.i < total - 1 ? 'Next →' : 'See result'}</button>`; } });
    return;
  }
  if (R.picked == null && !R.order.length) R.order = shuf(it.o.map((_, k) => k));
  box.innerHTML = `<div class="eyebrow"><span class="hud">Question ${R.i + 1}</span><span class="hud">one attempt</span></div><p class="w-q">${it.q}</p>
    <div class="opts">${R.order.map((k) => `<button type="button" class="opt${R.picked == null ? '' : k === 0 ? ' right' : k === R.picked ? ' wrong' : ''}" data-qk="${k}" ${R.picked != null ? 'disabled' : ''}>${it.o[k]}</button>`).join('')}</div>
    ${R.picked == null ? '' : fbHtml(R.picked === 0, R.picked === 0 ? 'Right' : 'Not quite', it.why) + `<div class="actions"><button type="button" class="btn primary" data-qnext>${R.i < total - 1 ? 'Next →' : 'See result'}</button></div>`}`;
}
function quizResult() {
  const R = QZS.run, total = R.items.length, pct = total ? R.score / total : 0, pass = pct >= R.pass - 1e-9;
  const store = R.k === 'ck' ? PROG.ck : PROG.ex, prev = store[R.id];
  store[R.id] = better(prev, { best: pct, pass, n: ((prev && prev.n) || 0) + 1, at: Date.now() }); store[R.id].n = ((prev && prev.n) || 0) + 1;
  progSave(); logAttempt(R.k, R.id, R.score, total, pass);
  const missedMods = [...new Set(R.missed)].map((id) => LEVELS.flatMap((l) => l.modules).find((m) => m.id === id)).filter((m) => m && (R.k === 'ck' || R.l.modules.includes(m)));
  let next = '';
  if (pass) {
    if (R.k === 'ck') { const n = nextStepOf(R.m.lessons[R.m.lessons.length - 1]); next = n ? nextStepButton(R.m.lessons[R.m.lessons.length - 1]) : ''; }
    else { const nl = LEVELS[LEVELS.indexOf(R.l) + 1]; next = nl ? `<button type="button" class="btn primary" data-level="${nl.id}">${levelUnlocked(nl) ? `Start ${esc(nl.name)} →` : `See what unlocks ${esc(nl.name)} →`}</button>` : ''; }
  }
  $('#lv-body').innerHTML = `<div class="t-hero lv-hero ${R.l.tone}"><div><button type="button" class="btn ghost" data-level="${R.l.id}" style="padding-left:0">← ${esc(R.l.name)}</button><span class="hud lv-tag" style="display:block">${esc(R.title)}</span><h1 class="t-title">${Math.round(pct * 100)}%</h1><p class="t-sub">${R.score} of ${total} right · pass mark ${Math.round(R.pass * 100)}%</p></div></div>
    <div class="card"><div class="card-in">${fbHtml(pass, pass ? (R.k === 'ck' ? 'Checkpoint passed' : 'Exam passed') : 'Not yet', pass ? (R.k === 'ck' ? 'The next module is unlocked.' : `${R.l.name} complete. Nice work.`) : 'Review the lessons below, then try again. You get a fresh set of questions each time.')}
    ${!pass && missedMods.length ? `<p class="hud" style="margin:12px 0 6px">Review</p><div class="lv-review">${missedMods.flatMap((m) => m.lessons.map((x) => `<button type="button" class="btn" data-step='${JSON.stringify({ kind: x.kind, id: x.id })}'>${esc(x.title)} →</button>`)).join('')}</div>` : ''}
    <div class="actions">${pass ? next : `<button type="button" class="btn primary" data-quiz='${JSON.stringify({ k: R.k, id: R.id })}'>↻ Try again</button>`}<button type="button" class="btn ghost" data-level="${R.l.id}">Back to ${esc(R.l.name)}</button></div></div></div>`;
  QZS.run = null;
}

// ── Level picker + level pages ──
function reqPanel(l) {
  const rs = reqs(l); if (!rs.length) return '';
  return `<ul class="lv-req">${rs.map((r) => `<li class="${r.done ? 'ok' : ''}"><span class="lv-ck">${r.done ? '✓' : ''}</span><span>${esc(r.label)}</span><span class="hud">${esc(r.detail)}</span></li>`).join('')}</ul>
    ${rs.some((r) => r.practice && !r.done) ? `<a class="btn" href="/practice" ${LIVE ? '' : 'target="_blank" rel="noopener"'} data-nolevel>Open Practice →</a>` : ''}${!LIVE ? '<p class="hud lv-pnote">Preview: practice reps show in FLOWHUB</p>' : ''}`;
}
function previewToggle() { return LIVE && !SYNC.staff ? '' : SYNC.staff ? '<p class="hud lv-staff">Staff view: everything unlocked</p>' : `<label class="lv-prev hud"><input type="checkbox" data-allopen ${LV_ST.all ? 'checked' : ''}> Preview: unlock everything</label>`; }
function renderLevels(open) {
  const body = $('#lv-body');
  if (!open) {
    body.innerHTML = `<div class="t-hero"><div><h1 class="t-title">Trading School</h1><p class="t-sub">Four sections, in order. Each lesson unlocks the next, each module ends with a checkpoint, and each level ends with an exam. Everything is hands-on practice. Nothing uses real money.</p></div>${previewToggle()}</div>
      <div class="lv-grid">${LEVELS.map((l, i) => { const [d, t] = levelProg(l), open = levelUnlocked(l); return `<button type="button" class="lv-card ${l.tone}${open ? '' : ' locked'}${l.id === 'exo' ? ' exo' : ''}" data-level="${l.id}">
        ${l.id === 'exo' ? '<span class="lv-exo" data-exo></span>' : ''}<span class="lv-n">0${i + 1}</span><span class="hud lv-tag">${open ? esc(l.tag) : '🔒 Locked'}</span><h2>${esc(l.name)}</h2><p class="lv-who">“${esc(l.who)}”</p><p>${esc(l.desc)}</p>
        ${open ? `<span class="dv-meta"><span class="pbar"><i style="width:${(d / t) * 100}%"></i></span><span class="hud num">${levelComplete(l) ? 'Complete ✓' : d ? `${d}/${t} done` : `${l.modules.length} module${l.modules.length > 1 ? 's' : ''} · Start →`}</span></span>` : `<span class="hud" style="color:var(--ink3)">To unlock</span>${reqPanel(l).replace(/<a [^>]*>.*?<\/a>/, '').replace(/<p class="hud lv-pnote">.*?<\/p>/, '')}`}</button>`; }).join('')}</div>
      <button type="button" class="lv-terms" data-terms><span class="hud">Reference · always open</span><b>Terminology</b><span>Every term with a chart you can play, tagged by level.</span><span class="grow"></span><span aria-hidden="true">→</span></button>`;
    const ex = body.querySelector('[data-exo]'); if (ex) exoHero(ex);
    return;
  }
  const l = LEVELS.find((x) => x.id === open); if (!l) return renderLevels(null);
  const [d, t] = levelProg(l), li = LEVELS.indexOf(l), nl = LEVELS[li + 1], unl = levelUnlocked(l);
  let nowSet = false; const isNow = (cond) => { if (cond && !nowSet) { nowSet = true; return true; } return false; };
  const lessonRow = (s, k, m) => { const ok = stepDone(s), op = lessonUnlocked(s), now = isNow(op && !ok); return `<li><button type="button" class="lv-step${ok ? ' ok' : ''}${now ? ' now' : ''}" ${op ? `data-step='${JSON.stringify({ kind: s.kind, id: s.id })}'` : 'disabled'}>
      <span class="lv-dot">${ok ? '✓' : op ? k + 1 : '🔒'}</span><span class="lv-txt"><b>${esc(s.title)}</b><span>${esc(s.sub)}</span></span><span class="chipx">${s.kind === 'ch' ? 'Replay' : 'Hands-on'}</span><span class="lv-go" aria-hidden="true">${!op ? '' : now ? 'Continue →' : ok ? 'Review' : '→'}</span></button></li>`; };
  const ckRow = (m) => { if (m.noCheck) return ''; const op = checkUnlocked(l, m), r = PROG.ck[m.id], ok = ckPassed(m), now = isNow(op && !ok); return `<li><button type="button" class="lv-step lv-quiz${ok ? ' ok' : ''}${now ? ' now' : ''}" ${op ? `data-quiz='${JSON.stringify({ k: 'ck', id: m.id })}'` : 'disabled'}>
      <span class="lv-dot">${ok ? '✓' : op ? '?' : '🔒'}</span><span class="lv-txt"><b>Checkpoint</b><span>6–8 questions${CHART_TASKS[m.id] ? ' + 1 chart task' : ''} · pass 80%${r ? ` · best ${Math.round(r.best * 100)}%` : ''}</span></span><span class="chipx win">Quiz</span><span class="lv-go" aria-hidden="true">${!op ? 'Finish the lessons' : ok ? 'Retake' : 'Start →'}</span></button></li>`; };
  const exRow = () => { if (!l.exam) return ''; const op = examUnlocked(l), r = PROG.ex[l.id], ok = examPassed(l.id), now = isNow(op && !ok); return `<section class="lv-mod lv-exam"><button type="button" class="lv-step lv-quiz${ok ? ' ok' : ''}${now ? ' now' : ''}" ${op ? `data-quiz='${JSON.stringify({ k: 'ex', id: l.id })}'` : 'disabled'}>
      <span class="lv-dot">${ok ? '✓' : op ? '★' : '🔒'}</span><span class="lv-txt"><b>${esc(l.name)} exam</b><span>${l.exam.n} questions + ${l.exam.charts} chart tasks · pass ${Math.round(l.pass * 100)}%${r ? ` · best ${Math.round(r.best * 100)}%` : ''}</span></span><span class="chipx lag">Exam</span><span class="lv-go" aria-hidden="true">${!op ? 'Pass every checkpoint' : ok ? 'Retake' : 'Start →'}</span></button></section>`; };
  body.innerHTML = `<div class="t-hero lv-hero ${l.tone}"><div><button type="button" class="btn ghost" data-levels style="padding-left:0">← All levels</button><span class="hud lv-tag" style="display:block">Section ${li + 1} of ${LEVELS.length} · “${esc(l.who)}”</span><h1 class="t-title">${esc(l.name)}</h1><p class="t-sub">${esc(l.desc)}</p></div>
      <div class="dv-meta" style="min-width:220px;margin:0"><span class="pbar"><i style="width:${(d / t) * 100}%"></i></span><span class="hud num">${d}/${t}</span></div></div>
    ${l.id === 'exo' ? '<div data-exo-hero></div>' : ''}
    ${unl ? '' : `<div class="card lv-lock"><div class="card-in"><div class="eyebrow"><span class="hud">🔒 Locked · to unlock ${esc(l.name)}</span></div>${reqPanel(l)}</div></div>`}
    ${l.modules.map((m, mi) => { const mu = moduleUnlocked(l, m); return `<section class="lv-mod${mu ? '' : ' locked'}"><div class="lv-mh"><span class="hud">Module ${mi + 1}</span><h2>${esc(m.title)}</h2>${moduleComplete(m) ? '<span class="chipx win">Complete ✓</span>' : mu ? '' : '<span class="hud">🔒 Pass the module before</span>'}</div>
      <ol class="lv-path">${m.lessons.map((s, k) => lessonRow(s, k, m)).join('')}${ckRow(m)}</ol></section>`; }).join('')}
    ${exRow()}
    ${nl ? `<button type="button" class="lv-terms" data-level="${nl.id}"><span class="hud">Next section</span><b>${esc(nl.name)}</b><span>${levelUnlocked(nl) ? `“${esc(nl.who)}”` : '🔒 See what unlocks it'}</span><span class="grow"></span><span aria-hidden="true">→</span></button>` : `<button type="button" class="lv-terms" data-terms><span class="hud">Keep sharp</span><b>Terminology quiz</b><span>Test yourself on every term.</span><span class="grow"></span><span aria-hidden="true">→</span></button>`}`;
  const eh = body.querySelector('[data-exo-hero]'); if (eh) exoHero(eh);
}
function openLevel(id) { LV_ST.open = id; QZS.run = null; setView('levels'); window.scrollTo({ top: 0 }); }
document.addEventListener('click', (e) => {
  const inSchool = e.target.closest('#levels-view, #courses-view, #crumb'); if (!inSchool) return;
  if (e.target.closest('[data-nolevel]')) { e.stopPropagation(); return; }
  const qk = e.target.closest('[data-qk]'); if (qk && QZS.run && QZS.run.picked == null) { const R = QZS.run; R.picked = +qk.dataset.qk; if (R.picked === 0) R.score++; else R.missed.push(R.items[R.i].mod); drawQuiz(); return; }
  if (e.target.closest('[data-qnext]') && QZS.run) { const R = QZS.run; R.i++; R.picked = null; R.order = []; drawQuiz(); window.scrollTo({ top: 0 }); return; }
  const qz = e.target.closest('[data-quiz]'); if (qz) { const o = JSON.parse(qz.dataset.quiz); startQuiz(o.k, o.id); return; }
  const st = e.target.closest('[data-step]'); if (st) { openStep(JSON.parse(st.dataset.step)); return; }
  const lv = e.target.closest('[data-level]'); if (lv) { openLevel(lv.dataset.level); return; }
  if (e.target.closest('[data-levels]')) { openLevel(null); return; }
  if (e.target.closest('[data-terms]')) { if (e.target.closest('[data-terms]').closest('#lv-body') && LV_ST.open === 'exo') { setView('terms'); openQuiz(); } else setView('terms'); window.scrollTo({ top: 0 }); return; }
  if (e.target.closest('#crumb [data-back]')) goBack();
});
document.addEventListener('change', (e) => { if (e.target.matches && e.target.matches('[data-allopen]')) { LV_ST.all = e.target.checked; renderLevels(LV_ST.open); } });
route();
loadServer();
</script>
