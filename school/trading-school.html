<meta charset="utf-8">
<title>FLOWHUB Trading School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,700..900&family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: practice chart (left) + coach (right); stacks coach-first on phones.
   Night Ops palette from FLOWHUB: cool dark UI, orange only as a tiny signal. Single dark look by design. */
:root{
  --void:#030405; --abyss:#07090c; --panel:#0a0d12; --panel2:#0e1219;
  --line:#1a2029; --line2:#28313e;
  --ink:#e6ebf2; --ink2:#929fb2; --ink3:#5f6a78;
  --ice:#9ccbff; --icedim:#3b5f86; --signal:#ff6a00;
  --win:#3ee0a1; --loss:#ff4f6d; --lag:#b69cff;
  --f-display:"Archivo","Arial Black","Helvetica Neue",system-ui,sans-serif;
  --f-hud:"Orbitron","Eurostile",system-ui,sans-serif;
  --f-body:"Rajdhani","Barlow Semi Condensed",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--void);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;font-weight:500;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
input,select{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--ice);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hud{font-family:var(--f-hud);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.grow{flex:1}
[hidden]{display:none!important}

.app{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:12px 40px}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:6px 14px}
.logo{font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:-.01em;line-height:1}
.logo b{color:var(--signal)}
.by{display:block;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:8.5px;letter-spacing:.14em;color:var(--ink3);margin-top:2px}
.fh-nav{display:flex;flex-wrap:wrap;gap:2px}
.fh-nav a{position:relative;padding:8px 10px;font-family:var(--f-hud);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);text-decoration:none}
.fh-nav a:hover{color:var(--ink2)}
.fh-nav a[aria-current]{color:var(--ink)}
.fh-nav a[aria-current]::after{content:"";position:absolute;left:10px;right:10px;bottom:-4px;height:2px;background:linear-gradient(90deg,var(--signal) 8px,var(--ice) 8px)}
.fh-nav ~ .bar-title{display:none}
.bar-title{font-family:var(--f-hud);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);padding-left:14px;border-left:1px solid var(--line2)}
.pill{font-family:var(--f-hud);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ice);border:1px solid var(--icedim);padding:4px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--line2);background:var(--panel2);font-family:var(--f-hud);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--icedim)}
.btn.primary{border-color:var(--ice);color:var(--ice);background:rgb(156 203 255 / .08);box-shadow:inset 0 -2px 0 var(--signal)}
.btn.ghost{background:transparent;color:var(--ink2)}
.btn:disabled{opacity:.4}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}.coach{order:-1}}

/* ── Simulator ───────────────────────────── */
.sim{border:1px solid var(--line);background:var(--abyss);min-width:0;display:flex;flex-direction:column}
.tv-top{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sym{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;border:1px solid var(--line2);background:var(--panel);font-family:var(--f-mono);font-size:13px;font-weight:500}
.sym svg{width:14px;height:14px;color:var(--ink3)}
.tfs{display:flex;border:1px solid var(--line2)}
.tfs button{height:30px;min-width:38px;padding:0 8px;background:transparent;border:0;font-family:var(--f-mono);font-size:12px;color:var(--ink2)}
.tfs button[aria-pressed="true"]{background:rgb(156 203 255 / .12);color:var(--ice)}
.conn{font-family:var(--f-hud);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.conn.on{color:var(--win)}
.trade{height:32px;padding:0 16px;border:1px solid var(--ice);background:rgb(156 203 255 / .1);color:var(--ice);font-family:var(--f-hud);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.tv-mid{position:relative;display:flex;min-height:0}
.tools{display:flex;flex-direction:column;gap:2px;padding:6px 4px;border-right:1px solid var(--line);background:var(--panel)}
.tools button{width:34px;height:34px;display:grid;place-items:center;border:1px solid transparent;background:transparent;color:var(--ink2)}
.tools button svg{width:18px;height:18px}
.tools button[aria-pressed="true"]{border-color:var(--icedim);color:var(--ice);background:rgb(156 203 255 / .08)}
.tools button:disabled{opacity:.3}
.chartbox{position:relative;flex:1;min-width:0;height:clamp(320px,56vh,560px)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.legend{position:absolute;left:10px;top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-family:var(--f-mono);font-size:11.5px;color:var(--ink2);pointer-events:none;padding-right:80px}
.legend b{color:var(--ink);font-weight:500}
.legend .up{color:var(--win)} .legend .dn{color:var(--loss)}
.zoom{position:absolute;left:10px;bottom:30px;display:flex;border:1px solid var(--line2);background:rgb(10 13 18 / .9)}
.zoom button{width:32px;height:30px;border:0;background:transparent;color:var(--ink2);font-family:var(--f-mono);font-size:15px}
.zoom button+button{border-left:1px solid var(--line2)}
.player{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--panel);padding:6px 8px}
.sim.replay .tools{display:none}
.player .btn{height:32px}
.player .clock{font-family:var(--f-mono);font-size:12px;color:var(--ink2);padding:0 6px}

/* modals inside the chart */
.modal{position:absolute;inset:0;background:rgb(3 4 5 / .7);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;z-index:5}
.sheet{width:min(440px,100%);background:var(--panel);border:1px solid var(--line2);box-shadow:0 20px 60px rgb(0 0 0 / .6)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-family:var(--f-hud);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.x{width:30px;height:30px;border:0;background:transparent;color:var(--ink3);font-size:18px}
.search-in{width:100%;height:42px;border:0;border-bottom:1px solid var(--line);background:var(--abyss);padding:0 12px;font-family:var(--f-mono);font-size:14px;text-transform:uppercase}
.results{max-height:260px;overflow:auto}
.results button{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:transparent}
.results button:hover{background:var(--panel2)}
.results .s{font-family:var(--f-mono);font-size:13px;color:var(--ice)}
.results .n{font-size:14px;color:var(--ink2)}
.results .e{font-family:var(--f-hud);font-size:8.5px;letter-spacing:.12em;color:var(--ink3)}
.brokers{display:grid;gap:8px;padding:12px}
.broker{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px;border:1px solid var(--line2);background:var(--abyss)}
.broker:hover{border-color:var(--icedim)}
.broker strong{font-size:16px}
.broker span{font-size:13.5px;color:var(--ink2)}

/* order ticket */
.ticket{position:absolute;right:0;top:0;bottom:0;width:310px;max-width:100%;background:var(--panel);border-left:1px solid var(--line2);overflow:auto;z-index:4;display:flex;flex-direction:column;box-shadow:-20px 0 40px rgb(0 0 0 / .45)}
.tk-sec{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.tk-row{display:flex;align-items:center;gap:8px}
.tk-lbl{font-family:var(--f-hud);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.acct-name{font-family:var(--f-mono);font-size:12.5px;color:var(--win)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.side{display:flex;flex-direction:column;align-items:flex-start;padding:8px 10px;border:1px solid var(--line2);background:var(--abyss)}
.side .t{font-family:var(--f-hud);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.side .p{font-family:var(--f-mono);font-size:13px;color:var(--ink2)}
.side.sell[aria-pressed="true"]{border-color:var(--loss);background:rgb(255 79 109 / .12)}
.side.buy[aria-pressed="true"]{border-color:var(--ice);background:rgb(156 203 255 / .14)}
.seg{display:flex;border:1px solid var(--line2)}
.seg button{flex:1;height:32px;border:0;background:transparent;font-family:var(--f-hud);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.seg button[aria-pressed="true"]{background:rgb(156 203 255 / .12);color:var(--ice)}
.seg.small button{height:26px;font-size:8.5px}
.field{height:36px;width:100%;min-width:0;border:1px solid var(--line2);background:var(--abyss);padding:0 10px;font-family:var(--f-mono);font-size:13.5px}
.stepper{display:flex}
.stepper button{width:36px;height:36px;border:1px solid var(--line2);background:var(--panel2);font-family:var(--f-mono)}
.stepper .field{text-align:center;border-inline:0}
.chip{height:26px;padding:0 9px;border:1px dashed var(--icedim);background:transparent;color:var(--ice);font-size:13px;white-space:nowrap}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.check input{width:17px;height:17px;accent-color:var(--ice)}
.readout{font-family:var(--f-mono);font-size:12px;color:var(--ink2)}
.readout .r{color:var(--loss)} .readout .g{color:var(--win)}
.tk-sum{padding:10px 12px;font-family:var(--f-mono);font-size:12.5px;color:var(--ink2);display:grid;gap:3px}
.submit{margin:10px 12px 14px;height:46px;border:0;background:var(--ice);color:#06121f;font-family:var(--f-mono);font-size:13.5px;font-weight:500}
.submit:disabled{background:var(--line2);color:var(--ink3)}
.tk-note{padding:0 12px 12px;font-size:13px;color:var(--ink3)}

/* brain */
.brain{border-top:1px solid var(--line);background:linear-gradient(180deg,rgb(156 203 255 / .035),transparent 60%),var(--panel);padding:10px}
.brain-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.brain-h .dot{width:7px;height:7px;border-radius:50%;background:var(--signal);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.stages{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.stage{flex:1 0 auto;min-width:92px;display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);font-size:13px;color:var(--ink3);white-space:nowrap}
.stage i{font-style:normal;font-family:var(--f-mono);font-size:11px;width:18px;height:18px;display:grid;place-items:center;border:1px solid var(--line2)}
.stage.done{color:var(--ink2);border-color:var(--line2)}
.stage.done i{background:var(--win);border-color:var(--win);color:#032015}
.stage.now{color:var(--ice);border-color:var(--ice);background:rgb(156 203 255 / .07)}
.stage.now i{border-color:var(--ice)}
.brain-row{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:10px;margin-top:8px}
@media (max-width:620px){.brain-row{grid-template-columns:minmax(0,1fr)}}
.thoughts{display:grid;gap:4px;align-content:start;min-height:92px}
.thought{font-family:var(--f-mono);font-size:12px;line-height:1.5;color:var(--ink3);padding-left:14px;position:relative}
.thought::before{content:"›";position:absolute;left:2px;color:var(--ink3)}
.thought.new{color:var(--ink)}
.thought.new::before{color:var(--signal)}
.thought.fire{color:var(--win)}
.widget{border:1px solid var(--line);background:var(--abyss);padding:8px;min-height:92px}
.widget svg{display:block;width:100%;height:auto}
.widget .wt{font-family:var(--f-hud);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.widget p{margin:0;font-size:13.5px;color:var(--ink2)}

/* account panel */
.acct{border-top:1px solid var(--line)}
.tabs{display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{height:34px;padding:0 10px;border:0;border-bottom:2px solid transparent;background:transparent;font-family:var(--f-hud);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.acct-sum{font-family:var(--f-mono);font-size:12px;color:var(--ink2);padding:6px 4px}
.acct-body{overflow-x:auto;min-height:74px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
th{font-family:var(--f-hud);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:500;text-align:left;padding:7px 10px}
td{padding:7px 10px;border-top:1px solid var(--line);font-family:var(--f-mono);font-size:12.5px}
td .mini{height:26px;padding:0 9px;border:1px solid var(--line2);background:var(--panel2);font-family:var(--f-hud);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase}
.empty{padding:16px 12px;color:var(--ink3);font-size:14px}
.pos{color:var(--win)} .neg{color:var(--loss)}

/* ── Coach ───────────────────────────── */
.coach{display:grid;gap:12px;min-width:0;position:sticky;top:12px}
@media (max-width:980px){.coach{position:static}}
.chapters{display:flex;gap:4px;flex-wrap:wrap}
.chap{display:flex;align-items:center;gap:6px;height:30px;padding:0 9px;border:1px solid var(--line);background:var(--panel);font-size:13px;color:var(--ink3)}
.chap .n{font-family:var(--f-mono);font-size:10.5px}
.chap.now{border-color:var(--ice);color:var(--ice)}
.chap.done{color:var(--ink2)}
.chap.done .n{color:var(--win)}
.chap.model{border-style:dashed}
.card{border:1px solid var(--line2);background:var(--panel);position:relative}
.card::before{content:"";position:absolute;left:-1px;top:-1px;width:14px;height:14px;border-left:2px solid var(--ice);border-top:2px solid var(--ice)}
.card-in{padding:16px;display:grid;gap:12px}
.eyebrow{display:flex;justify-content:space-between;gap:8px}
.card h2{margin:0;font-family:var(--f-display);font-weight:900;font-stretch:112%;font-size:25px;line-height:1.05;text-transform:uppercase;letter-spacing:-.005em;text-wrap:balance}
.body{color:var(--ink2);font-size:16px;display:grid;gap:8px}
.body p{margin:0}
.body b{color:var(--ink);font-weight:700}
.body .k{font-family:var(--f-mono);font-size:13.5px;color:var(--ice)}
.why{border-left:2px solid var(--icedim);padding:2px 0 2px 10px;font-size:15px;color:var(--ink2)}
.why b{font-family:var(--f-hud);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ice);display:block;font-weight:500;margin-bottom:2px}
.visual{border:1px solid var(--line);background:var(--abyss);padding:10px}
.visual svg{display:block;width:100%;height:auto;max-height:190px}
.task{border:1px solid var(--line2);background:var(--panel2);padding:10px 12px;display:grid;gap:4px}
.task .tk-lbl{color:var(--signal)}
.task p{margin:0;font-weight:600}
.task.ok{border-color:var(--win)}
.task.ok .tk-lbl{color:var(--win)}
.opts{display:grid;gap:6px}
.opt{text-align:left;padding:10px 12px;border:1px solid var(--line2);background:var(--abyss);font-size:15.5px;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--icedim)}
.opt.right{border-color:var(--win);background:rgb(62 224 161 / .08)}
.opt.wrong{border-color:var(--lag);opacity:.75}
.fb{padding:10px 12px;font-size:15px;border:1px solid}
.fb.good{border-color:rgb(62 224 161 / .5);background:rgb(62 224 161 / .07);color:var(--ink)}
.fb.bad{border-color:rgb(182 156 255 / .5);background:rgb(182 156 255 / .07);color:var(--ink)}
.fb b{font-family:var(--f-hud);font-size:9px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:2px;font-weight:500}
.fb.good b{color:var(--win)} .fb.bad b{color:var(--lag)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .grow{min-width:0}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calc label{display:grid;gap:4px}
.calc-out{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.calc-out div{border:1px solid var(--line);padding:8px;display:grid;gap:2px}
.calc-out .v{font-family:var(--f-mono);font-size:16px;color:var(--ink)}
.rules{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.rules label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);cursor:pointer}
.rules input{margin-top:3px;width:17px;height:17px;accent-color:var(--win);flex:none}
.rules label:has(input:checked){border-color:rgb(62 224 161 / .45);color:var(--ink)}
.progress{height:2px;background:var(--line);position:relative;overflow:hidden}
.progress i{position:absolute;inset:0 auto 0 0;background:var(--ice);transition:width .4s}

.hl{position:relative;z-index:6;outline:2px solid var(--signal)!important;outline-offset:2px;animation:hl 1s ease-in-out infinite}
@keyframes hl{50%{outline-color:rgb(255 106 0 / .25)}}
.pulse-btn{animation:pb 1.4s ease-in-out infinite}
@keyframes pb{50%{box-shadow:0 0 0 4px rgb(156 203 255 / .18)}}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;width:min(520px,calc(100% - 32px));padding:11px 14px;border:1px solid var(--line2);background:var(--panel2);box-shadow:0 14px 40px rgb(0 0 0 / .6);font-size:15px;transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.good{border-color:var(--win)} .toast.bad{border-color:var(--lag)}
.toast b{font-family:var(--f-hud);font-size:9px;letter-spacing:.14em;text-transform:uppercase;display:block;font-weight:500}
.toast.good b{color:var(--win)} .toast.bad b{color:var(--lag)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.dock{display:none}
@media (max-width:980px){
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:10px;align-items:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgb(10 13 18 / .96);border-top:1px solid var(--line2);backdrop-filter:blur(8px);transform:translateY(0);transition:transform .2s}
  .dock.away{transform:translateY(110%)}
  .dock .d-txt{flex:1;min-width:0;font-size:14.5px;font-weight:600;line-height:1.3}
  .dock .d-txt .tk-lbl{display:block;color:var(--signal);margin-bottom:1px}
  .dock.ok .d-txt .tk-lbl{color:var(--win)}
  .dock .btn{height:34px;padding:0 10px;flex:none}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .app{padding-bottom:110px}
}

/* ── Views + Terminology ───────────────────────────── */
.views{display:flex;border:1px solid var(--line2)}
.views button{height:32px;padding:0 12px;border:0;background:transparent;font-family:var(--f-hud);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.views button[aria-pressed="true"]{background:rgb(156 203 255 / .12);color:var(--ice);box-shadow:inset 0 -2px 0 var(--signal)}
body.terms-on #restart,body.terms-on .dock{display:none}
.terms{display:grid;gap:14px}
.t-hero{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;justify-content:space-between;border:1px solid var(--line);background:linear-gradient(120deg,rgb(156 203 255 / .06),transparent 55%),var(--panel);padding:18px 16px}

<div class="dock away" id="dock"><div class="d-txt" id="dock-txt"></div><button type="button" class="btn ghost" id="dock-show">Show me</button><button type="button" class="btn primary" id="dock-more">Coach ↑</button></div>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const TICK = 0.25, PT = 2; // MNQ: 0.25 tick, $2 per point per contract
const r2 = (v) => Math.round(v * 100) / 100;
const snap = (p, t = TICK) => r2(Math.round(p / t) * t);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = (p, d = 2) => Number(p).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const usd = (v) => (v < 0 ? '−' : '') + '$' + fmt(Math.abs(v));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const R = rng(20260928);
const clock = (t) => { t = ((t % 86400) + 86400) % 86400; const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60); return `${h % 12 || 12}:${String(m).padStart(2, '0')}${h < 12 ? ' AM' : ' PM'}`; };
const clockShort = (t) => { t = ((t % 86400) + 86400) % 86400; const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60); return `${h}:${String(m).padStart(2, '0')}`; };

const SYMS = [
  { s: 'MNQ1!', n: 'Micro E-mini Nasdaq-100 Futures', ex: 'CME', ser: 'nq', tick: 0.25 },
  { s: 'NQ1!', n: 'E-mini Nasdaq-100 Futures', ex: 'CME', ser: 'nq', tick: 0.25 },
  { s: 'MES1!', n: 'Micro E-mini S&P 500 Futures', ex: 'CME', ser: 'es', tick: 0.25 },
  { s: 'ES1!', n: 'E-mini S&P 500 Futures', ex: 'CME', ser: 'es', tick: 0.25 },
  { s: 'SPY', n: 'SPDR S&P 500 ETF Trust', ex: 'NYSE ARCA', ser: 'spy', tick: 0.01 },
  { s: 'QQQ', n: 'Invesco QQQ Trust', ex: 'NASDAQ', ser: 'qqq', tick: 0.01 },
];
const symOf = (s) => SYMS.find((x) => x.s === s);
const TF_MIN = { '1m': 1, '5m': 5, '15m': 15, '1h': 60 };

// ── Live practice data ─────────────────────────────────────
const END_T = 10 * 3600 + 40 * 60;
let simT = END_T;
function genSeries(base, vol, tick, seed) {
  const r = rng(seed), n = 1500, out = [];
  let p = base;
  for (let i = 0; i < n; i++) {
    const t = END_T - (n - 1 - i) * 60, o = p;
    let h = o, l = o;
    for (let k = 0; k < 6; k++) { p += (r() - 0.5) * 2 * vol + (base - p) * 0.004; h = Math.max(h, p); l = Math.min(l, p); }
    const sp = (v) => snap(v, tick);
    out.push({ t, o: sp(o), h: sp(h), l: sp(l), c: sp(p) });
    p = sp(p);
  }
  return out;
}
const SER = { nq: genSeries(24600, 1.5, 0.25, 7), es: genSeries(6720, 0.42, 0.25, 11), spy: genSeries(671.2, 0.05, 0.01, 13), qqq: genSeries(598.4, 0.06, 0.01, 17) };

function aggregate(arr, m) {
  if (m === 1) return arr;
  const out = [];
  for (const c of arr) {
    const bt = Math.floor(c.t / (m * 60)) * m * 60, last = out[out.length - 1];
    if (!last || last.t !== bt) out.push({ t: bt, o: c.o, h: c.h, l: c.l, c: c.c });
    else { last.h = Math.max(last.h, c.h); last.l = Math.min(last.l, c.l); last.c = c.c; }
  }
  return out;
}

// ── State ──────────────────────────────────────────────────
const S = {
  mode: 'live', sym: 'SPY', tf: '1m', zoom: 9, pan: 0, tool: 'cursor',
  level: null, inspected: false, zoomedOut: false, hover: null, pin: null,
  connected: false, anchor: SER.nq[SER.nq.length - 1].c,
  order: null, pos: null, history: [], balance: 50000, realized: 0, lastClose: null,
  drag: null, tab: 'pos', slMovedAway: false,
};
const T = { side: null, type: 'market', price: null, qty: 1, slOn: false, slMode: 'ticks', slTicks: 60, slPx: null, tpOn: false, tpMode: 'ticks', tpTicks: 160, tpPx: null };
function resetT() { Object.assign(T, { side: null, type: 'market', price: null, qty: 1, slOn: false, slMode: 'ticks', slTicks: 60, slPx: null, tpOn: false, tpMode: 'ticks', tpTicks: 160, tpPx: null }); }

function lastLive() { return SER.nq[SER.nq.length - 1].c; }
function last() { return S.mode === 'replay' ? RP.price : lastLive(); }

// ── Toast + feedback ───────────────────────────────────────
let toastTimer = 0;
function toast(kind, title, text) {
  const el = $('#toast');
  el.className = `toast ${kind} show`;
  el.innerHTML = `<b>${esc(title)}</b>${text}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), kind === 'bad' ? 6500 : 4500);
}
function good(text, title = 'Nice') { toast('good', title, text); setFeedback('good', title, text); }
function bad(text, title = 'Not quite') { toast('bad', title, text); setFeedback('bad', title, text); }

// ── Live price engine ──────────────────────────────────────
function nqStep(p) {
  if (S.order && !S.pos && S.order.type === 'limit') {
    const d = p - S.order.price;
    if (d > 0) return snap(p - Math.max(0.5, Math.min(3, d * 0.14)) + (R() - 0.5) * 1.2);
  }
  if (S.pos) {
    const e = S.pos.entry, dist = S.pos.tp != null ? S.pos.tp - e : 20;
    const late = curStep() && curStep().id === 'close';
    const f = late ? 0.8 : S.pos.sl != null && S.pos.sl >= e ? 0.6 : 0.45;
    const tgt = e + clamp(dist * f, 2, Math.max(2, dist - 1.5));
    let np = snap(p + (tgt - p) * 0.12 + (R() - 0.5) * 1.6);
    np = Math.max(np, e + 0.5);
    if (S.pos.tp != null && !late) np = Math.min(np, S.pos.tp - 0.5);
    return np;
  }
  const anchor = S.level != null && !S.order ? Math.max(S.anchor, S.level + 10) : S.anchor;
  return snap(p + (anchor - p) * 0.04 + (R() - 0.5) * 1.8);
}
function liveTick() {
  simT += 5;
  for (const k of Object.keys(SER)) {
    const a = SER[k], lc = a[a.length - 1], tick = k === 'spy' || k === 'qqq' ? 0.01 : 0.25;
    let p = lc.c;
    if (k === 'nq') p = nqStep(p);
    else p = snap(p + (R() - 0.5) * (k === 'es' ? 0.9 : 0.1), tick);
    const bt = Math.floor(simT / 60) * 60;
    if (bt > lc.t) { a.push({ t: bt, o: lc.c, h: Math.max(lc.c, p), l: Math.min(lc.c, p), c: p }); if (a.length > 2400) a.shift(); }
    else { lc.c = p; lc.h = Math.max(lc.h, p); lc.l = Math.min(lc.l, p); }
  }
  if (S.mode === 'live') { onPrice(lastLive()); refreshLive(); }
}

// ── Orders, fills, brackets (long only in these lessons) ───
function onPrice(cp) {
  if (S.order && !S.pos) {
    const o = S.order;
    const hit = o.type === 'limit' ? cp <= o.price : o.type === 'stop' ? cp >= o.price : true;
    if (hit) fill(o.type === 'market' ? cp : o.price);
  }
  if (S.pos) {
    const p = S.pos;
    if (p.sl != null && cp <= p.sl) closePos(p.sl, 'stop');
    else if (p.tp != null && cp >= p.tp) closePos(p.tp, 'target');
  }
}
function fill(price) {
  const o = S.order;
  S.pos = { entry: price, qty: o.qty, sl: o.sl, tp: o.tp };
  S.order = null;
  toast('good', 'Filled', `Bought ${o.qty} MNQ1! at <span class="num">${fmt(price)}</span>. Your stop and target are now live.`);
  onEvent('fill');
}
function closePos(price, why) {
  const p = S.pos, pnl = (price - p.entry) * PT * p.qty;
  S.realized += pnl; S.balance += pnl;
  S.history.unshift({ entry: p.entry, exit: price, qty: p.qty, pnl, why });
  S.lastClose = { pnl, why, price };
  S.pos = null;
  const what = why === 'target' ? 'Take profit filled' : why === 'stop' ? (Math.abs(price - p.entry) < 0.01 ? 'Stopped out at breakeven' : 'Stop loss filled') : 'Position closed';
  toast(pnl >= 0 ? 'good' : 'bad', what, `Closed at <span class="num">${fmt(price)}</span> for <span class="num">${usd(pnl)}</span>.`);
  onEvent('close');
}
function cancelOrder() {
  if (!S.order) return;
  S.order = null;
  toast('bad', 'Order cancelled', 'Your working order was cancelled.');
  onEvent('cancel');
}
function flatAll() { S.order = null; S.pos = null; }

// ── Chart ───────────────────────────────────────────────────
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, VIEW = null, HITS = [], dirtyFlag = true;
function resize() {
  const b = $('#chartbox').getBoundingClientRect();
  DPR = window.devicePixelRatio || 1; W = Math.max(200, b.width); H = Math.max(200, b.height);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  dirtyFlag = true;
}
new ResizeObserver(resize).observe($('#chartbox'));
function dirty() { dirtyFlag = true; }
function frame() { if (dirtyFlag) { dirtyFlag = false; draw(); } requestAnimationFrame(frame); }

const COL = {};
function readColors() { const cs = getComputedStyle(document.documentElement); for (const k of ['void', 'abyss', 'panel', 'panel2', 'line', 'line2', 'ink', 'ink2', 'ink3', 'ice', 'icedim', 'signal', 'win', 'loss', 'lag']) COL[k] = cs.getPropertyValue('--' + k).trim(); }
readColors();
function alpha(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; }

function chartData() {
  if (S.mode === 'replay') return replayData();
  return aggregate(SER[symOf(S.sym).ser], TF_MIN[S.tf]);
}
function niceStep(span, n) { const s0 = span / n, mag = 10 ** Math.floor(Math.log10(s0)); return [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= s0) || s0; }
function pxFmt(p) { return symOf(S.sym).tick < 0.25 ? fmt(p, 2) : fmt(p, 2); }

function draw() {
  const PA = W < 520 ? 58 : 70, TA = 22, pw = W - PA, ph = H - TA;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = COL.abyss; ctx.fillRect(0, 0, W, H);
  const data = chartData();
  HITS = [];
  if (!data.length && S.mode !== 'replay') { VIEW = null; return; }
  let bw, start, slots;
  if (S.mode === 'replay') {
    slots = RP.m.candles.length + 3; bw = pw / slots; start = 0;
  } else {
    bw = S.zoom; slots = Math.max(8, Math.floor(pw / bw));
    const end = data.length - S.pan; start = Math.max(0, end - (slots - 4));
  }
  const endIdx = S.mode === 'replay' ? data.length : Math.max(0, data.length - S.pan);
  const vis = data.slice(start, endIdx);
  // y-range
  let lo, hi;
  if (S.drag && VIEW) { lo = VIEW.lo; hi = VIEW.hi; }
  else if (S.mode === 'replay') { lo = RP.m.lo; hi = RP.m.hi; }
  else {
    lo = Math.min(...vis.map((c) => c.l)); hi = Math.max(...vis.map((c) => c.h));
    if (symOf(S.sym).ser === 'nq') {
      const ex = [S.level, S.order && S.order.price, S.order && S.order.sl, S.order && S.order.tp, S.pos && S.pos.entry, S.pos && S.pos.sl, S.pos && S.pos.tp].filter((v) => v != null);
      for (const v of ex) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
    }
    const pad = (hi - lo) * 0.1 || 1; lo -= pad; hi += pad;
  }
  const y = (p) => ((hi - p) / (hi - lo)) * ph;
  const xOf = (i) => (i - start) * bw + bw / 2;
  VIEW = { lo, hi, pw, ph, bw, start, y, xOf, data, len: data.length, pOf: (yy) => hi - (yy / ph) * (hi - lo) };

  // grid + price labels
  const step = niceStep(hi - lo, 6);
  ctx.font = (W < 520 ? '9.5px ' : '11px ') + getComputedStyle(document.body).getPropertyValue('--f-mono');
  ctx.textBaseline = 'middle';
  for (let p = Math.ceil(lo / step) * step; p <= hi; p += step) {
    const yy = Math.round(y(p)) + 0.5;
    ctx.strokeStyle = COL.line; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(pw, yy); ctx.stroke();
    ctx.fillStyle = COL.ink3; ctx.textAlign = 'left'; ctx.fillText(pxFmt(p), pw + 6, yy);
  }
  // time labels
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const every = Math.max(1, Math.ceil(64 / bw));
  for (let i = start; i < start + slots && i < (S.mode === 'replay' ? RP.m.candles.length : data.length); i++) {
    if (i % every) continue;
    const t = S.mode === 'replay' ? RP.m.t0 + i * (RP.m.tf || 300) : data[i] && data[i].t;
    if (t == null) continue;
    ctx.fillStyle = COL.ink3; ctx.fillText(clockShort(t), xOf(i), H - 6);
  }
  ctx.strokeStyle = COL.line; ctx.beginPath(); ctx.moveTo(pw + 0.5, 0); ctx.lineTo(pw + 0.5, H); ctx.moveTo(0, ph + 0.5); ctx.lineTo(W, ph + 0.5); ctx.stroke();

  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, pw, ph); ctx.clip();
  if (S.mode === 'replay') drawOverlays('under');
  // candles
  const cw = Math.max(1, Math.min(bw * 0.68, 18));
  vis.forEach((c, k) => {
    const i = start + k, x = xOf(i), up = c.c >= c.o, col = up ? COL.win : COL.loss;
    ctx.strokeStyle = col; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(Math.round(x) + 0.5, y(c.h)); ctx.lineTo(Math.round(x) + 0.5, y(c.l)); ctx.stroke();
    const top = y(Math.max(c.o, c.c)), bh = Math.max(1, Math.abs(y(c.o) - y(c.c)));
    ctx.fillStyle = up ? alpha(COL.win, c.forming ? 0.55 : 0.9) : alpha(COL.loss, c.forming ? 0.55 : 0.9);
    ctx.fillRect(Math.round(x - cw / 2), top, Math.round(cw), bh);
    if (S.pin === i) { ctx.strokeStyle = COL.ice; ctx.strokeRect(Math.round(x - cw / 2) - 2.5, y(c.h) - 3.5, Math.round(cw) + 5, y(c.l) - y(c.h) + 7); }
  });
  if (S.mode === 'replay') drawOverlays('over');
  ctx.restore();

  // last price
  const lp = S.mode === 'replay' ? (vis.length ? vis[vis.length - 1].c : null) : data[data.length - 1].c;
  if (lp != null) {
    const lc = vis[vis.length - 1], col = lc && lc.c >= lc.o ? COL.win : COL.loss;
    ctx.setLineDash([2, 3]); ctx.strokeStyle = alpha(col, 0.7); ctx.beginPath(); ctx.moveTo(0, Math.round(y(lp)) + 0.5); ctx.lineTo(pw, Math.round(y(lp)) + 0.5); ctx.stroke(); ctx.setLineDash([]);
    axisTag(lp, col, '#06121f');
  }
  // level + trade lines (MNQ only)
  if (symOf(S.sym).ser === 'nq') {
    if (S.level != null && S.mode === 'live') { hline(S.level, COL.ice, [], 'Your level'); axisTag(S.level, COL.ice, '#06121f'); }
    if (S.order) {
      const o = S.order;
      tradeLine(o.price ?? lp, COL.ice, [6, 4], `BUY ${o.type === 'limit' ? 'LMT' : o.type.toUpperCase()} ${o.qty}`, 'cancelOrder');
      if (o.sl != null) tradeLine(o.sl, COL.loss, [6, 4], `SL  ${usd(-(o.price - o.sl) * PT * o.qty)}`, null, 'sl');
      if (o.tp != null) tradeLine(o.tp, COL.win, [6, 4], `TP  ${usd((o.tp - o.price) * PT * o.qty)}`, null, 'tp');
    }
    if (S.pos) {
      const p = S.pos, pnl = (lp - p.entry) * PT * p.qty;
      tradeLine(p.entry, COL.win, [], `LONG ${p.qty}   ${usd(pnl)}`, 'closePos');
      if (p.sl != null) tradeLine(p.sl, COL.loss, [], `SL  ${usd((p.sl - p.entry) * PT * p.qty)}`, null, 'sl');
      if (p.tp != null) tradeLine(p.tp, COL.win, [4, 3], `TP  ${usd((p.tp - p.entry) * PT * p.qty)}`, null, 'tp');
    }
  }
  // crosshair
  if (S.hover && !S.drag) {
    const { x: hx, y: hy } = S.hover;
    if (hx < pw && hy < ph) {
      ctx.setLineDash([3, 4]); ctx.strokeStyle = alpha(COL.ink2, 0.5);
      ctx.beginPath(); ctx.moveTo(hx + 0.5, 0); ctx.lineTo(hx + 0.5, ph); ctx.moveTo(0, hy + 0.5); ctx.lineTo(pw, hy + 0.5); ctx.stroke(); ctx.setLineDash([]);
      axisTag(snap(VIEW.pOf(hy), symOf(S.sym).tick), COL.line2, COL.ink);
    }
  }
  renderLegend();

  function axisTag(p, bg, fg) {
    const yy = y(p); if (yy < -8 || yy > ph + 8) return;
    ctx.fillStyle = bg; ctx.fillRect(pw + 1, yy - 9, PA - 2, 18);
    ctx.fillStyle = fg; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(pxFmt(p), pw + 6, yy + 0.5);
  }
  function hline(p, col, dash, label) {
    const yy = Math.round(y(p)) + 0.5;
    ctx.setLineDash(dash); ctx.strokeStyle = col; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(pw, yy); ctx.stroke(); ctx.setLineDash([]);
    if (label) { ctx.fillStyle = col; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText(label, pw - 8, yy - 3); }
  }
  function tradeLine(p, col, dash, label, action, dragKey) {
    const yy = Math.round(y(p)) + 0.5;
    ctx.setLineDash(dash); ctx.strokeStyle = col; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(pw, yy); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = '11px ' + getComputedStyle(document.body).getPropertyValue('--f-mono');
    const tw = ctx.measureText(label).width, bx = Math.min(pw * 0.42, pw - tw - 60), bh = 20;
    ctx.fillStyle = COL.panel; ctx.fillRect(bx, yy - bh / 2, tw + 16 + (action ? 22 : 0) + (dragKey ? 14 : 0), bh);
    ctx.strokeStyle = col; ctx.strokeRect(bx + 0.5, yy - bh / 2 + 0.5, tw + 15 + (action ? 22 : 0) + (dragKey ? 14 : 0), bh - 1);
    let tx = bx + 8;
    if (dragKey) { ctx.fillStyle = col; for (let k = -3; k <= 3; k += 3) ctx.fillRect(tx, yy + k - 0.5, 7, 1); tx += 14; }
    ctx.fillStyle = col; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(label, tx, yy + 0.5);
    axisTag(p, col, '#06121f');
    if (action) {
      const xx = tx + tw + 6;
      ctx.strokeStyle = col; ctx.beginPath(); ctx.moveTo(xx - 1, yy - bh / 2); ctx.lineTo(xx - 1, yy + bh / 2); ctx.stroke();
      ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.fillText('×', xx + 9, yy);

// ── Chapters & steps ───────────────────────────────────────
const CH = [
  { id: 'chart', name: 'Your chart' }, { id: 'connect', name: 'Connect' }, { id: 'order', name: 'Build the order' },
  { id: 'manage', name: 'Manage it' }, { id: 'limits', name: 'Your limits' },
  { id: 'dl', name: 'Extended Learning', model: true }, { id: 'hl', name: 'H/L', model: true }, { id: 'po3', name: 'PO3 · New York', model: true }, { id: 'asia', name: 'PO3 · Asia', model: true },
  { id: 'end', name: 'Bare minimum' },
];
const q = (text, options) => ({ text, options });
// Phones have thin candles: accept a tap on a neighbour when it lands near the right price.
function nearCandle(target, i, p, price) {
  if (i === target) return true;
  const slack = VIEW && VIEW.bw < 12 ? 1 : 0;
  return Math.abs(i - target) <= slack && Math.abs(VIEW.y(p) - VIEW.y(price)) < 26;
}
const opt = (t, ok, fb) => ({ t, ok, fb });

function signalSubmit(sig) {
  return () => {
    if (T.side !== 'buy') return 'The signal is a LONG, so choose <b>Buy</b>.';
    if (T.type !== 'limit') return 'Use a <b>Limit</b> order at the signal entry so you get that exact price.';
    if (T.price == null || Math.abs(T.price - sig.entry) > 0.01) return `Set the limit price to the signal entry: <b class="num">${fmt(sig.entry)}</b> (or tap “Use signal entry”).`;
    if (T.qty !== 1) return 'Keep it to <b>1</b> contract while you practise.';
    if (!T.slOn) return 'Turn on the <b>Stop loss</b>. The signal gives you the price.';
    const sl = slPrice(), st = Math.round((sig.entry - sig.stop) / TICK);
    if (sl == null || Math.abs(sl - sig.stop) > 0.01) return `Your stop is at <span class="num">${sl != null ? fmt(sl) : '—'}</span>. The signal's stop is <span class="num">${fmt(sig.stop)}</span>: ${fmt(sig.entry - sig.stop)} points below entry × 4 = <b>${st} ticks</b>. Or switch the stop to Price and type it in.`;
    if (!T.tpOn) return 'Turn on the <b>Take profit</b>.';
    const tp = tpPrice(), tt = Math.round((sig.target - sig.entry) / TICK);
    if (tp == null || Math.abs(tp - sig.target) > 0.01) return `Your target is at <span class="num">${tp != null ? fmt(tp) : '—'}</span>. The signal's target is <span class="num">${fmt(sig.target)}</span>: ${fmt(sig.target - sig.entry)} points × 4 = <b>${tt} ticks</b>.`;
    return true;
  };
}
function tradeTask(sig) { return `Buy 1 MNQ1!, Limit at <b class="num">${fmt(sig.entry)}</b>, stop <b class="num">${fmt(sig.stop)}</b>, target <b class="num">${fmt(sig.target)}</b>. Then press Buy.`; }
function tradeBody(sig) {
  const sp = sig.entry - sig.stop, tp = sig.target - sig.entry;
  return `<p>Same ticket as before, now with the signal's numbers. Turn prices into ticks like this:</p>
    <p class="k">stop: ${fmt(sig.entry)} − ${fmt(sig.stop)} = ${fmt(sp)} pts × 4 = ${Math.round(sp / TICK)} ticks<br>target: ${fmt(sig.target)} − ${fmt(sig.entry)} = ${fmt(tp)} pts × 4 = ${Math.round(tp / TICK)} ticks</p>
    <p>Or switch the stop and target to <b>Price</b> and type the prices. Risk on 1 MNQ: <b>${usd(sp * PT)}</b>.</p>`;
}
function replaySteps(id) {
  const m = MODELS[id], sig = m.signal;
  const common = {
    trade: { id: id + '-trade', ch: id, title: 'Take the signal', body: tradeBody(sig), why: 'The label is only useful if you can turn it into an order quickly and exactly: same entry, same stop, same target, every time.', task: tradeTask(sig), target: '#ticket', enter() { S.ticketOpen = true; renderTicket(); playTo(RP.shown); }, submit: signalSubmit(sig), check: () => !!(S.order || S.pos), ok: 'Order in. The bracket is attached: stop and target go live the moment you fill.', playBlock: 'Place the trade first. The replay waits for you.' },
    result: { id: id + '-result', ch: id, title: 'Let it play out', body: '<p>Hands off. The stop and target are working. Watch the brain panel while price moves.</p>', why: 'Most losses from good setups come from meddling: moving the stop, closing early out of fear, adding size. A plan you don’t follow isn’t a plan.', task: 'Press ▶ Play and let the trade finish.', target: '#play', enter() { RP.flags.closedN = S.history.length; playTo(m.candles.length - 1); }, check: () => S.history.length > (RP.flags.closedN || 0), ok: () => S.lastClose && S.lastClose.why === 'target' ? `Target hit: <b>${usd(S.lastClose.pnl)}</b> on 1 MNQ.` : `Closed for <b>${usd(S.lastClose ? S.lastClose.pnl : 0)}</b>. Closing early is allowed. Taking something off along the way is part of the model.` , react(ev) { if (ev === 'cancel') { bad('You cancelled the order. Place it again.'); goTo(id + '-trade'); } } },
  };
  if (id === 'dl') return [
    { id: 'dl-intro', ch: 'dl', title: 'Extended Learning: how a level works', body: '<p>The whole model in one sentence: <b>find a higher-timeframe level, refine it down through lower timeframes to cut the drawdown, and let price come to you.</b></p><p>Around 3 to 5 setups a week. High win rate, high reward. The hard part is waiting.</p>', visual: VIS.refine, why: 'A 4H level might need 150 ticks of room. Refined to the 15m it can need 50 or less, same idea and same target, a fraction of the risk.', task: 'Press Next to load the overnight session.', info: true, enter() { if (!RP.m || RP.m.id !== 'dl' || S.mode !== 'replay') loadReplay('dl'); RP.flags.h0 = S.history.length; } },
    { id: 'dl-bias', ch: 'dl', title: 'Step 1: build the bias', body: `<p>Start at the 6 PM open. Mark the <b>opening prices</b>: 6 PM daily open, midnight (true day) open, and later 8:30 and 9:30.</p><p><b>Below the opens → look for longs. Above them → shorts.</b> They’re a confluence, not a deal breaker.</p>`, target: '#widget', quiz: q(`Your level (${fmt(24532)} – ${fmt(24540)}) is below the midnight open and the 6 PM open. Which trades fit?`, [opt('Longs from the level', true, 'Yes. Price is cheap down there: a good place to buy.'), opt('Shorts from the level', false, 'Shorts want price above the opening prices, where it’s expensive. This level is below them.'), opt('Opening prices don’t matter', false, 'They’re one of the most important confluences for bias. Don’t trade without them.')]) },
    { id: 'dl-plc', ch: 'dl', title: 'Step 2: find the PLC', body: '<p>On the 4H, a <b>Protected Low Catalyst (PLC)</b> is a swing low that formed inside a bullish FVG while price respected it. It’s a <b>draw</b>: price is expected to come back and take it.</p><p>About 90% of levels are built around a PLC or PHC.</p>', why: 'The idea is: price sweeps the catalyst, taps your level, forms a Protected Low, then delivers higher.', task: 'Two zones are marked A and B. For a long, your level sits BELOW the PLC. Tap the right one.', target: '#cv', enter() { RP.flags.plc = true; RP.flags.choose = true; }, tap(i, p) { if (p >= 24528 && p <= 24544) { RP.flags.choose = false; RP.flags.level = true; good('B: below the 4H PLC. Price has to sweep the PLC to reach it: that’s the fuel.'); onEvent('tap'); } else if (p >= 24556 && p <= 24574) bad(`A is above the PLC (${fmt(24552)}). Longs go <b>below</b> a PLC, so price sweeps the catalyst first. Tap B.`); else bad('Tap inside zone A or zone B.'); }, check: () => RP.flags.level },
    { id: 'dl-refine', ch: 'dl', title: 'Step 3: refine it', body: '<p>The level started as a 4H FVG under the PLC. Inside it there’s a 1H order block, and inside that a 15m breaker. Each step keeps the same idea and the same target, with less drawdown.</p>', visual: VIS.refine, quiz: q('Why refine the 4H level down to the 15m?', [opt('Smaller stop, same trade idea and target', true, 'Exactly. Refining is how 150 ticks of risk becomes 50 or less.'), opt('To find a different trade', false, 'The idea and the draw stay the same. Only the precision changes.'), opt('Lower timeframes are always more accurate', false, 'Not on their own: they only work inside the higher-timeframe context. Don’t go below 15 seconds while learning.')]), enter() { RP.flags.refined = true; } },
    { id: 'dl-play-lrl', ch: 'dl', title: 'Watch price come to you', body: '<p>Watch how price travels toward the level: slowly, making low after low. That’s <b>low-resistance liquidity (LRL)</b>. Then look for a <b>short-term low</b> forming just above the level.</p>', task: 'Press ▶ Play.', target: '#play', enter() { playTo(15); }, check: () => RP.shown >= 15, ok: 'LRL built and a short-term low formed just above the level.' },
    { id: 'dl-limit', ch: 'dl', title: 'Limit or confirmation?', body: '<p>A <b>limit order</b> at the level is only for when everything lines up: <b>LRL</b> into the level <b>and</b> a <b>short-term low</b> just before it (turtle soup), not near the open, news or high volatility. If either is missing, <b>wait for confirmation</b>: a reaction within ~50 ticks, then an IFVG or change of structure, a retrace, and entry at the first PD-array.</p>', quiz: q('LRL ✓, short-term low ✓, overnight with no news. Which entry?', [opt('Limit order at the level', true, 'Yes. Both conditions are met, so the level can be limited.'), opt('Always wait for confirmation', false, 'Confirmation is the default, but when LRL and a short-term low are both there, a limit is allowed.'), opt('Limit every level, every time', false, 'That’s the #1 mistake new students make. Limits need both conditions. The difference is only ~8–10 points anyway.')]) },
    Object.assign({}, common.trade, { title: 'Place the level', body: `<p>Limit at the level. Stop <b>50 ticks</b> away (12.5 points): past that, the level is invalid. First target: the <b>Asia high</b>, session liquidity above.</p><p class="k">stop: 50 ticks → ${fmt(sig.stop)}<br>target: ${fmt(sig.target)} − ${fmt(sig.entry)} = ${fmt(sig.target - sig.entry)} pts × 4 = ${Math.round((sig.target - sig.entry) / TICK)} ticks</p><p>Risk on 1 MNQ: <b>${usd((sig.entry - sig.stop) * PT)}</b>. Reward: <b>${usd((sig.target - sig.entry) * PT)}</b>.</p>`, why: 'Small stop, big target. That’s why this model can be patient: one level can pay for a whole week.' }),
    { id: 'dl-fill', ch: 'dl', title: 'Turtle soup into the level', body: '<p>Watch for price to run the short-term low and tag the level. That sweep and rejection is the turtle soup.</p>', task: 'Press ▶ Play.', target: '#play', enter() { playTo(17); }, check: () => RP.shown >= 17 && !!S.pos, ok: 'Filled on the turtle soup, and 1:1 already reached.', react(ev) { if (ev === 'cancel') { bad('You cancelled the order. Place it again.'); goTo('dl-trade'); } } },
    { id: 'dl-be', ch: 'dl', title: 'Breakeven at 1:1', body: '<p>Price has moved <b>50 ticks</b> your way (1:1). Rule: move the stop to <b>breakeven</b> so this trade can’t lose.</p>', why: 'After breakeven, trail only behind structure and PD-arrays: places price shouldn’t come back to if the idea is still right. Never so tight you get choked out of the big move.', task: 'Drag the red stop line up to your entry, or press <b>Move to entry</b> in the Orders tab.', target: '#cv', dragTouch: true, enter() { S.slMovedAway = false; S.tab = 'ord'; renderAcct(); playTo(RP.shown); }, check: () => !!S.pos && S.pos.sl != null && S.pos.sl >= S.pos.entry, ok: 'Stop at breakeven. Worst case now: $0.', playBlock: 'Move your stop to breakeven first.', react(ev) { if (ev === 'drag' && S.slMovedAway) { bad('That moved the stop further away. Only ever move it toward profit.'); S.slMovedAway = false; } } },
    { id: 'dl-result', ch: 'dl', title: 'Let it deliver', body: '<p>Hands off. The low you bought is now a <b>Protected Low</b>: price shouldn’t trade back through it while the idea is valid.</p>', task: 'Press ▶ Play.', target: '#play', enter() { RP.flags.closedN = S.history.length; playTo(35); }, check: () => S.history.length > (RP.flags.closedN || 0), ok: () => `Target hit: <b>${usd(S.lastClose ? S.lastClose.pnl : 0)}</b> on 1 MNQ from a ${usd((sig.entry - sig.stop) * PT)} risk.` },
    { id: 'dl-rs', ch: 'dl', title: 'Range Settlement at 9:30', body: '<p><b>Range Settlement (RS)</b> forms every weekday at <b>9:30</b>. Futures trade overnight but the index doesn’t, so orders get left behind. At the open they get filled, and price is drawn toward that level.</p>', why: 'RS is the main draw for the AM session. It only applies after 9:30, never overnight.', task: 'Press ▶ Play through the open.', target: '#play', enter() { playTo(43); }, check: () => RP.shown >= 41, ok: 'RS filled.', auto: false },
    { id: 'dl-rs-q', ch: 'dl', title: 'Which way does RS pull?', body: `<p>At 9:30, price opened below RS (${fmt(24648)}).</p>`, quiz: q('Price opens BELOW Range Settlement. What does that favour?', [opt('Longs: unfilled orders sit above', true, 'Right. Below RS → longs. Above RS → shorts.'), opt('Shorts', false, 'Shorts are favoured when price opens above RS. Here it opened below.'), opt('Nothing: RS is only for overnight', false, 'The opposite: RS only applies after the 9:30 open.')]) },
    { id: 'dl-patience', ch: 'dl', title: 'The hardest part', body: '<p>Price is sitting in the middle of the range, between the previous day high and low, with no level in sight.</p>', quiz: q('What do you do?', [opt('Nothing. Not trading is a position', true, 'Yes. Patience is what lets the win rate and the reward actually pay out.'), opt('Take a small trade to stay active', false, 'Mid-range trades with no level are exactly where losses pile up. Wait for the level.'), opt('Limit the nearest PD-array', false, 'No level, no bias, no trade. The model is 3–5 setups a week, not a day.')]) },
    { id: 'dl-recap', ch: 'dl', title: 'Extended Learning checklist', body: '<ul style="margin:0;padding-left:18px;display:grid;gap:4px"><li>Start at 6 PM. Opening prices: below → longs, above → shorts.</li><li>4H first: PLC/PHC. Level below a PLC (longs) or above a PHC (shorts). If it’s already protected (PL/PH), trade its rejection block instead.</li><li>Refine: 4H PD-array → 1H → 15m/5m (→ 1m) to cut the drawdown.</li><li>3+ confluences, not counting opening prices.</li><li>Limit only with LRL <b>and</b> a short-term low (turtle soup). Otherwise confirmation: reaction within ~50 ticks → IFVG or COS → retrace → first PD-array.</li><li>Stop 50 ticks (or the reacting leg’s high/low). Breakeven at 1:1. Trail behind structure.</li><li>Targets: PDH/PDL, session highs/lows, RS (after 9:30, if realistic). Take profit at a PHC/PLC that sits before your target.</li><li>Skip all-time highs and mid-range. Lock your daily loss limit, and lock the lockout.</li></ul>', info: true },

  if (id === 'hl') return [
    { id: 'hl-intro', ch: 'hl', title: 'H/L: how it thinks', body: '<p class="k">H/L runs on both NYFLOW and ASIAFLOW. Times: New York range 7:00–9:25, A+ window 9:30–10:00 · Asia 8:00 PM–12:00 AM. This replay is a New York morning.</p><p>The whole model in one sentence: <b>mark the pre-market high and low, wait for price to sweep one side, then take the reversal back toward the other side.</b></p><p>You’ll replay a morning one candle at a time. The <b>model brain</b> under the chart says what the model sees as each candle closes.</p>', visual: VIS.sweep, why: 'Members who understand why the label fires don’t take bad ones. The label is the end of a checklist, not the start.', task: 'Press Next to load the session.', info: true, enter() { if (!RP.m || RP.m.id !== 'hl' || S.mode !== 'replay') loadReplay('hl'); } },
    { id: 'hl-range', ch: 'hl', title: 'Step 1: mark the range', body: '<p>From <b>7:00 to 9:25 AM ET</b> the model tracks the highest high and the lowest low. Every new extreme moves a line. At 9:25 the range locks.</p>', why: 'Stops pile up just above the range high and just below the range low. Those two lines are where the fuel is.', task: 'Press ▶ Play (bottom left of the chart) and watch the lines move.', target: '#play', enter() { playTo(29); }, check: () => RP.shown >= 29, ok: 'Range locked: high 24,642.25, low 24,561.50.' },
    { id: 'hl-tap-high', ch: 'hl', title: 'Find the range high', body: '<p>The range high is the <b>highest wick</b> inside the shaded 7:00–9:25 window, not the highest close.</p>', why: 'Wicks are where the orders actually traded. That’s where the stops sit.', task: 'Tap the candle that made the range high.', target: '#cv', tap(i, p) { if (nearCandle(m.highI, i, p, m.RH)) { RP.flags.tapHigh = true; good('That 8:00 candle wicked to 24,642.25, the top of the range.'); onEvent('tap'); } else if (i >= 0 && i <= 29) bad(`That candle’s high is ${fmt(m.candles[i].h)}. Look for the one whose wick touches the top line (24,642.25).`); else bad('Stay inside the shaded range window (7:00–9:25).'); }, check: () => RP.flags.tapHigh },
    { id: 'hl-bias', ch: 'hl', title: 'Step 2: wait for a sweep', body: '<p>From 9:30 the model waits for price to trade <b>through</b> one side. That run through the level is the <b>sweep</b>: it grabs the stops parked there.</p><p>No sweep by the end of the window = no trade that session.</p>', why: 'A sweep traps traders on the wrong side. Their exits fuel the move back the other way.', quiz: q('If price sweeps the range LOW first, which way does the model look to trade?', [opt('Long, back up toward the range high', true, 'Right. Low swept → look for longs → target the range high.'), opt('Short. It broke down, so keep selling', false, 'That’s the trap. Breaking the low is the sweep, not the move. The model looks for the reversal back up.'), opt('No trade. The range is broken', false, 'The range being taken is the trigger, not a reason to stop. No trade only happens if neither side gets swept.')]) },
    { id: 'hl-play-sweep', ch: 'hl', title: 'Watch for the sweep', body: '<p>9:30 is the NY open. Setups in the first 30 minutes of the window grade <b>A+</b> (the orange shaded area).</p>', task: 'Press ▶ Play.', target: '#play', enter() { playTo(32); }, check: () => RP.shown >= 32, ok: 'Low swept at 9:40. The model’s bias is now LONG.' },
    { id: 'hl-tap-sweep', ch: 'hl', title: 'Tap the sweep', body: '<p>A sweep candle trades <b>below</b> the range low, often with a long wick.</p>', task: 'Tap the candle that swept the range low.', target: '#cv', tap(i, p) { if (nearCandle(m.sweepI, i, p, 24549.25)) { RP.flags.tapSweep = true; good('9:40 traded down to 24,549.25, under the 24,561.50 range low. That’s the sweep.'); onEvent('tap'); } else if (i === 31) bad('Close. 9:35 got near the low (24,565.00) but didn’t trade through 24,561.50. The next one did.'); else bad(`That candle’s low is ${fmt((m.candles[i] || {}).l || 0)}. Find the one that goes under the range low line.`); }, check: () => RP.flags.tapSweep },
    { id: 'hl-gap', ch: 'hl', title: 'Step 3: find the gap', body: '<p>Fast moves leave a <b>fair value gap</b> (FVG): 3 candles where candle 1’s low and candle 3’s high don’t overlap. The empty space between them is the gap. The numbered candles on the chart are 1, 2 and 3.</p>', visual: VIS.fvg, why: 'The gap shows where sellers were aggressive. If buyers take it back, those sellers are trapped.', task: 'Tap inside the gap: between candle 1’s low and candle 3’s high.', target: '#cv', enter() { RP.flags.numbers = true; }, tap(i, p) { const g = m.gap; if (i >= 30 && i <= 34 && p >= g.lo - 1 && p <= g.hi + 1) { RP.flags.gap = true; RP.flags.numbers = false; good(`Gap: ${fmt(g.lo)} – ${fmt(g.hi)}. Candle 1 low 24,576.00, candle 3 high 24,568.00.`); onEvent('tap'); } else if (i >= 30 && i <= 34) bad(p > g.hi ? `Too high. The gap runs from ${fmt(g.lo)} up to ${fmt(g.hi)} (candle 1’s low).` : `Too low. The gap starts at ${fmt(g.lo)} (candle 3’s high).`); else bad('Tap near candles 1, 2 and 3 (9:30 – 9:40).'); }, check: () => RP.flags.gap },
    { id: 'hl-flip-q', ch: 'hl', title: 'Step 4: wait for the flip', body: '<p>Sellers made that gap. If buyers close a candle back <b>above the top</b> of it, the gap has <b>inverted</b> (iFVG): old resistance becomes support.</p>', visual: VIS.flip, quiz: q('Which of these turns the gap into an iFVG?', [opt(`A candle CLOSE above ${fmt(24576)}, the top of the gap`, true, 'Yes. The close is what counts.'), opt('A wick poking into the gap', false, 'A wick inside isn’t enough. The model waits for a candle to close above the top.'), opt('A close below the sweep low', false, 'That would mean sellers are still in control. No flip, no trade.')]) },
    { id: 'hl-play-flip', ch: 'hl', title: 'Watch it flip', body: '<p>Watch candle 9:45 (back into the gap, closes inside: not yet) and then 9:50.</p>', task: 'Press ▶ Play until the model fires.', target: '#play', enter() { playTo(34); }, check: () => RP.shown >= 34, ok: 'FIRE: H/L LONG at 9:50, inside the A+ window.' },
    { id: 'hl-signal', ch: 'hl', title: 'Read the signal', body: `<p>NYFLOW prints the label with <b>entry</b> ${fmt(sig.entry)} (the close that flipped the gap), <b>stop</b> ${fmt(sig.stop)} (just past the swept low) and <b>target</b> ${fmt(sig.target)} (the other side of the range).</p>`, quiz: q('Why is the stop just under the swept low?', [opt('If price goes back under the sweep, the idea is wrong', true, 'Exactly. The trade idea is “the low was a trap”. Back below it, the trap wasn’t real.'), opt('It’s a round number', false, 'Stops go where the idea is proven wrong, not at round numbers.'), opt('To give the trade more room to make money', false, 'The stop doesn’t make money. It limits the loss when the idea is wrong.')]) },
    common.trade, common.result,
    { id: 'hl-recap', ch: 'hl', title: 'H/L checklist', body: '<ul style="margin:0;padding-left:18px;display:grid;gap:4px"><li>Range = highest high and lowest low, 7:00–9:25 ET.</li><li>Wait for a sweep of one side. Low swept → longs. High swept → shorts.</li><li>Entry: a gap that flips (iFVG), or a structure break that leaves a gap.</li><li>Stop at the swept extreme. Target the other side of the range.</li><li>First 30 minutes after 9:30 = A+.</li><li>No sweep by the end of the window = no trade. That’s a win for discipline.</li><li>Skip big news days (e.g. the day before NFP). Take partials; don’t squeeze the last point.</li></ul>', info: true },
  ];
  if (id === 'po3') return [
    { id: 'po3-intro', ch: 'po3', title: 'PO3: how it thinks', body: '<p class="k">PO3 runs on both NYFLOW and ASIAFLOW. This lesson plays it at its New York time (the 10:00 candle), then at its Asia time (the 8 PM candle).</p><p><b>Power of Three</b>: price moves in three phases. <b>Accumulation</b> (sideways chop), <b>Manipulation</b> (a fake move that sweeps stops), <b>Distribution</b> (the real move).</p><p>The model waits for the fake move <b>against</b> the trend, then trades the real move <b>with</b> it.</p>', visual: VIS.amd, why: 'It’s fractal: the same three phases show up on the 1m, the 5m and the 4H. Learn to see them once and you’ll see them everywhere.', task: 'Press Next to load the session.', info: true, enter() { if (!RP.m || RP.m.id !== 'po3' || S.mode !== 'replay') loadReplay('po3'); } },
    { id: 'po3-trend', ch: 'po3', title: 'First: the trend', body: '<p>The #1 rule: trade with the higher-timeframe trend. The 4H chart in the brain panel is making higher highs and respecting bullish gaps.</p>', quiz: q('The 4H trend is up. Which trades does the model look for?', [opt('Longs only', true, 'Right. Manipulation down, distribution up, with the trend.'), opt('Shorts', false, 'That fights the trend. The best PO3 trades go with it.'), opt('Both equally', false, 'A counter-trend scalp can exist, but it’s the lower-quality trade. The model sticks with the trend.')]), target: '#widget' },
    { id: 'po3-acc', ch: 'po3', title: 'Phase 1: accumulation', body: '<p>Watch price chop sideways before 10:00.</p>', why: 'This is where most beginners lose money: it always looks like it’s about to break out.', task: 'Press ▶ Play.', target: '#play', enter() { playTo(11); }, check: () => RP.shown >= 11, ok: 'Accumulation range: 24,612.00 – 24,633.25.' },
    { id: 'po3-acc-q', ch: 'po3', title: 'What do you do here?', body: '<p>Price is going back and forth inside the grey box.</p>', quiz: q('Price is chopping sideways in a range. What do you do?', [opt('Nothing. Accumulation is a no-trade zone', true, 'Yes. No edge yet, only chop.'), opt('Buy the next breakout', false, 'Breakouts from the range are exactly what the manipulation phase traps.'), opt('Sell the top of the range', false, 'Fading the range edges in accumulation gets you chopped up. Wait.')]) },
    { id: 'po3-draw', ch: 'po3', title: 'Find the draw', body: '<p>Price is drawn to <b>liquidity</b>: stops resting above old highs and below old lows. Two highs at the same price (<b>equal highs</b>) are an obvious pool.</p>', why: 'The draw is your target. No obvious draw, no reason for price to go anywhere.', task: 'Tap one of the two candles that made equal highs (early, around 9:00 – 9:10).', target: '#cv', tap(i, p) { if (nearCandle(0, i, p, m.EQH) || nearCandle(2, i, p, m.EQH)) { RP.flags.eqh = true; good('Both 9:00 and 9:10 topped at exactly 24,650.00. Equal highs = the draw.'); onEvent('tap'); } else bad(`That high is ${fmt((m.candles[i] || {}).h || 0)}. Look for two highs at the same price, before the grey box.`); }, check: () => RP.flags.eqh },
    { id: 'po3-open', ch: 'po3', title: '10:00: the key open', body: '<p>The model marks the <b>10:00 ET open</b>. For a long you want that candle to go <b>Open → Low → High → Close</b>: dip first (manipulation), then close higher (distribution). The brain panel draws it as it builds.</p>', quiz: q('For a long, what should the 10:00 candle do first?', [opt('Dip below its open', true, 'Yes. The dip is the manipulation that traps sellers.'), opt('Shoot straight up', false, 'Straight up means no manipulation: nothing trapped to fuel the move. The model wants the dip first.'), opt('Stay flat', false, 'Flat is still accumulation. The model is waiting for the fake move.')]) },
    { id: 'po3-manip', ch: 'po3', title: 'Phase 2: manipulation', body: '<p>Watch the 10:00 candle build in the brain panel.</p>', task: 'Press ▶ Play.', target: '#play', enter() { playTo(14); }, check: () => RP.shown >= 14, ok: 'Range low swept and a gap left on the way down.' },
    { id: 'po3-trap', ch: 'po3', title: 'Trap or real move?', body: '<p>Price just broke below the accumulation range.</p>', quiz: q('The 4H trend is up. What is this break down?', [opt('Manipulation: a trap before the move up', true, 'Right. Breaking the range against the trend is the trap. Early sellers just got pulled in.'), opt('The real move down. Sell it', false, 'This is the #1 PO3 mistake: treating the manipulation as confirmation. Check it against the trend.'), opt('A signal to close everything and stop', false, 'Nothing to close: you’re flat. This is the phase the model was waiting for.')]) },
    { id: 'po3-conf', ch: 'po3', title: 'Phase 3: confirmation', body: '<p>Same trigger as H/L: the gap left by the drop needs a candle to <b>close back above</b> it.</p>', visual: VIS.flip, task: 'Press ▶ Play until the model fires.', target: '#play', enter() { playTo(16); }, check: () => RP.shown >= 16, ok: 'FIRE: PO3 LONG. Manipulation over, distribution starting.' },
    { id: 'po3-stop', ch: 'po3', title: 'Where does the stop go?', body: `<p>Entry ${fmt(sig.entry)}. Target: the equal highs at ${fmt(sig.target)}.</p>`, quiz: q('Where does the stop go?', [opt(`Just below the manipulation low (${fmt(sig.stop)})`, true, 'Yes. If price goes back under the manipulation low, the trap story is wrong.'), opt('Just below the 10:00 open', false, 'Too tight: the manipulation already went well below the open. Normal noise would stop you out.'), opt('No stop needed on a trend trade', false, 'Every trade has a stop. Trends fail too.')]) },
    common.trade, common.result,
    { id: 'po3-recap', ch: 'po3', title: 'PO3 checklist', body: '<ul style="margin:0;padding-left:18px;display:grid;gap:4px"><li>Check the 4H trend first. Trade with it.</li><li>Accumulation = no trades.</li><li>Manipulation = the fake move against the trend that sweeps stops. Not confirmation.</li><li>Distribution = the real move. Enter on a gap that flips in the trend direction.</li><li>Confluence: gap with a swing inside it, gap not closed through, key time (9:30 / 10:00), equal highs/lows as the draw, order block respected.</li><li>Always ask: is this break the real move, or the trap?</li></ul>', info: true },
  ];
  return [
    { id: 'asia-intro', ch: 'asia', title: 'PO3 at the Asia time', body: '<p>Asia runs <b>8:00 PM – 12:00 AM ET</b>. It isn’t clean every day, so the model starts with <b>two filters</b> before it looks for any entry.</p>', visual: VIS.filters, why: 'Most Asia losses come from trading it on the wrong days. The filters decide whether you trade at all.', task: 'Press Next to load the session.', info: true, enter() { if (!RP.m || RP.m.id !== 'asia' || S.mode !== 'replay') loadReplay('asia'); } },
    { id: 'asia-f1', ch: 'asia', title: 'Filter 1: what did NY do?', body: '<p>Sessions take turns. The card in the brain panel says what New York did today.</p>', target: '#widget', quiz: q('NY chopped and took no big highs or lows. What should you expect from Asia?', [opt('Asia is likely the clean session. Look for trades', true, 'Right. NY accumulated, so Asia is next in line to manipulate and deliver.'), opt('Asia will chop. Skip it', false, 'That’s the rule for days when NY already made a big move (500+ points). Today NY chopped.'), opt('It doesn’t matter what NY did', false, 'It matters a lot. It’s the first filter.')]) },
    { id: 'asia-f2', ch: 'asia', title: 'Filter 2: are gaps respected?', body: '<p>On the 5m you want fair value gaps <b>forming</b> and price <b>reacting</b> off them, not slicing back and forth through them (“barcode” chop).</p>', task: 'Press ▶ Play and watch the second gap.', target: '#play', enter() { playTo(22); }, check: () => RP.shown >= 22 },
    { id: 'asia-f2-q', ch: 'asia', title: 'Did the gap hold?', body: '<p>Look at the gap tagged on the chart around 6:40 PM.</p>', quiz: q('Was that gap respected?', [opt('Yes. Price dipped in and bounced, so both filters pass', true, 'Yes. Gaps forming and holding = real direction. Both filters pass: trade Asia.'), opt('No. It’s barcode chop', false, 'Barcode chop is price slicing through gaps both ways. Here price dipped in, held, and bounced.')]) },
    { id: 'asia-key', ch: 'asia', title: 'The draw + your key level', body: '<p><b>Step 1:</b> the draw. The purple band at the top is the <b>new week opening gap</b>, the highest-priority target in this model. We want longs toward it.</p><p><b>Step 2:</b> a key level that lines up with that: somewhere price can dip into before going up.</p>', why: 'The key level is your landing spot. Without one, there’s nowhere to wait for the manipulation.', task: 'Two zones are marked A and B. Tap the key level you’d buy from.', target: '#cv', enter() { RP.flags.choose = true; }, tap(i, p) { if (p >= 24582 && p <= 24594) { RP.flags.choose = false; RP.flags.key = true; good('A: the bullish gap from the 6 PM open, below price and in line with the draw above.'); onEvent('tap'); } else if (p >= 24613 && p <= 24623) bad('B is above price. For a long toward the draw, you want to buy lower, from a bullish gap below: that’s A.'); else bad('Tap inside zone A or zone B.'); }, check: () => RP.flags.key },
    { id: 'asia-8pm', ch: 'asia', title: 'Step 3: the 8 PM candle', body: '<p>For a long you want the 8 PM candle to go <b>Open → Low → High → Close</b> (OLHC): dip into your key level first, then drive up. The brain panel builds the hour candle live.</p>', task: 'Press ▶ Play.', target: '#play', enter() { playTo(26); }, check: () => RP.shown >= 26, ok: 'Price is inside the key level. Manipulation leg in progress.' },
    { id: 'asia-wait', ch: 'asia', title: 'In the level. Buy now?', body: '<p>Price has reached your key level at 24,584 – 24,592.</p>', quiz: q('Price is inside your key level. Enter now?', [opt('Not yet. Wait for a close through the gap (IFG)', true, 'Right. Touching the level is step 3. Step 4 is confirmation.'), opt('Yes. It touched the level', false, 'Touching the level isn’t confirmation. Levels break. The model waits for the IFG close.')]) },
    { id: 'asia-ifg', ch: 'asia', title: 'Step 4: IFG confirmation', body: '<p>The drop into the level left a small bearish gap. A close back <b>through</b> it is the green light.</p>', visual: VIS.flip, task: 'Press ▶ Play until the model fires.', target: '#play', enter() { playTo(27); }, check: () => RP.shown >= 27, ok: 'FIRE: ASIA PO3 LONG.' },
    { id: 'asia-target', ch: 'asia', title: 'Pick the target', body: '<p>Stop goes at the swing low. Asia rules: <b>default 1:1</b>, <b>max 1:3</b>.</p>', quiz: q('What’s the default target here?', [opt(`1:1: the same distance as the stop (${fmt(sig.target)})`, true, 'Yes. 1:1 by default. Up to 1:3 when everything lines up.'), opt('The full opening gap, every time', false, 'That’s over 1:3 here. The model caps a single trade at 1:3 and defaults to 1:1.'), opt('No target. Let it run', false, 'Every trade has a plan to get paid. Default 1:1.')]) },
    common.trade, common.result,
    { id: 'asia-recap', ch: 'asia', title: 'Asia checklist', body: '<ul style="margin:0;padding-left:18px;display:grid;gap:4px"><li>Filter 1: NY chopped → trade Asia. NY expanded hard → skip.</li><li>Filter 2: 5m/15m gaps forming and respected, not barcode chop.</li><li>Draw on the 4H/daily (opening gaps are king), then a key level lined up with it.</li><li>Wait for manipulation into the level. Enter on an IFG close.</li><li>8 PM candle: OLHC for longs, OHLC for shorts.</li><li>Risk 1% a trade. Stop at the swing. Default 1:1, max 1:3.</li><li><b>One win = done. Two losses = done.</b></li></ul>', info: true },
  ];
}

const STEPS = [
  // Chapter 1 — chart
  { id: 'welcome', ch: 'chart', title: 'Your first trade, start to finish', body: '<p>This screen is laid out like <b>TradingView</b>, the charting app you’ll trade from. Everything here is practice: fake money and sped-up prices.</p><p>Each step tells you <b>what</b> to do and <b>why</b>, then checks your work. Get something wrong and it tells you why, so try things.</p>', why: 'The buttons are the easy part. Knowing why you press them is what keeps an account alive.', task: 'Press Start.', info: true, nextLabel: 'Start' },
  { id: 'symbol', ch: 'chart', title: 'Find MNQ', body: '<p>The chart is showing <b>SPY</b>, a stock fund. We trade Nasdaq futures. First job every session: make sure you’re on the right market.</p>', why: 'Wrong symbol = wrong prices, wrong levels, wrong everything. It happens more than you’d think.', task: 'Tap <b>SPY</b> at the top left, type <b>MNQ</b>, and pick <b>MNQ1!</b>.', target: '#sym-btn', check: () => S.sym === 'MNQ1!', ok: 'MNQ1! is the Micro E-mini Nasdaq-100. The “1!” means “always the current contract”, so your chart never goes stale when contracts roll over.', react(ev, a) { if (ev === 'sym' && a === 'NQ1!') bad('That’s NQ, the full-size contract: same chart, 10× the money per point. Beginners start on the micro. Pick <b>MNQ1!</b>.'); else if (ev === 'sym' && /ES/.test(a)) bad('That’s the S&amp;P 500. We trade the Nasdaq: <b>MNQ1!</b>.'); else if (ev === 'sym' && a !== 'MNQ1!') bad('Not that one. Search <b>MNQ</b> and pick MNQ1!.'); } },
  { id: 'ticks', ch: 'chart', title: 'What one move is worth', body: '<p>Futures move in <b>ticks</b>. On MNQ one tick is <b>0.25 points</b>, worth <b>$0.50</b> per contract. Four ticks make a point, so one point is <b>$2</b>.</p><p>NQ is the same chart at 10×: $5 a tick, $20 a point.</p>', visual: VIS.ticks, quiz: q('You’re long 1 MNQ and price rises 10 points. What did you make?', [opt('$2', false, 'That’s one point. 10 points × $2 = $20.'), opt('$20', true, 'Yes: 10 points × $2 = $20. On NQ the same move is $200.'), opt('$200', false, '$200 is NQ money (10 × $20). On MNQ it’s 10 × $2 = $20.')]) },
  { id: 'candle', ch: 'chart', title: 'Read a candle', body: '<p>Each candle is one slice of time. <b>Green</b>: price closed higher than it opened. <b>Red</b>: closed lower. The thick <b>body</b> runs open to close; the thin <b>wicks</b> show the highest and lowest prices reached.</p>', visual: VIS.candle, why: 'Every model you’ll learn reads highs, lows and closes. A wick through a level and a close through a level mean different things.', task: 'Tap any candle. Its Open, High, Low and Close appear at the top left of the chart.', target: '#cv', check: () => S.inspected && S.sym === 'MNQ1!', ok: 'Those four numbers (O H L C) are the whole story of that candle.', react(ev) { if (ev === 'inspect' && S.sym !== 'MNQ1!') bad('Switch back to MNQ1! first.'); } },
  { id: 'tf', ch: 'chart', title: 'Pick your timeframe', body: '<p>The <b>timeframe</b> sets how much time each candle covers. 1-minute candles show every twitch; 5-minute candles show cleaner structure. Our models read the 1m and 5m for entries and the 4H for direction.</p>', why: 'The same move can look like chaos on the 1m and a clean setup on the 5m.', task: 'Switch to <b>5m</b> in the top bar.', target: '#tfs', check: () => S.tf === '5m', ok: 'Each candle is now 5 minutes.', react(ev, a) { if (ev === 'tf' && a !== '5m') bad(a === '1m' ? 'That’s 1-minute. Pick <b>5m</b>.' : 'That’s a higher timeframe: good for the big picture. For this lesson pick <b>5m</b>.'); } },
  { id: 'zoom', ch: 'chart', title: 'See more history', body: '<p>Levels come from what price did earlier, so you’ll zoom out to see the last few hours.</p>', task: 'Tap <b>−</b> at the bottom left of the chart (or scroll with a mouse) to zoom out.', target: '#zoom', check: () => S.zoomedOut, ok: 'More candles, more context. ⇥ jumps back to the latest candle.' },
  { id: 'level', ch: 'chart', title: 'Mark a level', body: '<p>A <b>level</b> is a price where you expect a reaction, like the range highs and lows our indicators mark. Mark one <b>support</b> level below price: somewhere you’d like to buy from.</p>', why: 'Deciding where you’d buy <b>before</b> price gets there is the difference between a plan and a chase.', task: 'Pick the <b>horizontal line</b> tool on the left, then tap the chart a little below the current price.', target: '#tool-hline', dragTouch: true, check: () => S.level != null && S.level < lastLive() - 1 && lastLive() - S.level <= 60, ok: () => `Level marked at <span class="num">${fmt(S.level)}</span>.`, react(ev, a) { if (ev === 'tool' && a === 'hline') toast('good', 'Tool ready', 'Now tap the chart a little below the current price.'); if (ev === 'level') { if (S.level >= lastLive()) bad('That’s above the current price. Support is below price, where buyers step in. Pick the tool and try lower.'); else if (lastLive() - S.level > 60) bad('That’s a long way down for practice. Try within about 60 points under price.'); else if (lastLive() - S.level <= 1) bad('That’s right on top of price. Go a little lower.'); } } },
  // Chapter 2 — connect
  { id: 'trade', ch: 'connect', title: 'Open the Trade panel', body: '<p>Charts alone can’t place orders. The <b>Trade</b> button connects TradingView to a broker so the Buy and Sell buttons do something.</p>', task: 'Tap <b>Trade</b> at the top right.', target: '#trade-btn', check: () => !$('#broker').hidden || S.connected },
  { id: 'broker', ch: 'connect', title: 'Choose Paper Trading', body: '<p>For your prop account you’ll pick the broker your firm’s setup guide names. Many Tradovate-based firms show up as <b>NinjaTrader</b>: choose <b>Demo</b> (yes, even for funded accounts) and log in with the username and password your firm gave you.</p><p>Today you’re practising, so use <b>Paper Trading</b>: fake money, real buttons.</p>', why: 'Practise the clicks on paper until they’re boring. Fumbling buttons on a live account costs real money.', task: 'Choose <b>Paper Trading</b>.', target: '#b-paper', enter() { if (!S.connected) $('#broker').hidden = false; }, check: () => S.connected, ok: 'Connected. The order ticket opened on the right.' },
  { id: 'acct', ch: 'connect', title: 'Check the account. Every time.', body: '<p>The top of the order ticket shows which account you’re trading on.</p>', why: 'A classic costly mistake: trading your eval when you meant to practise, or the other way round. Glance here before every single click.', task: 'Find the account name at the top of the ticket, then press Next.', target: '#tk-acct', info: true, enter() { S.ticketOpen = true; renderTicket(); } },
  // Chapter 3 — order
