  { id: 'type', ch: 'order', title: 'Market, limit or stop?', body: '<p><b>Market</b> fills right now at whatever price is there. <b>Limit</b> waits for your price or better (a buy limit sits below price). <b>Stop</b> waits for price to break through (a buy stop sits above price).</p>', visual: VIS.orderTypes, task: 'You want to buy when price dips to your level. Choose <b>Limit</b>.', target: '#tk-type', enter() { S.ticketOpen = true; renderTicket(); }, check: () => T.type === 'limit', ok: 'Limit it is. The order will wait at your price.', react(ev) { if (ev === 'ticket:type' && T.type === 'market') bad('Market buys right now, above your level: you’d pay more and your stop and target would be off. Choose <b>Limit</b>.'); if (ev === 'ticket:type' && T.type === 'stop') bad('A buy stop sits above price and triggers on a breakout. You want price to come down to you: <b>Limit</b>.'); } },
  { id: 'price', ch: 'order', title: 'Set your price', body: '<p>A limit order only fills at your price or better. Put it on the level you marked.</p>', task: 'Tap <b>Use my level</b>, or type your level’s price.', target: '#tk-price', enter() { S.ticketOpen = true; if (T.type !== 'limit') T.type = 'limit'; renderTicket(); }, check: () => T.price != null && S.level != null && Math.abs(T.price - S.level) < 0.01 && T.price < lastLive(), ok: () => `Limit set at <span class="num">${fmt(T.price)}</span>, your level.`, react(ev) { if (ev === 'ticket:price' && T.price != null && S.level != null && Math.abs(T.price - S.level) >= 0.01) bad(T.price >= lastLive() ? `A buy limit at or above the current price (${fmt(lastLive())}) fills straight away. Use your level: <b class="num">${fmt(S.level)}</b>.` : `That would work as a buy limit, but for this lesson use your level: <b class="num">${fmt(S.level)}</b>.`); } },
  { id: 'qty', ch: 'order', title: 'Size: 1 contract', body: '<p>Size decides what each point is worth to you. 1 MNQ = $2 a point. 5 MNQ = $10 a point. Your FLOWHUB plan sets the size for each account.</p>', why: 'Size is the fastest way to blow an account. Start at 1 until the process is automatic.', task: 'Make sure quantity is <b>1</b>.', target: '#tk-qty', enter() { S.ticketOpen = true; renderTicket(); }, check: () => T.qty === 1, ok: '1 contract. $2 a point.', react(ev) { if (ev === 'ticket:qty' && T.qty > 1) bad(`${T.qty} MNQ = ${usd(T.qty * PT)} a point. Bring it back to <b>1</b> while you learn.`); } },
  { id: 'sl', ch: 'order', title: 'Add a stop loss', body: '<p>A <b>stop loss</b> gets you out automatically if price goes against you. It caps what one trade can cost. You set it in <b>ticks</b> from your entry (or as a price).</p>', visual: VIS.bracket, why: 'Never enter without one. One trade with no stop can undo a month of good ones.', task: 'Tick <b>Stop loss</b> and set <b>60</b> ticks: the FLOWMTD standard <b>15-point</b> stop.', target: '#tk-sl', enter() { S.ticketOpen = true; renderTicket(); }, check: () => T.slOn && T.price != null && slPrice() != null && T.price - slPrice() >= 4 && T.price - slPrice() <= 50, ok: () => `${Math.round((T.price - slPrice()) / TICK)} ticks = ${fmt(T.price - slPrice())} points × $2 = <b>${usd((T.price - slPrice()) * PT)}</b> at risk. Know that number before you click.`, react(ev) { if (ev === 'ticket:sl' && T.slOn && slPrice() != null) { const d = T.price - slPrice(); if (d < 4) bad('That’s very tight: normal wiggles would stop you out. Try <b>40</b> ticks.'); else if (d > 50) bad('That’s a very wide stop for practice. Try <b>40</b> ticks.'); } } },
  { id: 'tp', ch: 'order', title: 'Add a take profit', body: '<p>A <b>take profit</b> closes the trade at your target. The FLOWMTD standard is a <b>15-point stop</b> and a <b>40-point target</b>: about 2.7 times what you risk (2.7R).</p>', why: 'With a 2.7R target you can be wrong on 7 trades out of 10 and still come out ahead.', task: 'Tick <b>Take profit</b> and set <b>160</b> ticks: the standard <b>40-point</b> target.', target: '#tk-tp', enter() { S.ticketOpen = true; renderTicket(); }, check: () => T.tpOn && tpPrice() != null && slPrice() != null && tpPrice() - T.price >= T.price - slPrice(), ok: () => `Target <span class="num">${fmt(tpPrice())}</span>: ${((tpPrice() - T.price) / (T.price - slPrice())).toFixed(1)}R.`, react(ev) { if (ev === 'ticket:tp' && T.tpOn && tpPrice() != null && slPrice() != null && tpPrice() - T.price < T.price - slPrice()) bad('Your target is smaller than your risk, so you’d need to win most trades just to break even. Make it at least as big as your stop.'); } },
  { id: 'place', ch: 'order', title: 'Place the order', body: '<p>Check left to right: <b>account</b> Paper Trading, <b>Buy</b>, <b>Limit</b> at your level, <b>1</b> contract, <b>stop</b> on, <b>target</b> on.</p>', why: 'This two-second check before every click is a habit worth building now.', task: 'Press the blue <b>Buy</b> button at the bottom of the ticket.', target: '#tk-submit', enter() { S.ticketOpen = true; renderTicket(); }, submit() {

    if (T.price >= lastLive()) return `A buy limit must sit below the current price (${fmt(lastLive())}).`;

  }, check: () => !!(S.order || S.pos), ok: 'Order placed. Now it waits for price.' },

  { id: 'wait', ch: 'manage', title: 'A working order', body: '<p>Your order is live but <b>not filled</b>. It’s the dashed line on the chart and a row in the <b>Orders</b> tab. It only fills if price trades down to it. (Practice prices move fast.)</p>', why: 'A limit order that never fills is fine. It means price didn’t come to your level, so there was no trade. Don’t chase it.', task: 'Watch the chart. Open the <b>Orders</b> tab below it while you wait.', target: '#tab-ord', check: () => !!S.pos, ok: 'Filled at your level.', react(ev) { if (ev === 'cancel') { bad('You cancelled it. That’s allowed in real trading, but for this lesson place it again.'); setTimeout(() => goTo('place'), 900); } } },
  { id: 'filled', ch: 'manage', title: 'You’re in', body: '<p>The solid line is your <b>position</b> with live P&amp;L. Your <b>stop</b> (red) and <b>target</b> (green) are now working together: when one fills, the other cancels automatically. That pairing is called <b>OCO</b> (one cancels the other).</p>', task: 'Find the position, stop and target lines, then press Next.', target: '#cv', info: true, react(ev) { if (ev === 'close') { bad('The trade closed before this step. Let’s set it up again.'); setTimeout(() => goTo('place'), 900); } } },
  { id: 'be', ch: 'manage', title: 'Move your stop to breakeven', body: '<p>Once price has moved well your way, you can drag the stop up to your entry. Worst case is now <b>$0</b>.</p>', why: 'Rule: only move a stop <b>toward</b> profit, never further away. Moving it away is how small losses become big ones.', task: 'Drag the red stop line up to your entry price (it snaps on), or press <b>Move to entry</b> in the Orders tab.', target: '#cv', dragTouch: true, enter() { S.slMovedAway = false; S.tab = 'ord'; renderAcct(); }, check: () => S.pos && S.pos.sl != null && S.pos.sl >= S.pos.entry, ok: 'Stop at breakeven. This trade can’t lose money now.', react(ev) { if (ev === 'drag' && S.slMovedAway) { bad('You moved the stop further away. That adds risk. Only ever move it toward profit.'); S.slMovedAway = false; } if (ev === 'close') { bad('The trade closed before this step. Let’s set it up again.'); setTimeout(() => goTo('place'), 900); } } },

// ── Coach engine ───────────────────────────────────────────
let cur = 0;
const done = new Set();
let FB = null, quizPick = {};
function curStep() { return STEPS[cur]; }
function setFeedback(kind, title, text) { FB = { kind, title, text, step: cur }; renderFb(); }
function renderFb() { const el = $('#fb'); if (!el) return; el.innerHTML = FB && FB.step === cur ? `<div class="fb ${FB.kind}"><b>${esc(FB.title)}</b>${FB.text}</div>` : ''; }
function chapterOf(i) { return CH.findIndex((c) => c.id === STEPS[i].ch); }
function goTo(idOrIdx) {
  const i = typeof idOrIdx === 'number' ? idOrIdx : STEPS.findIndex((s) => s.id === idOrIdx);
  if (i < 0) return;
  cur = i; FB = null; clearHl();
  const st = STEPS[cur];
  const isModel = CH[chapterOf(cur)].model;
  if (!isModel && S.mode === 'replay') exitReplay();
  if (st.enter) st.enter();
  if (isModel && S.mode === 'replay' && !st.playBlock && RP.stopAt < RP.shown) RP.stopAt = RP.shown;
  syncTools(); renderCard(); renderRail(); renderPlayer && renderPlayer(); dirty(); renderAcct();
  setTimeout(evaluate, 50);
}
function next() { if (cur < STEPS.length - 1) goTo(cur + 1); }
function evaluate() {
  const st = curStep();
  if (!st || done.has(st.id) || !st.check) return;
  let ok = false; try { ok = !!st.check(); } catch (e) { ok = false; }
  if (!ok) return;
  done.add(st.id);
  const msg = typeof st.ok === 'function' ? st.ok() : st.ok;
  if (msg) good(msg, 'Done');
  renderCard(); renderRail();
  if (st.auto !== false) { const here = cur; setTimeout(() => { if (cur === here) next(); }, msg ? 2200 : 900); }
}
function onEvent(ev, arg) {
  const st = curStep();
  if (ev === 'close' && S.mode === 'replay') RP.flags.closed = true;
  if (st && st.react) st.react(ev, arg);
  if (S.mode === 'replay' && ev !== 'candle') renderBrain();
  if (ev.startsWith('ticket') || ev === 'fill' || ev === 'close' || ev === 'placed' || ev === 'cancel' || ev === 'connected') { renderTicket(); renderAcct(); }
  evaluate();
  dirty();
}
function replayTap(i, p) { const st = curStep(); if (st && st.tap) st.tap(i, p); else if (i != null && i <= RP.shown) { S.pin = i; } }

function renderRail() {
  const chDone = (c) => STEPS.filter((s) => s.ch === c.id).every((s) => done.has(s.id) || (!s.check && !s.quiz && !s.custom && stepVisited(s)));
  $('#chapters').innerHTML = CH.map((c, i) => `<button type="button" class="chap ${c.model ? 'model' : ''} ${i === chapterOf(cur) ? 'now' : chDone(c) ? 'done' : ''}" data-ch="${c.id}"><span class="n">${chDone(c) && i !== chapterOf(cur) ? '✓' : i + 1}</span>${esc(c.name)}</button>`).join('');
  $('#prog').style.width = `${Math.round((cur / (STEPS.length - 1)) * 100)}%`;
}
const visited = new Set();
function stepVisited(s) { return visited.has(s.id); }
$('#chapters').addEventListener('click', (e) => { const b = e.target.closest('[data-ch]'); if (!b) return; jumpChapter(b.dataset.ch); });

function renderCard() {
  const st = curStep(); visited.add(st.id);
  const ci = chapterOf(cur), chSteps = STEPS.filter((s) => s.ch === st.ch), n = chSteps.indexOf(st) + 1;
  const isDone = done.has(st.id);
  const canNext = st.info || isDone || (st.quiz && quizPick[st.id] === 'ok');
  let extra = '';
  if (st.quiz) {
    const pick = quizPick[st.id];
    extra = `<div class="opts" role="group" aria-label="Answers"><p style="margin:0;font-weight:700">${esc(st.quiz.text)}</p>${st.quiz.options.map((o, i) => `<button type="button" class="opt ${pick === 'ok' && o.ok ? 'right' : ''} ${(quizPick[st.id + ':w'] || []).includes(i) ? 'wrong' : ''}" data-opt="${i}" ${pick === 'ok' ? 'disabled' : ''}>${esc(o.t)}</button>`).join('')}</div>`;
  }
  if (st.custom === 'calc') extra = calcHtml();
  if (st.custom === 'rules') extra = `<ul class="rules">${RULES.map((r, i) => `<li><label><input type="checkbox" data-rule="${i}" ${(S.rules || [])[i] ? 'checked' : ''}><span>${esc(r)}</span></label></li>`).join('')}</ul>`;
  $('#card').innerHTML = `<div class="card-in">
    <div class="eyebrow"><span class="hud">${ci + 1} · ${esc(CH[ci].name)}</span><span class="hud">Step ${n} / ${chSteps.length}</span></div>
    <h2>${esc(st.title)}</h2>
    <div class="body">${st.body || ''}</div>
    ${st.visual ? `<div class="visual">${st.visual()}</div>` : ''}
    ${st.why ? `<div class="why"><b>Why it matters</b>${st.why}</div>` : ''}
    ${st.task ? `<div class="task ${isDone ? 'ok' : ''}"><span class="tk-lbl">${isDone ? 'Done ✓' : 'Your move'}</span><p>${st.task}</p></div>` : ''}
    ${extra}
    <div id="fb"></div>
    <div class="actions">
      <button type="button" class="btn ghost" id="c-back" ${cur === 0 ? 'disabled' : ''}>Back</button>
      ${st.target ? `<button type="button" class="btn ghost" id="c-show">Show me</button>` : ''}
      <span class="grow"></span>
      <button type="button" class="btn primary" id="c-next" ${canNext ? '' : 'disabled'}>${cur === STEPS.length - 1 ? 'Start over' : st.nextLabel || 'Next'}</button>
    </div></div>`;
  renderFb();
  if (st.custom === 'calc') calcUpdate();
  renderDock();
}
function renderDock() {
  const st = curStep(), isDone = done.has(st.id);
  const plain = (html) => { const d = document.createElement('div'); d.innerHTML = html || ''; return d.textContent; };
  const txt = st.quiz ? 'Answer the question in the coach panel.' : st.custom ? plain(st.task) : plain(st.task || st.title);
  $('#dock').classList.toggle('ok', isDone);
  $('#dock-txt').innerHTML = `<span class="tk-lbl hud">${isDone ? 'Done ✓' : 'Your move'}</span>${esc(txt)}`;
  $('#dock-show').hidden = !st.target || !!st.quiz;
}
$('#dock-more').addEventListener('click', () => $('#card').scrollIntoView({ behavior: 'smooth', block: 'start' }));
$('#dock-show').addEventListener('click', () => showMe(curStep()));
new IntersectionObserver(([e]) => { $('#dock').classList.toggle('away', e.isIntersecting); }, { threshold: 0.25 }).observe($('#card'));
$('#card').addEventListener('click', (e) => {
  const st = curStep();
  if (e.target.closest('#c-next')) { if (cur === STEPS.length - 1) { next(); return; } if (st.quiz && quizPick[st.id] !== 'ok') return; done.add(st.id); next(); return; }
  if (e.target.closest('#c-back')) { goTo(Math.max(0, cur - 1)); return; }
  if (e.target.closest('#c-show')) { showMe(st); return; }
  const o = e.target.closest('[data-opt]');
  if (o && st.quiz) {
    const i = +o.dataset.opt, ch = st.quiz.options[i];
    if (ch.ok) { quizPick[st.id] = 'ok'; done.add(st.id); renderCard(); good(ch.fb, 'Correct'); renderRail(); }
    else { quizPick[st.id + ':w'] = [...(quizPick[st.id + ':w'] || []), i]; renderCard(); bad(ch.fb); }
  }
});
$('#card').addEventListener('change', (e) => {
  const r = e.target.closest('[data-rule]');
  if (r) { S.rules = S.rules || []; S.rules[+r.dataset.rule] = r.checked; evaluate(); }
});
$('#card').addEventListener('input', (e) => { if (e.target.closest('.calc')) calcUpdate(); });
function clearHl() { $$('.hl').forEach((x) => x.classList.remove('hl')); }
function showMe(st) {
  clearHl();
  const el = typeof st.target === 'function' ? st.target() : $(st.target);
  if (!el || el.hidden || el.offsetParent === null) { if (st.target === '#b-paper' || st.target === '#tk-acct' || String(st.target).startsWith('#tk')) { if (!S.connected) { $('#broker').hidden = false; } else { S.ticketOpen = true; renderTicket(); } } }
  const el2 = typeof st.target === 'function' ? st.target() : $(st.target);
  if (!el2) return;
  el2.classList.add('hl'); el2.scrollIntoView({ block: 'center', behavior: 'smooth' });
  setTimeout(() => el2.classList.remove('hl'), 3200);
}

// risk calculator
function calcHtml() {
  const c = S.calc || (S.calc = { dd: 2000, stop: 15, qty: 1, inst: 'MNQ' });
  return `<div class="calc">
    <label><span class="tk-lbl">Max drawdown $</span><input class="field" id="cc-dd" inputmode="numeric" value="${c.dd}"></label>
    <label><span class="tk-lbl">Stop · points</span><input class="field" id="cc-stop" inputmode="decimal" value="${c.stop}"></label>
    <label><span class="tk-lbl">Contracts</span><input class="field" id="cc-qty" inputmode="numeric" value="${c.qty}"></label>
    <label><span class="tk-lbl">Contract</span><select class="field" id="cc-inst"><option ${c.inst === 'MNQ' ? 'selected' : ''}>MNQ</option><option ${c.inst === 'NQ' ? 'selected' : ''}>NQ</option></select></label>
    <div class="calc-out" id="cc-out"></div></div>`;
}
function calcUpdate() {
  const n = (id) => parseFloat(($(id) || {}).value) || 0;
  const c = S.calc; c.dd = n('#cc-dd'); c.stop = n('#cc-stop'); c.qty = Math.max(1, Math.round(n('#cc-qty'))); c.inst = ($('#cc-inst') || {}).value || 'MNQ';
  const risk = c.stop * (c.inst === 'NQ' ? 20 : 2) * c.qty, losses = risk > 0 ? Math.floor(c.dd / risk) : 0;
  const tone = losses >= 10 ? 'pos' : losses >= 5 ? '' : 'neg';
  const verdict = losses >= 10 ? 'Room to be wrong. Good.' : losses >= 5 ? 'Tight. One bad day hurts a lot.' : 'Too big. One bad morning ends the account.';
  const out = $('#cc-out'); if (!out) return;
  out.innerHTML = `<div><span class="tk-lbl">Risk / trade</span><span class="v">${usd(risk)}</span></div><div><span class="tk-lbl">Losses in a row to fail</span><span class="v ${tone}">${losses}</span></div><div><span class="tk-lbl">Verdict</span><span class="${tone}" style="font-size:14px">${verdict}</span></div>`;
}

// ── Jumping between chapters + restart ─────────────────────
function jumpChapter(id) {
  const first = STEPS.findIndex((s) => s.ch === id);
  if (first < 0) return;
  const model = CH.find((c) => c.id === id).model;
  if (!model) {
    if (S.mode === 'replay') exitReplay();
    flatAll(); S.ticketOpen = false;
    if (id === 'chart') { resetAll(); }
    else {
      setSym('MNQ1!'); S.tf = '5m'; syncTf(); S.inspected = true; S.zoomedOut = true;
      if (S.level == null || S.level >= lastLive() - 2) S.level = snap(lastLive() - 12);
      if (['order', 'manage', 'limits', 'end'].includes(id)) { S.connected = true; syncConn(); }
      resetT();
      if (id === 'manage') { Object.assign(T, { side: 'buy', type: 'limit', price: S.level, qty: 1, slOn: true, slTicks: 60, tpOn: true, tpTicks: 160 }); S.order = { type: 'limit', price: S.level, qty: 1, sl: slPrice(S.level), tp: tpPrice(S.level) }; }
      if (id === 'order') S.ticketOpen = true;
    }
    renderTicket();
  } else {

      { k: 'tag', i: 2, p: 12, dy: -6, t: '1', col: 'signal', at: 2, big: true }, { k: 'tag', i: 3, p: 11.4, dy: 14, t: '2', col: 'signal', at: 3, big: true, say: 'One aggressive candle. Price moved so fast the market skipped levels.' }, { k: 'tag', i: 4, p: 21.5, dy: -6, t: '3', col: 'signal', at: 4, big: true },
      { k: 'arrow', i: 6, p: 14.2, dir: 'up', col: 'win', at: 7, say: 'Price comes back into the gap and reacts off it.' }] };
  }, cap: 'Three candles. The gap between candle 1’s high and candle 3’s low is the imbalance.', rel: ['IFVG', 'PD-ARRAY'], ch: 'hl' },
  { ab: 'RT', full: 'Retracement', cat: 0, def: 'A temporary pullback against the main trend.', vis() {
    const c = cs([10, 13, 16.2, 19, 22, 20.4, 18.8, 18, 19.8, 22.6, 25.4, 28]);
    return { c, ann: [
      { k: 'line', pts: [[0, 10], [3, 22]], col: 'win', dash: '4 3', at: 3 },
      { k: 'band', lo: c[6].l, hi: 22.4, i0: 3.5, i1: 6.5, col: 'lag', t: 'RT', tpos: 'below', at: 6, say: 'A pullback against the trend. Temporary.' },
      { k: 'tag', i: 9, p: c[10].h, dy: -4, t: 'trend continues', col: 'win', at: 10, say: 'The trend picks back up after the retracement.' }] };
  }, cap: 'Up, pull back a little, then up again. The pullback is the retracement.', rel: ['PA'] },
  { ab: 'PA', full: 'Price Action', cat: 0, def: 'Reading candle movement and market structure without indicators.', vis() {
    const c = cs([10, 12, 14, 13, 12, 14.5, 17, 16, 15, 17.5, 20, 19, 18, 20.5, 23]);
    const H = (i, t) => ({ k: 'tag', i, p: c[i].h, dy: -6, t, col: 'win', at: i }), L = (i, t) => ({ k: 'tag', i, p: c[i].l, dy: 14, t, col: 'ice', at: i });
    return { c, ann: [H(1, 'H'), L(3, 'L'), { ...H(5, 'HH'), say: 'Higher high.' }, { ...L(7, 'HL'), say: 'Higher low.' }, H(9, 'HH'), L(11, 'HL'), { ...H(13, 'HH'), say: 'Higher highs and higher lows = uptrend. No indicators needed.' }] };
  }, cap: 'Just candles. Higher highs (HH) and higher lows (HL) tell you the trend.', rel: ['BOS', 'RT'] },

  // Risk Management
  { ab: 'SL', full: 'Stop Loss', cat: 1, def: 'Automatically closes a trade to limit losses.', vis() {
    const c = cs([20, 21, 20.6, 22, 21.4, 20, 18.2, 16.4, 15, 13.8]);
    const hit = c.findIndex((k) => k.l <= 17);
    return { c, ann: [
      { k: 'h', p: 21, i0: 0.5, i1: hit, col: 'ice', t: 'ENTRY · long', at: 0, say: 'Long at 21. The stop loss sits below at 17.' },
      { k: 'h', p: 17, i0: 0.5, i1: hit, col: 'loss', t: 'SL', below: true, at: 0 },
      { k: 'x', i: hit, p: 17, col: 'loss', t: 'SL hit · out', pos: 'below', dx: -18, at: hit, say: 'Price hits the stop. The trade closes automatically. Loss capped.' },
      { k: 'tag', i: 8, p: c[8].l, dy: 16, t: 'kept falling', col: 'ink3', at: 8, say: 'Price kept falling, but you were already out.' }] };
  }, cap: 'Price hits your stop loss and the trade closes on its own, before the loss gets bigger.', rel: ['TP', 'BRACKET', 'BE'] },
  { ab: 'TP', full: 'Take Profit', cat: 1, def: 'Automatically closes a trade to secure profits.', vis() {
    const c = cs([20, 21, 21.5, 22.6, 22, 23.6, 25, 26.6, 27.4, 26, 24.4]);
    const hit = c.findIndex((k) => k.h >= 26);
    return { c, ann: [
      { k: 'h', p: 21, i0: 0.5, i1: hit, col: 'ice', t: 'ENTRY', below: true, at: 0, say: 'Long at 21 with a take profit at 26.' },
      { k: 'h', p: 26, i0: 0.5, i1: hit, col: 'win', t: 'TP', tpos: 'l', at: 0 },
      { k: 'dot', i: hit, p: 26, col: 'win', t: 'TP hit · +profit', at: hit, say: 'Price touches the take profit. The trade closes and the profit is locked in.' },
      { k: 'tag', i: 9, p: c[9].l, dy: 14, t: 'price came back', col: 'ink3', at: 9, say: 'Price fell back afterwards, but the profit was already secured.' }] };
  }, cap: 'Price reaches your take profit and the trade closes on its own with the profit banked.', rel: ['SL', 'RR', 'BRACKET'] },
  { ab: 'RR', full: 'Risk to Reward Ratio', alias: 'RRR', cat: 1, def: 'Comparing potential profit to the amount being risked.', vis() {
    const c = cs([19, 20, 19.2, 18.4, 20.4, 22, 21.4, 24, 26, 25.4, 28, 29.6]);
    return { c, ann: [
      { k: 'band', lo: 17, hi: 20, i0: 0.5, col: 'loss', t: 'risk · 15-pt stop = 1R', tpos: 'below', at: 0, say: 'FLOWMTD standard: a 15-point stop. That’s your risk, called 1R.' },
      { k: 'band', lo: 20, hi: 28, i0: 0.5, col: 'win', fill: 0.07, t: 'reward · 40-pt target ≈ 2.7R', tx: 'r', at: 0, say: 'A 40-point target: 40 ÷ 15 ≈ 2.7R.' },
      { k: 'tag', i: 3, p: 26, t: 'RR 1:2.7', col: 'ink', big: true, at: 0 },
      { k: 'dot', i: 10, p: 28, col: 'win', at: 10, say: 'Risk 15 to make 40. Win just over 1 in 4 trades and you break even.' }] };
  }, cap: 'The FLOWMTD standard: 15-point stop, 40-point target, about 1:2.7. On 1 MNQ that’s $30 risked to make $80.', rel: ['SL', 'TP'] },
  { ab: 'BE', full: 'Break Even', cat: 1, def: 'Moving stop loss to entry so the trade can no longer lose.', vis() {
    const c = cs([19.5, 20, 21, 22, 23.4, 22.6, 21.6, 20.4, 19.4, 17.8, 16.4]);
    const k = 3, out = c.findIndex((q, i) => i > k && q.l <= 20);
    return { c, ann: [
      { k: 'h', p: 20, i0: 0.5, i1: k, col: 'ice', t: 'ENTRY', at: 0, say: 'Long at 20, stop at 17.' },
      { k: 'h', p: 17, i0: 0.5, i1: k, col: 'loss', t: 'SL', below: true, at: 0 },
      { k: 'h', p: 23, i0: k - 0.5, i1: k + 0.5, col: 'win', t: '1:1', at: k, dash: false, say: 'Price is 1:1 in your favor.' },
      { k: 'h', p: 20, i0: k, i1: out, col: 'signal', t: 'SL → BE', below: true, at: k, dash: false, say: 'Stop moves up to the entry: break even. This trade can’t lose now.' },
      { k: 'x', i: out, p: 20, col: 'signal', t: 'out at $0', pos: 'below', dx: 22, at: out, say: 'Price comes back and closes you out at $0 instead of a loss.' },
      { k: 'tag', i: 9, p: 17.8, dy: 16, t: 'the old stop would’ve been hit', col: 'ink3', at: 9, anchor: 'end', dx: 10 }] };
  }, cap: 'Once the trade is 1:1 in profit, the stop moves to entry. Worst case now: $0.', rel: ['SL', 'RR'], ch: 'dl' },
  { ab: 'DD', full: 'Drawdown', cat: 1, def: 'The amount an account is down from its highest balance.', vis() {
    const line = [50000, 50600, 51200, 50900, 51800, 52400, 51900, 51300, 50700, 51100, 51500];
    return { line, ann: [
      { k: 'h', p: 52400, i0: 5, col: 'ice', t: 'highest balance $52,400', at: 5, say: 'New highest balance: $52,400.' },
      { k: 'vr', i: 8, p0: 52400, p1: 50700, col: 'loss', t: 'DD −$1,700', at: 8, say: 'Now at $50,700. That’s $1,700 of drawdown from the peak.' }] };
  }, cap: 'Drawdown is measured from the highest balance, not from where you started.', rel: ['EVAL', 'DLL'] },

  // Trading Positions
  { ab: 'LONG', full: 'Buying Position', cat: 2, def: 'Entering a trade expecting price to rise.', vis() {
    const c = cs([18, 19, 18.6, 20, 21.6, 21, 23, 24.6, 26]);
    return { c, ann: [
      { k: 'arrow', i: 0, p: 18.6, dir: 'up', col: 'ice', t: 'BUY', at: 0, say: 'Buy here, expecting price to go up.' },
      { k: 'band', lo: 19, hi: 26, i0: 0.5, col: 'win', fill: 0.08, t: 'price up = profit', tx: 'r', tpos: 'below', at: 7, say: 'Price rises. The higher it goes, the more a long makes.' }] };
  }, cap: 'Buy first, sell later. You make money when price goes UP.', rel: ['SHORT', 'ENTRY'] },
  { ab: 'SHORT', full: 'Selling Position', cat: 2, def: 'Entering a trade expecting price to fall.', vis() {
    const c = cs([26, 25, 25.4, 24, 22.4, 23, 21, 19.4, 18]);

      { k: 'arrow', i: 0, p: 25.4, dir: 'down', col: 'loss', t: 'SELL', at: 0, say: 'Sell here, expecting price to go down.' },

  }, cap: 'Sell first, buy back later. You make money when price goes DOWN.', rel: ['LONG'] },
  { ab: 'ENTRY', full: 'Trade Entry', cat: 2, def: 'The price level where a trade is opened.', vis() {
    const c = cs([24, 23, 22, 21.4, 20.6, 21.8, 23, 24.2]);
    const f = c.findIndex((k) => k.l <= 21);

  }, cap: 'The exact price your order filled at. Everything (stop, target, P&L) is measured from here.', rel: ['EXIT', 'LIMIT'] },
  { ab: 'EXIT', full: 'Trade Exit', cat: 2, def: 'The price level where a trade is closed', vis() {
    const c = cs([20.5, 21, 22, 23, 22.5, 24, 25, 24.4, 23]);
    return { c, ann: [
      { k: 'h', p: 21, i0: 0.5, i1: 5, col: 'ice', t: 'entry', below: true, at: 0, say: 'In at 21.' },
      { k: 'band', lo: 21, hi: 25, i0: 0.5, i1: 5, col: 'win', fill: 0.07, at: 5 },
      { k: 'x', i: 5, p: 25, col: 'signal', t: 'EXIT 25', at: 5, say: 'Out at 25. Trade closed: +4 points.' }] };
  }, cap: 'Where you closed the trade: at your target, your stop, or by hand.', rel: ['ENTRY', 'TP', 'SL'] },

  { ab: 'LTF', full: 'Lower Time Frame', cat: 3, def: 'Smaller charts like 1m, 5m, or 15m.', custom: tfPair('ltf'), cap: 'Each small candle is 5 minutes. Twelve of them build one 1-hour candle.', rel: ['HTF'] },
  { ab: 'HTF', full: 'Higher Time Frame', cat: 3, def: 'Larger charts like 1H, 4H, or Daily.', custom: tfPair('htf'), cap: 'Same price, zoomed out: the whole hour in one candle. HTF sets the direction; LTF times the entry.', rel: ['LTF', 'OLHC'] },

  // Prop Firm Terms
  { ab: 'PROP FIRM', full: 'Proprietary Trading Firm', cat: 4, def: 'A company that provides traders with funded capital.', custom: propFlow, cap: 'You prove yourself on their rules, they give you capital, you split the profits.', rel: ['EVAL', 'FUNDED'] },

  { ab: 'FUNDED', full: 'Funded Account', cat: 4, def: 'The account you get after passing the eval: you trade the firm’s capital under its rules and request payouts.', custom: ladder('FUNDED'), cap: 'Pass the eval → funded. Same rules still apply, and now profits can be paid out.', rel: ['EVAL', 'LIVE'] },

  { ab: 'DLL', full: 'Daily Loss Limit', cat: 4, def: 'The most your account can lose in one day. Hit it and you’re done for the day (or the account fails, depending on the firm).', vis() {

      { k: 'x', i: 7, p: -1000, col: 'loss', t: 'done for today', anchor: 'end', dx: -6, at: 7, say: 'Limit hit. No more trades today.' }] };

  // Charts & Orders (from the lessons)
  { ab: 'CANDLE', full: 'Candlestick · OHLC', cat: 5, def: 'One bar of price over one time period: where it Opened, its High, its Low and where it Closed. Green closed higher, red closed lower.', vis() {
    const c = [null, K(12, 22, 8, 19), null, null, K(19, 23, 9, 12), null];
    const lab = (i, p, t, col) => ({ k: 'tag', i, p, dx: 14, dy: 3, t, col: col || 'ink2', anchor: 'start', at: i });
    return { c, slots: 6, ann: [lab(1, 22, 'High'), lab(1, 19, 'Close', 'win'), lab(1, 12, 'Open'), lab(1, 8, 'Low'), lab(4, 23, 'High'), lab(4, 19, 'Open'), lab(4, 12, 'Close', 'loss'), lab(4, 9, 'Low'),
      { k: 'tag', i: 1, p: 5.5, t: 'UP candle', col: 'win', at: 1, say: 'Green: it closed higher than it opened.' }, { k: 'tag', i: 4, p: 5.5, t: 'DOWN candle', col: 'loss', at: 4, say: 'Red: it closed lower than it opened.' }] };
  }, cap: 'Press play and watch each candle form: open, one extreme, the other, then the close.', rel: ['WICK', 'OLHC'], ch: 'chart' },
  { ab: 'WICK', full: 'Wick', cat: 5, def: 'The thin line above or below the body. Price traded there during the candle but didn’t close there.', vis() {
    const c = cs([16, 15.5, 16.2, 15.6], { 2: { l: 9.5, h: 16.4, c: 15.6 } });
    c.push(K(15.6, 18, 15.2, 17.6));
    return { c, slots: 6, ann: [
      { k: 'band', lo: 9.5, hi: 15.2, i0: 1.6, i1: 2.4, col: 'signal', fill: 0.12, at: 2 },
      { k: 'tag', i: 2, p: 12, dx: 12, t: 'long wick: sellers pushed down,', col: 'signal', anchor: 'start', at: 2, say: 'Price dropped hard during the candle…' },
      { k: 'tag', i: 2, p: 12, dx: 12, dy: 12, t: 'buyers pushed it back', col: 'signal', anchor: 'start', at: 2, say: '…then got rejected and closed back up. The wick shows where it went.' }] };
  }, cap: 'Wicks show where price went and got rejected. That’s where stops and orders traded.', rel: ['CANDLE', 'SWEEP'] },
  { ab: 'TICK', full: 'Tick & Point', cat: 5, def: 'The smallest price move. On NQ/MNQ one tick is 0.25, and 4 ticks make 1 point.', raw: () => VIS.ticks(), cap: 'MNQ: $0.50 a tick, $2 a point. NQ: $5 a tick, $20 a point.', rel: ['SL', 'RR'], ch: 'chart' },
  { ab: 'MARKET', full: 'Market Order', cat: 5, def: 'Buy or sell right now at the current price.', vis() {
    const c = cs([20, 21, 20.4, 21.6, 22.8, 22.2, 23.6]);
    return { c, slots: 7, ann: [{ k: 'dot', i: 2, p: c[2].c, col: 'win', t: 'MARKET BUY · filled now', pos: 'below', at: 2, say: 'Press buy: filled instantly at whatever price it is.' }] };
  }, cap: 'Fastest fill, but you take whatever price is there.', rel: ['LIMIT', 'STOP'], ch: 'order' },
  { ab: 'LIMIT', full: 'Limit Order', cat: 5, def: 'Waits at your price. A buy limit sits below price and fills if price dips to it.', vis() {
    const c = cs([24, 23.4, 22.4, 21.6, 20.6, 21.6, 23, 24.4]);
    const f = c.findIndex((k) => k.l <= 21);
    return { c, ann: [
      { k: 'h', p: 21, i1: f, col: 'ice', t: 'BUY LIMIT 21 · waiting', below: true, at: 0, say: 'The order waits below price at 21.' },
      { k: 'dot', i: f, p: 21, col: 'win', t: 'filled', pos: 'below', at: f, say: 'Price dips to 21: filled. You got the price you wanted.' }] };
  }, cap: 'You pick the price. It only fills if price comes to you.', rel: ['MARKET', 'STOP', 'ENTRY'], ch: 'order' },
  { ab: 'STOP', full: 'Stop Order', cat: 5, def: 'Waits at your price and fills when price breaks through it. A buy stop sits above price.', vis() {
    const c = cs([20, 20.6, 20.2, 21, 20.6, 22.4, 24, 25.2]);
    const f = c.findIndex((k) => k.h >= 22);
    return { c, ann: [
      { k: 'h', p: 22, i1: f, col: 'ice', t: 'BUY STOP 22 · waiting', at: 0, say: 'The order waits ABOVE price at 22.' },
      { k: 'dot', i: f, p: 22, col: 'win', t: 'filled on the break', pos: 'below', dx: 26, at: f, say: 'Price breaks up through 22: filled.' }] };
  }, cap: 'Fills on a break. It’s also how a stop loss works: it fires when price reaches it.', rel: ['LIMIT', 'SL'], ch: 'order' },
  { ab: 'BRACKET', full: 'Bracket Order · OCO', cat: 5, def: 'An entry with a stop loss and take profit attached. When one of them fills, the other cancels (One Cancels Other).', vis() {
    const c = cs([20, 20.8, 21.6, 21, 22.6, 24, 25.2, 26.4, 25]);
    const hit = c.findIndex((k) => k.h >= 26);
    return { c, ann: [
      { k: 'h', p: 20.5, i1: hit, col: 'ice', t: 'ENTRY', below: true, at: 0, say: 'Entry with the stop and target attached.' },
      { k: 'h', p: 26, i1: hit, col: 'win', t: 'TP', tpos: 'l', at: 0 },
      { k: 'h', p: 17.5, i1: hit, col: 'loss', t: 'SL', below: true, at: 0 },
      { k: 'dot', i: hit, p: 26, col: 'win', t: 'TP filled', at: hit, say: 'Target fills…' },
      { k: 'x', i: hit, p: 17.5, col: 'ink3', t: 'SL cancelled', pos: 'below', at: hit, say: '…and the stop cancels itself. One cancels other.' }] };
  }, cap: 'Set it once. Whichever side gets hit first closes the trade and cancels the other.', rel: ['SL', 'TP'], ch: 'order' },

  // FLOWMTD Models (definitions from the teaching guides / lessons)
  { ab: 'LIQUIDITY', full: 'Liquidity', cat: 6, def: 'Stop orders resting above old highs and below old lows. Price is drawn to them: they’re the draw, your target.', vis() {
    const c = cs([16, 19, 21, 19, 16.5, 14, 12, 14, 16.5, 19, 21.5, 23]);
    return { c, ann: [
      { k: 'h', p: c[1].h, i0: 1, i1: 9.5, col: 'lag', t: 'buy stops above', at: 1 },
      { k: 'h', p: c[5].l, i0: 5, col: 'lag', t: 'sell stops below', below: true, at: 5, say: 'Every obvious high and low has stops parked beyond it.' },
      { k: 'tag', i: 10, p: c[10].h, dy: -6, t: 'draw taken', col: 'signal', at: 10, say: 'Price travels to the pool of stops and takes it.' }] };
  }, cap: 'Stops sit just past obvious highs and lows. Price gets pulled toward them.', rel: ['EQH', 'EQL', 'SWEEP'], ch: 'po3' },
  { ab: 'SWEEP', full: 'Liquidity Sweep', cat: 6, def: 'Price trades through a high or low, grabs the stops parked there, and comes back. It traps traders on the wrong side.', vis() {
    const c = cs([20, 22, 20.6, 19, 21, 22.2, 20.4, 19.6, 20.6, 22.8, 24.6, 26], { 6: { l: 16.6 } });
    return { c, ann: [
      { k: 'band', lo: 18.4, hi: 22.9, i0: -0.5, i1: 5.5, col: 'ice', fill: 0.06, t: 'range', at: 0 },
      { k: 'h', p: 18.4, i0: -0.5, i1: 7, col: 'ice', t: 'range low', below: true, tpos: 'l', at: 3 },
      { k: 'dot', i: 6, p: 16.6, col: 'signal', t: 'SWEEP', pos: 'below', at: 6, say: 'A wick runs under the range low, grabs the stops… and closes back inside.' },
      { k: 'tag', i: 10, p: c[10].h, dy: -6, t: 'reversal', col: 'win', at: 10, say: 'Trapped sellers fuel the move back up.' }] };
  }, cap: 'Run the stops, close back inside, reverse. Low swept → look for longs.', rel: ['LIQUIDITY', 'IFVG', 'RANGE H/L', 'TURTLE SOUP'], ch: 'hl' },
  { ab: 'IFVG', full: 'Inverted Fair Value Gap', alias: 'IFG', cat: 6, def: 'A gap that flipped. Sellers made the gap; when a candle CLOSES back above it, old resistance becomes support.', vis() {
    const c = [K(22, 22.6, 20.8, 21), K(21, 21.4, 16, 16.4), K(16.4, 17.6, 14.2, 15), K(15, 17.2, 14.6, 16.8), K(16.8, 19.8, 16.4, 19.2), K(19.2, 20.6, 17.4, 20.2), K(20.2, 22.8, 19.8, 22.4)];
    return { c, ann: [
      { k: 'band', lo: 17.6, hi: 20.8, i0: 0, col: 'loss', t: 'bearish FVG', tx: 'r', at: 2, say: 'The drop leaves a bearish gap.' },
      { k: 'tag', i: 3, p: 17.2, dy: -6, t: 'wick in: not yet', col: 'ink3', at: 3 },
      { k: 'band', lo: 17.6, hi: 20.8, i0: 4, col: 'win', t: 'iFVG · now support', tx: 'r', tpos: 'below', at: 5, say: 'A candle CLOSES above the gap. It has inverted: support now.' },
      { k: 'arrow', i: 5, p: 17.4, dir: 'up', col: 'win', at: 5 }] };
  }, cap: 'A wick inside isn’t enough. It needs a close back through the gap.', rel: ['FVG', 'SWEEP'], ch: 'hl' },
  { ab: 'RANGE H/L', full: 'Range High / Range Low', cat: 6, def: 'NYFLOW H/L: the highest high and lowest low from 7:00 to 9:25 AM ET. At 9:25 the range locks.', vis() {
    const c = cs([20, 21.4, 20.2, 22.6, 21.4, 19.6, 18.6, 20.4, 21.8, 20.6, 19.4, 20.8, 17.6, 19.8, 22.4], { 11: { l: 16.8 } });
    return { c, ann: [
      { k: 'band', lo: c[5].l, hi: c[2].h, i0: -0.5, i1: 9.5, col: 'ice', fill: 0.06, t: '7:00–9:25', at: 9, say: 'The range locks at 9:25.' },
      { k: 'h', p: c[2].h, i0: 2, col: 'ice', t: 'range high', at: 2, say: 'Every new extreme moves a line.' },
      { k: 'h', p: c[5].l, i0: 5, col: 'ice', t: 'range low', below: true, at: 5 },
      { k: 'dot', i: 11, p: 16.8, col: 'signal', t: 'low swept → longs', pos: 'below', at: 11, say: 'After 9:30 one side gets swept. Low swept → longs toward the range high.' }] };
  }, cap: 'Mark the high and low of the pre-market. The fuel sits just past them.', rel: ['SWEEP', 'SESSIONS'], ch: 'hl' },
  { ab: 'PO3', full: 'Power of Three · AMD', alias: 'AMD', cat: 6, def: 'Price moves in three phases: Accumulation (sideways chop), Manipulation (a fake move that sweeps stops), Distribution (the real move).', vis() {
    const c = cs([20, 21, 20, 21.2, 19.8, 20.8, 19.6, 18, 16.6, 18.6, 21.6, 24, 26.4]);

      { k: 'band', lo: 19.2, hi: 21.8, i0: -0.5, i1: 5.5, col: 'ink2', fill: 0.08, t: 'A · accumulation', tpos: 'above', at: 5, say: 'A: chop. No trades here.' },
      { k: 'tag', i: 7, p: c[7].l, dy: 16, t: 'M · manipulation', col: 'loss', at: 7, say: 'M: the fake move down that sweeps stops. Not the real move.' },
      { k: 'tag', i: 10, p: c[11].h, dy: -4, t: 'D · distribution', col: 'win', anchor: 'end', at: 11, say: 'D: the real move, with the trend.' }] };
  }, cap: 'Chop, fake-out, real move. The model trades the real move after the fake one.', rel: ['OLHC', 'SWEEP', 'LIQUIDITY'], ch: 'po3' },
  { ab: 'OLHC', full: 'Open → Low → High → Close', alias: 'OHLC', cat: 6, def: 'How a bullish key candle (10:00 in NY, 8 PM in Asia) builds: dip below the open first (manipulation), then drive up and close higher. Shorts: OHLC.', vis() {
    const c = [null, K(20, 26, 15, 25), null];
    return { c, slots: 3, ann: [
      { k: 'h', p: 20, i0: 0.6, i1: 1.4, col: 'ink', t: 'O', tpos: 'l', dash: '2 2', at: -1 },
      { k: 'tag', i: 1, p: 15, dx: 22, t: 'L · dip first', col: 'loss', anchor: 'start', at: 1, say: 'Open, then a dip below it: the manipulation.' },
      { k: 'tag', i: 1, p: 26, dx: 22, t: 'H', col: 'win', anchor: 'start', dy: 4, at: 1 },
      { k: 'tag', i: 1, p: 25, dx: 22, dy: 12, t: 'C · closes high', col: 'win', anchor: 'start', at: 1, say: 'Then it drives up and closes near the high: distribution.' }] };
  }, cap: 'Press play: the candle dips first, then runs. That’s the order you want for longs.', rel: ['PO3', 'HTF'], ch: 'po3' },
  { ab: 'KEY LEVEL', full: 'Key Level', cat: 6, def: 'ASIAFLOW: a level that lines up with the draw, somewhere price can dip into during the manipulation before going your way.', vis() {
    const c = cs([23, 22.4, 23, 22, 21, 19.4, 18.4, 19.6, 21.6, 23.4, 25.2]);
    return { c, ann: [
      { k: 'band', lo: 17.6, hi: 19.2, i0: -0.5, col: 'win', t: 'KEY LEVEL', tx: 'r', tpos: 'below', at: 0, say: 'Your landing spot, marked before the session.' },
      { k: 'h', p: 26, col: 'lag', t: 'the draw', at: 0 },
      { k: 'dot', i: 6, p: c[6].l, col: 'signal', t: 'manipulation into it', pos: 'below', dx: -34, at: 6, say: 'Price dips into the level. That’s the manipulation you were waiting for.' },
      { k: 'arrow', i: 9, p: c[9].h, dir: 'up', col: 'win', at: 9, say: 'Then it drives toward the draw.' }] };
  }, cap: 'No key level, nowhere to wait. It’s where the fake move should land.', rel: ['NWOG', 'PO3'], ch: 'asia' },
  { ab: 'NWOG', full: 'New Week Opening Gap', cat: 6, def: 'The gap between Friday’s close and Sunday’s 6 PM open. In ASIAFLOW it’s the highest-priority draw.', vis() {
    const c = [...cs([20, 21, 20.4, 21.6, 22]), null, ...cs([26.5, 26, 25, 24, 23.4, 24.6, 23.8, 22.4])];
    return { c, ann: [
      { k: 'band', lo: 22, hi: 26.5, i0: 3.5, col: 'lag', t: 'NWOG', tx: 'r', at: 5, say: 'Friday closed at 22. Sunday opened at 26.5. The empty space is the NWOG.' },
      { k: 'tag', i: 1.5, p: 19, t: 'Friday', col: 'ink3', at: 0 }, { k: 'tag', i: 8, p: 27.8, t: 'Sunday 6 PM →', col: 'ink3', at: 5 },
      { k: 'dot', i: 12, p: 22.4, col: 'signal', t: 'gap filled', pos: 'below', at: 12, say: 'Price gets drawn back into the gap.' }] };
  }, cap: 'The weekend leaves a hole in price. Price tends to come back for it.', rel: ['KEY LEVEL', 'FVG'], ch: 'asia' },
  { ab: 'OPENS', full: 'Opening Prices', cat: 6, def: 'Extended Learning: 6 PM daily open, midnight (true day) open, 8:30 and 9:30. Below them → look for longs. Above → shorts. A confluence, not a deal breaker.', vis() {
    const c = cs([24, 24.6, 23.6, 22.4, 21.6, 20, 19, 17.8, 18.6, 20.8, 22.6, 24.4, 26]);
    return { c, ann: [
      { k: 'h', p: 24.8, col: 'ink3', t: '6 PM open', at: 0 },
      { k: 'h', p: 23.6, i0: 1.5, col: 'signal', t: 'midnight open', below: true, at: 1 },
      { k: 'band', lo: 17.4, hi: 18.8, i0: -0.5, col: 'win', t: 'level below the opens → longs', tpos: 'below', at: 0, say: 'The level sits below both opens: longs only.' },
      { k: 'arrow', i: 7, p: c[7].l, dir: 'up', col: 'win', at: 8, say: 'Price trades down into the level, then back above the opens.' }] };
  }, cap: 'Where the day opened tells you which side to look for.', rel: ['PLC', 'SESSIONS'], ch: 'dl' },
  { ab: 'PLC', full: 'Protected Low Catalyst', alias: 'PHC', cat: 6, def: 'On the 4H: a swing low that formed inside a bullish FVG while price respected it. It’s a draw: price is expected to come back and take it. (PHC is the same for highs.)', vis() {
    const c = [K(16, 17, 15.4, 16.8), K(16.8, 18.2, 16.4, 18), K(18, 25, 17.8, 24.6), K(24.6, 27, 21.4, 26.4), K(26.4, 27.2, 22, 22.6), K(22.6, 26.6, 22.2, 26.2), K(26.2, 27.4, 24.6, 25), K(25, 25.4, 21.2, 21.6), K(21.6, 22, 19.6, 20.4)];
    return { c, ann: [
      { k: 'band', lo: 18.2, hi: 21.4, i0: 1, col: 'win', fill: 0.1, t: 'bullish FVG', tx: 'r', tpos: 'below', at: 3, say: 'A bullish 4H gap.' },
      { k: 'h', p: 22, i0: 4, i1: 7, col: 'signal', t: 'PLC', tpos: 'l', below: true, at: 4, say: 'A swing low forms while price respects the gap: the PLC.' },
      { k: 'dot', i: 7, p: 22, col: 'signal', t: 'PLC swept', pos: 'below', dx: 18, at: 7, say: 'Price comes back and takes it. Your level sits below it.' }] };
  }, cap: 'About 90% of daily levels are built around a PLC or PHC.', rel: ['PL', 'OPENS', 'TURTLE SOUP'], ch: 'dl' },
  { ab: 'LRL', full: 'Low-Resistance Liquidity', cat: 6, def: 'Price stepping toward your level slowly, making low after low. Each little low is easy fuel, so price slides right into the level.', vis() {
    const c = cs([25, 24.2, 24.6, 23.6, 23.9, 22.9, 23.2, 22.2, 22.5, 21.4, 19.6, 22.2, 24.6], { 9: { l: 19 } });
    const lows = [0, 2, 4, 6, 8];
    return { c, ann: [
      { k: 'band', lo: 18.6, hi: 20.2, i0: -0.5, col: 'win', t: 'LEVEL', tx: 'r', tpos: 'below', at: 0 },
      ...lows.map((i, j) => ({ k: 'dot', i, p: c[i].l, col: 'lag', r: 2.5, at: i, say: j === 2 ? 'Low after low after low…' : undefined })),
      { k: 'tag', i: 3, p: c[2].h, dy: -12, t: 'LRL: low after low', col: 'lag', at: 4 },
      { k: 'arrow', i: 9, p: 19, dir: 'up', col: 'win', at: 10, say: '…straight into the level, then the reaction.' }] };
  }, cap: 'Slow, stair-step lows into the level: one of the two things a limit entry needs.', rel: ['TURTLE SOUP', 'PLC'], ch: 'dl' },
  { ab: 'TURTLE SOUP', full: 'Turtle Soup', cat: 6, def: 'A short-term low forms just above your level. Price runs through it, tags the level and rejects hard. That’s the sweep that makes a limit entry valid.', vis() {
    const c = cs([24, 23, 22.4, 21.2, 21.6, 20.9, 21.8, 22.6, 21.4, 20, 22.6, 24.4, 26]);
    const stl = c[4].l;
    c[8] = { ...c[8], l: 17.6, c: 20.2 }; c[9] = K(20.2, 23, 19.8, 22.6);
    return { c, ann: [
      { k: 'band', lo: 17, hi: 18.6, i0: -0.5, col: 'win', t: 'LEVEL', tx: 'r', tpos: 'below', at: 0 },
      { k: 'h', p: stl, i0: 4, i1: 8.5, col: 'signal', t: 'short-term low', at: 4, say: 'A short-term low forms just above the level.' },
      { k: 'dot', i: 8, p: 17.6, col: 'signal', t: 'turtle soup', pos: 'below', dx: -28, at: 8, say: 'Price runs the short-term low, tags the level, rejects with a long wick.' },
      { k: 'tag', i: 10, p: c[10].h, dy: -6, t: 'protected low', col: 'win', at: 10, say: 'That low is now protected. Price delivers higher.' }] };
  }, cap: 'Stops under the short-term low get taken right into your level.', rel: ['LRL', 'SWEEP', 'PL'], ch: 'dl' },
  { ab: 'PL', full: 'Protected Low', alias: 'PH', cat: 6, def: 'The low that held after the sweep and that price delivered higher from. While the idea is valid, price shouldn’t trade back through it. (PH for highs.)', vis() {
    const c = cs([22, 20.4, 18.6, 17.2, 19.6, 21.2, 20.2, 22.6, 24, 23.2, 25.6], { 2: { l: 16.4 } });
    return { c, ann: [
      { k: 'h', p: 16.4, i0: 2, col: 'win', t: 'PROTECTED LOW', below: true, dash: false, at: 3, say: 'The low held. It’s now protected.' },
      { k: 'tag', i: 6, p: c[6].l, dy: 16, t: 'higher low', col: 'ink2', at: 6 },
      { k: 'tag', i: 9, p: c[9].l, dy: 16, t: 'never back below', col: 'ink2', at: 9, say: 'Every pullback holds above it while price delivers higher.' }] };
  }, cap: 'If price closes back through the protected low, the idea is wrong.', rel: ['TURTLE SOUP', 'PLC'], ch: 'dl' },
  { ab: 'OB', full: 'Order Block', cat: 6, def: 'The last opposite candle before a strong move: for longs, the last down candle before price displaces up. Price often reacts when it comes back to it.', vis() {
    const c = [K(22, 22.4, 20.6, 21), K(21, 21.3, 19.4, 19.8), K(19.8, 20.2, 18.4, 18.8), K(18.8, 23.6, 18.6, 23.2), K(23.2, 26, 22.8, 25.6), K(25.6, 26.2, 22.4, 22.8), K(22.8, 23, 19.2, 20), K(20, 24.8, 19.6, 24.4), K(24.4, 27.8, 24, 27.4)];
    return { c, ann: [
      { k: 'band', lo: 18.4, hi: 20.2, i0: 1.6, col: 'ice', t: 'OB', tx: 'r', tpos: 'below', at: 3, say: 'The last down candle before the strong move up: the order block.' },
      { k: 'arrow', i: 6, p: 19.2, dir: 'up', col: 'win', at: 7, say: 'Price comes back to it and reacts.' }] };
  }, cap: 'Find the last down candle before the push. That’s where the buying started.', rel: ['BREAKER', 'PD-ARRAY'], ch: 'dl' },
  { ab: 'BREAKER', full: 'Breaker', cat: 6, def: 'A level that failed and flipped: price broke through it, and when price comes back it acts the other way (old resistance becomes support).', vis() {
    const c = [K(18, 21.6, 17.8, 21.2), K(21.2, 21.6, 17, 17.4), K(17.4, 18, 15.2, 15.8), K(15.8, 20, 15.6, 19.6), K(19.6, 24.2, 19.4, 23.8), K(23.8, 24.4, 20.8, 21.2), K(21.2, 23.4, 20.6, 23), K(23, 26.4, 22.6, 26)];
    return { c, ann: [
      { k: 'band', lo: 18, hi: 21.6, i0: -0.5, i1: 3.5, col: 'loss', t: 'resistance', tpos: 'above', at: 1, say: 'The last up candle before the drop: resistance.' },
      { k: 'band', lo: 18, hi: 21.6, i0: 3.5, col: 'win', t: 'breaker · support', tx: 'r', tpos: 'below', at: 4, say: 'Price closes up through it. It failed, so it flips.' },
      { k: 'arrow', i: 5, p: 20.8, dir: 'up', col: 'win', at: 6, say: 'Price retests it from above and it holds as support.' }] };
  }, cap: 'A broken level flips sides. In Extended Learning it’s the 15m/5m refinement.', rel: ['OB', 'IFVG', 'REFINE'], ch: 'dl' },
  { ab: 'PD-ARRAY', full: 'PD-Array', cat: 6, def: 'The places price reacts from: FVGs, order blocks, breakers. After confirmation, entries are taken at the first PD-array.', vis() {
    const c = cs([26, 24.6, 23.4, 22, 20.6, 22.8, 24.8, 26.8, 27.4]);
    return { c, slots: 10, ann: [
      { k: 'band', lo: 22.4, hi: 23.6, i0: -0.5, col: 'win', t: 'FVG', tx: 'r', at: 0 },
      { k: 'band', lo: 20.4, hi: 21.6, i0: -0.5, col: 'ice', t: 'order block', tx: 'r', at: 0 },
      { k: 'band', lo: 18, hi: 19.2, i0: -0.5, col: 'lag', t: 'breaker', tx: 'r', at: 0, say: 'Map the arrays before price gets there.' },
      { k: 'arrow', i: 4, p: c[4].l, dir: 'up', col: 'win', at: 5, say: 'Price reacts at one of them.' }] };
  }, cap: 'Mark them in advance. They’re where price is likely to react.', rel: ['FVG', 'OB', 'BREAKER'], ch: 'dl' },
  { ab: 'REFINE', full: 'Refining a Level', cat: 6, def: 'Take the same idea from the 4H down through the 1H and 15m/5m (and optionally 1m) to cut the drawdown. Same target, a fraction of the risk.', raw: () => VIS.refine(), cap: 'A 4H level might need 150 ticks of room. Refined to the 15m it can need 50 or less.', rel: ['PD-ARRAY', 'BREAKER', 'HTF'], ch: 'dl' },
  { ab: 'COS', full: 'Change of Structure', cat: 6, def: 'Price breaks the last swing AGAINST the trend. In a downtrend, a close above the last lower high: first sign the trend is turning.', vis() {
    const c = cs([26, 23.6, 24.8, 22, 20, 21.4, 19.2, 17.8, 19, 21.6, 23.2, 22.4, 24.6]);
    const lh = c[4].h, bi = c.findIndex((k, i) => i > 6 && k.c > lh);
    return { c, ann: [
      { k: 'tag', i: 1, p: c[1].h, dy: -6, t: 'LH', col: 'loss', at: 1 }, { k: 'tag', i: 4, p: c[4].h, dy: -6, t: 'LH', col: 'loss', at: 4, say: 'Lower highs: a downtrend.' },
      { k: 'h', p: lh, i0: 4, i1: bi, col: 'ice', at: 4 },
      { k: 'tag', i: bi, p: c[bi].h, dy: -8, t: 'COS ↑', col: 'signal', big: true, at: bi, say: 'A close above the last lower high: change of structure.' }] };
  }, cap: 'BOS continues the trend. COS is the first break against it.', rel: ['BOS', 'IFVG'], ch: 'dl' },
  { ab: 'PDH / PDL', full: 'Previous Day High / Low', cat: 6, def: 'Yesterday’s high and low. Common targets, because stops rest just past them.', vis() {
    const c = [...cs([20, 22, 23.6, 21.8, 19.6, 18.4, 20.2]), null, ...cs([20.6, 21.4, 22.6, 23.4, 24.4])];
    const pdh = Math.max(...c.slice(0, 6).map((k) => k.h)), pdl = Math.min(...c.slice(0, 6).map((k) => k.l));
    return { c, ann: [
      { k: 'h', p: pdh, i0: 1, col: 'ice', t: 'PDH', at: 5 }, { k: 'h', p: pdl, i0: 4, col: 'ice', t: 'PDL', below: true, at: 5, say: 'Yesterday’s high and low carry into today.' },
      { k: 'tag', i: 2.5, p: pdl, dy: 26, t: 'yesterday', col: 'ink3', at: 0 }, { k: 'tag', i: 9, p: pdl, dy: 26, t: 'today', col: 'ink3', at: 7 },
      { k: 'dot', i: 10, p: pdh, col: 'signal', t: 'PDH taken', pos: 'below', dx: -10, at: 10, say: 'Today price runs the PDH: the target.' }] };
  }, cap: 'Mark them every morning. They’re common targets in Extended Learning.', rel: ['LIQUIDITY', 'RS'], ch: 'dl' },
  { ab: 'RS', full: 'Range Settlement', cat: 6, def: 'Forms every weekday at 9:30. Futures trade overnight but the index doesn’t, so orders get left behind. At the open they get filled, and price is drawn to that level.', vis() {
    const c = cs([20, 20.6, 19.8, 21, 21.8, 23.4, 24.8, 26.2, 27.2]);
    return { c, ann: [
      { k: 'h', p: 20.6, i0: 0.5, i1: 1.5, col: 'ink', t: '9:30', tpos: 'l', below: true, dash: false, at: 0, say: '9:30: price opens below the Range Settlement.' },
      { k: 'band', lo: 20.6, hi: 27, i0: 0.5, col: 'lag', fill: 0.06, at: 0 },
      { k: 'h', p: 27, col: 'lag', t: 'RS · the AM draw', tpos: 'l', at: 0 },
      { k: 'dot', i: 7, p: 27, col: 'lag', t: 'RS filled', pos: 'below', dx: -8, at: 7, say: 'Pulled up to fill it.' }] };
  }, cap: 'Opened below RS → the AM draw is up. It only applies after 9:30, never overnight.', rel: ['OPENS', 'PDH / PDL'], ch: 'dl' },
  // ECHO X ORBIT words (concepts only)
  { ab: 'CISD', full: 'Change in State of Delivery', cat: 6, def: 'Price closes back through the opening price of the move that just ran. After a sweep, it’s the first proof that delivery has flipped direction. Confluence Master doesn’t mark it: read it by eye.', vis() {
    const c = cs([25, 23.6, 24.2, 22.4, 20.8, 19.6, 20.2, 23.2, 24.4, 23.8, 25.4]);
    return { c, ann: [
      { k: 'h', p: 24.2, i0: 2, i1: 7, col: 'ice', t: 'open of the down-move', tpos: 'l', at: 2, say: 'The down-move starts here. Remember this open.' },
      { k: 'dot', i: 4, p: c[4].l, col: 'loss', t: 'sweep', pos: 'below', at: 4, say: 'Price runs the lows.' },
      { k: 'tag', i: 7, p: c[7].h, dy: -8, t: 'CISD ↑', col: 'signal', big: true, at: 7, say: 'A close back above that open: the CISD.' }] };
  }, cap: 'Sweep, then a close back through the open of the move. Delivery changed.', rel: ['SWEEP', 'COS', 'RB'] },
  { ab: 'RB', full: 'Rejection Block', cat: 6, def: 'The wick area of a candle where price was pushed into a zone and rejected. In Echo, the RB has to sit inside a fair value gap.', vis() {
    const c = cs([20, 22.5, 25.2, 24.4, 24.1, 25.6, 27, 28.2], { 3: { l: 22.9 } });
    const lo = c[0].h, hi = c[2].l;
    return { c, ann: [
      { k: 'band', lo, hi, i0: -0.5, i1: 3.5, col: 'ice', t: 'FVG', at: 2, say: 'The displacement leaves a gap.' },
      { k: 'band', lo: c[3].l, hi: Math.min(c[3].o, c[3].c), i0: 2.6, i1: 3.4, col: 'signal', t: 'RB', tpos: 'below', at: 3, say: 'Price wicks into the gap and gets rejected: the RB.' },
      { k: 'arrow', i: 5, p: c[5].l, dir: 'up', col: 'win', at: 5, say: 'Price leaves from it.' }] };
  }, cap: 'A rejection wick inside the gap. Higher-timeframe gaps are preferred.', rel: ['FVG', 'CISD', 'OB'] },
  { ab: 'OTE', full: 'Optimal Trade Entry', cat: 6, def: 'The deep part of a pullback: between the 0.62 and 0.79 levels of a fib drawn across a big swing. Orbit waits for price there.', vis() {
    const c = cs([10, 12, 14.5, 16, 18.5, 20.5, 18.4, 16.6, 15.4, 17.2, 19.6, 22]);
    const lo = c[0].l, hi = Math.max(...c.slice(0, 6).map((k) => k.h)), f = (r) => hi - r * (hi - lo);
    return { c, ann: [
      { k: 'h', p: hi, i0: 4, col: 'ice', t: '1', tpos: 'l', at: 5 }, { k: 'h', p: lo, i0: 0, col: 'ice', t: '0', tpos: 'l', below: true, at: 5 },
      { k: 'band', lo: f(0.79), hi: f(0.62), i0: 4.5, col: 'signal', t: 'OTE 0.62–0.79', tx: 'r', at: 5, say: 'Fib the swing. The OTE zone is the deep pullback.' },
      { k: 'dot', i: 8, p: c[8].l, col: 'signal', at: 8, say: 'Price pulls into OTE…' },
      { k: 'arrow', i: 10, p: c[10].l, dir: 'up', col: 'win', at: 10, say: '…and delivers back up.' }] };
  }, cap: 'Big swing, fib, wait for the deep pullback. You draw this fib yourself.', rel: ['RT', 'IFVG', 'LIQUIDITY'] },
  { ab: 'ES CONF', full: 'ES Confirmation', cat: 6, def: 'ES (S&P 500 futures) doing the same thing as NQ at the same time: sweeping, rejecting or shifting at its own level. A confluence that adds confidence, not a requirement.', vis() {
    const nq = cs([24, 22.6, 23, 21.2, 20.2, 22.4, 24.2]), es = cs([16, 14.8, 15.2, 13.6, 12.6, 14.6, 16.2]);
    return { c: [...nq, null, ...es], ann: [
      { k: 'tag', i: 2.5, p: 25.5, t: 'NQ', col: 'ink2', at: 0 }, { k: 'tag', i: 9.5, p: 25.5, t: 'ES', col: 'ink2', at: 0 },
      { k: 'dot', i: 3, p: nq[3].l, col: 'signal', at: 3, say: 'NQ sweeps its low…' },
      { k: 'dot', i: 10, p: es[3].l, col: 'signal', at: 10, say: '…and ES does the same at the same time.' },
      { k: 'tag', i: 12, p: es[5].h, dy: -10, t: 'confirmed', col: 'win', anchor: 'end', at: 12, say: 'Both shift up together: ES confirms.' }] };
  }, cap: 'Same story on both charts at once. Helpful, not required.', rel: ['SWEEP', 'CISD'] },

TERMS.forEach((t, i) => { t.id = 't-' + t.ab.toLowerCase().replace(/[^a-z0-9]+/g, '-'); t.i = i; t.lvl = LVL_BEGIN.includes(t.ab) ? 0 : LVL_MID.includes(t.ab) ? 1 : 2; });
const termById = (ab) => TERMS.find((t) => t.ab === ab);
function termSpec(t) { if (!t._spec && t.vis) t._spec = t.vis(); return t._spec; }

// ── View ───────────────────────────────────────────────────
const TV_ST = { q: '', cat: -1, lvl: -1, view: 'levels' };
const LESSON_NAME = (id) => (CH.find((c) => c.id === id) || {}).name;
function termCard(t) {

}
function termMatches(t) {

}
function renderTerms() {

  let html = '';
  TCATS.forEach((name, ci) => {
    const items = list.filter((t) => t.cat === ci); if (!items.length) return;
    html += `<section class="t-sec"><h2 class="t-h">${esc(name)} <span class="num">${items.length}</span></h2><div class="t-grid">${items.map(termCard).join('')}</div></section>`;
  });
  $('#t-list').innerHTML = html || `<p class="empty">No term matches “${esc(TV_ST.q)}”. Try an abbreviation like FVG or BE.</p>`;
  $$('#t-cats [data-cat]').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.cat === TV_ST.cat)));
  $$('#t-lvls [data-lvl]').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.lvl === TV_ST.lvl)));

const players = new Map();
function playTerm(card) {
  const t = TERMS[+card.dataset.term], total = termFrames(t);
  const btn = card.querySelector('[data-play]'), fig = card.querySelector('[data-vis]'), cap = card.querySelector('[data-cap]');
  if (players.has(card)) { clearInterval(players.get(card)); players.delete(card); }

  const step = t.custom ? 700 : (t.vis && termSpec(t).line ? 420 : 150);

      setTimeout(() => { fig.innerHTML = termSvg(t); cap.innerHTML = `<b>On the chart</b>${esc(termSay(t, total - 1))}`; btn.textContent = '↻ Watch again'; btn.classList.remove('primary'); }, step);

function gotoTerm(ab) {

const VIEWS = { lessons: '#lessons-view', terms: '#terms-view', courses: '#courses-view', levels: '#levels-view' };

}
// Deep links from the FLOWHUB Trading School menu: #beginner #intermediate #advanced #terms #quiz #dive-<id> #ch-<chapter>
let routing = false;
function route() {
  const h = location.hash.slice(1); routing = true;
  try {
    if (h === 'terms') setView('terms');
    else if (h === 'quiz') { setView('terms'); openQuiz(); }
    else if (['beginner', 'intermediate', 'advanced', 'exo'].includes(h)) { LV_ST.open = h; setView('levels'); }
    else if (h.startsWith('dive-')) openStep({ kind: 'dive', id: h.slice(5) });
    else if (h === 'echo-x-orbit') { LV_ST.open = 'exo'; setView('levels'); }
    else if (h.startsWith('ch-') && CH.some((c) => c.id === h.slice(3))) openStep({ kind: 'ch', id: h.slice(3) });
    else { LV_ST.open = null; setView('levels'); }

window.addEventListener('hashchange', route);

// Quiz: the chart without its labels + the definition with the term blanked out. Pick the term.
const QZ = { t: null, opts: [], picked: null, right: 0, seen: 0 };
const quizPool = () => TERMS.filter((t) => t.vis);
function blank(t, s) { let out = s; [t.ab, t.full, t.alias].filter(Boolean).forEach((w) => { out = out.split(w).join('____'); }); return out; }

  const pool = quizPool(); let t;
  do { t = pool[Math.floor(Math.random() * pool.length)]; } while (QZ.t && t === QZ.t && pool.length > 1);
  const pickFrom = pool.filter((x) => x !== t).map((x) => [x, Math.random() + (x.cat === t.cat ? 0 : 0.6)]).sort((a, b) => a[1] - b[1]).slice(0, 3).map((x) => x[0]);

  renderQuiz();
}
function renderQuiz() {
  const t = QZ.t, box = $('#t-quiz');
  const right = QZ.picked != null && QZ.opts[QZ.picked] === t;
  box.innerHTML = `<div class="card-in">
    <div class="eyebrow"><span class="hud">Quiz · name the term</span><span class="hud num">${QZ.right}/${QZ.seen} right</span></div>
    <div class="q-grid"><figure class="t-vis">${termSvg(t, undefined, QZ.picked == null)}</figure>

    <div class="opts">${QZ.opts.map((o, i) => `<button type="button" class="opt${QZ.picked != null ? (o === t ? ' right' : i === QZ.picked ? ' wrong' : '') : ''}" data-q="${i}" ${QZ.picked != null ? 'disabled' : ''}>${esc(o.ab)} <span class="t-alias">· ${esc(o.full)}</span></button>`).join('')}</div>
    ${QZ.picked != null ? `<div class="fb ${right ? 'good' : 'bad'}"><b>${right ? 'Correct' : 'Not quite'}</b>${right ? esc(t.cap) : `That was <b>${esc(t.ab)}</b>: ${esc(t.cap)}`}</div>` : ''}
    <div class="actions"><button type="button" class="btn primary" id="q-next" ${QZ.picked == null ? 'hidden' : ''}>Next term →</button><button type="button" class="btn ghost" id="q-close">Close quiz</button></div></div></div></div>`;
}
function openQuiz() { $('#t-quiz').hidden = false; QZ.right = 0; QZ.seen = 0; QZ.t = null; newQuiz(); $('#t-quiz').scrollIntoView({ behavior: 'smooth', block: 'start' }); }

// Progress is a per-device convenience only (localStorage, wrapped).
const DP = (() => { try { return JSON.parse(localStorage.getItem('fh-dives') || '{}'); } catch (e) { return {}; } })();
const dpSave = () => { try { localStorage.setItem('fh-dives', JSON.stringify(DP)); } catch (e) { /* private mode */ } if (typeof syncSoon === 'function') syncSoon(); };
const px = (closes, ov = {}, w = 1.6) => {
  const out = [];
  for (let i = 1; i < closes.length; i++) {
    const o = closes[i - 1], c = closes[i], k = i - 1;
    out.push(Object.assign({ o, c, h: Math.max(o, c) + w * (0.35 + ((k * 37) % 7) / 10), l: Math.min(o, c) - w * (0.35 + ((k * 53) % 7) / 10) }, ov[k] || {}));
  }
  return out;
};
const money = (v, o) => { const n = Math.round(Number(v) || 0); return (n < 0 ? '−' : o && o.sign && n > 0 ? '+' : '') + '$' + Math.abs(n).toLocaleString('en-US'); };
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const strong = (t) => String(t).replace(/<b>/g, '<strong>').replace(/<\/b>/g, '</strong>');
const fbHtml = (good, title, text) => `<div class="fb ${good ? 'good' : 'bad'}"><b>${esc(title)}</b>${strong(text)}</div>`;

// ── Widget: quiz ──
function wQuiz(el, done, { q, opts }) {
  const box = h('div', 'w'); el.append(box);
  const draw = (pick) => {
    box.innerHTML = `<p class="w-q">${q}</p><div class="opts">${opts.map((o, i) => `<button type="button" class="opt${pick == null ? '' : o.ok ? ' right' : i === pick ? ' wrong' : ''}" data-i="${i}" ${pick != null ? 'disabled' : ''}>${o.t}</button>`).join('')}</div>${pick == null ? '' : fbHtml(opts[pick].ok, opts[pick].ok ? 'Right' : 'Not quite', opts[pick].fb)}${pick != null && !opts[pick].ok ? '<button type="button" class="btn ghost" data-retry>Try again</button>' : ''}`;
  };
  box.addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) { const i = +b.dataset.i; draw(i); if (opts[i].ok) done(); } if (e.target.closest('[data-retry]')) draw(null); });
  draw(null);

// ── Widget: scenario player (candles form, pause, decide, see what happens) ──
function wScenario(el, done, spec) {
  const box = h('div', 'w'), fig = h('figure', 't-vis'), ui = h('div', '');
  fig.style.margin = '0'; box.append(fig, ui); el.append(box);
  let frame = -1, step = 0, timer = null;
  const last = (spec.c.length - 1);
  const draw = () => { fig.innerHTML = tSvg(spec, frame); };
  const playTo = (idx, then) => {
    clearInterval(timer); const target = 3 * idx + 2;
    ui.innerHTML = `<p class="t-cap"><b>Watching</b>${esc(spec.watch || 'Candles forming…')}</p>`;
    timer = setInterval(() => { frame++; draw(); if (frame >= target) { clearInterval(timer); then(); } }, 60);
  };
  const ask = () => {
    const st = spec.steps[step];
    if (!st) return finish();
    ui.innerHTML = `<p class="w-q">${st.q}</p><div class="opts">${st.opts.map((o, i) => `<button type="button" class="opt" data-i="${i}">${o.t}</button>`).join('')}</div>`;
  };
  const finish = () => {
    ui.innerHTML = `${fbHtml(true, 'What happened', spec.end)}<div class="actions"><button type="button" class="btn ghost" data-replay>↻ Replay</button></div>`;
    done();
  };
  ui.addEventListener('click', (e) => {
    const b = e.target.closest('[data-i]');
    if (b) {
      const st = spec.steps[step], o = st.opts[+b.dataset.i];
      ui.querySelectorAll('[data-i]').forEach((x, i) => { x.disabled = true; if (st.opts[i].ok) x.classList.add('right'); else if (x === b) x.classList.add('wrong'); });
      ui.insertAdjacentHTML('beforeend', fbHtml(o.ok, o.ok ? (o.title || 'Good call') : (o.title || 'Careful'), o.fb) + `<div class="actions"><button type="button" class="btn primary" data-next>Continue ▶</button></div>`);
      return;
    }
    if (e.target.closest('[data-next]')) { step++; const nx = spec.steps[step]; playTo(nx ? nx.at : (spec.endAt ?? last), ask); }
    if (e.target.closest('[data-replay]')) { frame = -1; step = 0; playTo(spec.steps[0].at, ask); }
  });
  // Show the intro frame, start on demand so it doesn't run off-screen
  frame = 3 * spec.steps[0].at + 2; draw(); frame = -1;
  ui.innerHTML = `<div class="actions"><button type="button" class="btn primary" data-start>▶ Play the scenario</button></div>`;
  ui.querySelector('[data-start]').addEventListener('click', () => playTo(spec.steps[0].at, ask));
}

// ── Widget: card deck (psychology) ──
function wDeck(el, done, cards) {
  const box = h('div', 'w'); el.append(box);
  let i = 0, score = 0, pick = null;
  const draw = () => {
    const c = cards[i];
    box.innerHTML = `<div class="dv-top"><span class="hud">Scenario ${i + 1} / ${cards.length}</span><span class="grow"></span><span class="hud num">${score} on-plan</span></div>

      ${pick == null ? '' : fbHtml(c.opts[pick].ok, c.opts[pick].ok ? 'On plan' : 'That’s the trap', c.opts[pick].fb) + `<div class="actions"><button type="button" class="btn primary" data-next>${i < cards.length - 1 ? 'Next scenario →' : 'See your score'}</button></div>`}`;
  };

      else { box.innerHTML = `${fbHtml(score >= cards.length - 1, `${score} of ${cards.length} on plan`, score === cards.length ? 'Every call on plan. The hard part is doing this when it’s real money and you’re down on the day.' : 'Look back at the ones you missed. Those are the moments that cost accounts. Run it again whenever you feel the pull.')}<div class="actions"><button type="button" class="btn ghost" data-again>↻ Run again</button></div>`; done(); }
    }

  });

}

// ════════ 1 · Prop Firm 101 widgets ════════
function wDrawdownLab(el, done) {
  const START = 50000, MAX = 2000;
  let model = 'intra', pts = [{ d: 0, b: START }], day = 0, seen = new Set();
  const box = h('div', 'w'); el.append(box);
  const calc = () => {
    let peak = START, eodPeak = START, prevDay = 0, fail = -1;
    const floors = pts.map((p, i) => {
      if (p.d !== prevDay) { eodPeak = Math.max(eodPeak, pts[i - 1].b); prevDay = p.d; }
      peak = Math.max(peak, p.b);
      const f = model === 'static' ? START - MAX : Math.min(START, Math.max(START - MAX, (model === 'intra' ? peak : eodPeak) - MAX));
      if (fail < 0 && p.b <= f) fail = i;
      return f;
    });
    return { floors, fail };
  };
  const draw = () => {
    const { floors, fail } = calc(), W = 620, H = 230, n = Math.max(pts.length, 10);
    const lo = START - MAX - 400, hi = Math.max(START + 1800, ...pts.map((p) => p.b + 300));
    const x = (i) => 40 + (i / (n - 1)) * (W - 60), y = (v) => 14 + ((hi - v) / (hi - lo)) * (H - 40);
    let svg = `<svg viewBox="0 0 ${W} ${H}" font-family="JetBrains Mono, monospace" font-size="11" role="img" aria-label="Balance and drawdown floor">`;
    [START - MAX, START, START + 1000].forEach((v) => { svg += `<line x1="40" x2="${W - 20}" y1="${y(v)}" y2="${y(v)}" stroke="${COL.line}"/><text x="4" y="${y(v) + 4}" fill="${COL.ink3}" font-size="9.5">${(v / 1000).toFixed(1)}K</text>`; });
    pts.forEach((p, i) => { if (i && p.d !== pts[i - 1].d) svg += `<line x1="${(x(i) + x(i - 1)) / 2}" x2="${(x(i) + x(i - 1)) / 2}" y1="10" y2="${H - 22}" stroke="${COL.line2}" stroke-dasharray="2 4"/><text x="${(x(i) + x(i - 1)) / 2 + 4}" y="${H - 8}" fill="${COL.ink3}" font-size="9.5">day ${p.d + 1}</text>`; });
    svg += `<polyline points="${floors.map((f, i) => `${x(i)},${y(f)}`).join(' ')}" fill="none" stroke="${COL.loss}" stroke-width="2" stroke-dasharray="6 3"/>`;
    svg += `<polyline points="${pts.map((p, i) => `${x(i)},${y(p.b)}`).join(' ')}" fill="none" stroke="${COL.ice}" stroke-width="2.4" stroke-linejoin="round"/>`;
    pts.forEach((p, i) => { svg += `<circle cx="${x(i)}" cy="${y(p.b)}" r="${i === fail ? 6 : 3}" fill="${i === fail ? COL.loss : COL.ice}"/>`; });
    const lf = floors[floors.length - 1];
    svg += `<text x="${W - 22}" y="${y(lf) + 14}" fill="${COL.loss}" text-anchor="end">floor ${money(lf)}</text><text x="${x(pts.length - 1) + 8}" y="${y(pts[pts.length - 1].b) - 8}" fill="${COL.ice}">${money(pts[pts.length - 1].b)}</text></svg>`;
    const names = { eod: 'EOD trailing', intra: 'Intraday trailing', static: 'Static' };
    const note = { eod: 'The floor only moves up at the end of the day, based on your closing balance.', intra: 'The floor follows your highest balance in real time, even an open trade’s best point.', static: 'The floor never moves. Simple, but usually a smaller drawdown or a pricier account.' }[model];
    const status = fail >= 0 ? fbHtml(false, 'Account failed', `Balance touched the floor at ${money(pts[fail].b)}. ${model === 'intra' ? 'The floor had trailed up with your peak, so giving back a winning day was enough to fail.' : ''}`) : `<p class="t-cap"><b>Room left</b>${money(pts[pts.length - 1].b - lf)} above the floor. ${note}</p>`;
    box.innerHTML = `<div class="seg2" role="group" aria-label="Drawdown type">${Object.entries(names).map(([k, t]) => `<button type="button" data-m="${k}" aria-pressed="${k === model}">${t}</button>`).join('')}</div>
      <figure class="t-vis" style="margin:0">${svg}</figure>${status}

const simRun = (n, wr, win, loss) => { let b = 0, peak = 0, dd = 0, streak = 0, worst = 0; const pts = [0]; for (let i = 0; i < n; i++) { const w = Math.random() < wr; b += w ? win : -loss; streak = w ? 0 : streak + 1; worst = Math.max(worst, streak); peak = Math.max(peak, b); dd = Math.max(dd, peak - b); pts.push(b); } return { pts, final: b, dd, worst }; };

  { id: 'prop', title: 'Prop Firm 101', sub: 'How evals, funded accounts and payouts work, and the rules that fail most accounts.', secs: [
    { id: 'flow', title: 'How it works', body: '<p>A prop firm lends you its capital once you prove you can follow its rules. You pay for an <b>evaluation</b>, hit the <b>profit target</b> without breaking a rule, get <b>funded</b>, then request <b>payouts</b> and keep a split of the profit.</p>', w: (el, d) => { const box = h('div', 'w'); box.innerHTML = `<figure class="t-vis sm" style="margin:0">${propFlow.draw()}</figure>`; el.append(box); wQuiz(el, d, { q: 'What actually fails an evaluation?', opts: [{ t: 'Breaking a rule, usually touching the drawdown floor', ok: true, fb: 'Yes. You can be slow to the target and still pass. You can’t touch the floor.' }, { t: 'Not hitting the target fast enough', fb: 'Most firms have no time limit now. The drawdown rule is what fails accounts.' }, { t: 'Having a losing day', fb: 'Losing days are normal. Only breaking a rule fails you.' }] }); } },
    { id: 'dd', title: 'The drawdown lab', body: '<p>The <b>drawdown floor</b> is the balance where your account fails. How it moves depends on the account type. Press <b>Load “the trap”</b>: a day that runs up $1,500, then gives it all back. Then switch the drawdown type and compare.</p>', w: (el, d) => wDrawdownLab(el, d) },
    { id: 'dll', title: 'Daily loss limit vs your daily stop', body: '<p>Some firms also have a <b>daily loss limit</b> (DLL): lose that much in one day and you’re locked out until tomorrow, or the account fails. Your FLOWHUB plan gives you a <b>daily stop</b> that sits well above it.</p>', w: (el, d) => wQuiz(el, d, { q: 'The firm’s DLL is $1,000. You’re down $700 today. A setup appears with a $400 risk. What happens if it loses?', opts: [{ t: 'You hit the DLL. Locked out (or failed) for the day.', ok: true, fb: 'Right: −$700 − $400 = −$1,100. This is why your own daily stop exists, and why it’s far tighter than the firm’s limit.' }, { t: 'Nothing, the DLL is per trade', fb: 'The DLL counts the whole day’s losses, not single trades.' }, { t: 'It only counts closed trades, so you’re fine', fb: 'Many firms count open losses too. Never plan around the edge of a limit.' }] }) },
    { id: 'cons', title: 'The consistency rule', body: '<p>Many firms require that no single day makes up more than a set share of your total profit, so one lucky day can’t pass an account. Your account’s exact percentage is in FLOWHUB. Fix the example below until it passes.</p>', w: (el, d) => wConsistency(el, d) },

const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function svgPt(svg, e) { const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal; return { x: (e.clientX - r.left) / r.width * vb.width, y: (e.clientY - r.top) / r.height * vb.height }; }

  return { idx: (x) => Math.floor((x - TPAD.l) / bw), price: (y) => hi - ((y - TPAD.t) / (H - TPAD.t - TPAD.b)) * (hi - lo) };
}
// Annotations listed with at: 1e9 stay hidden (and keep the price scale stable) until revealed.

// ── Fib / OTE: tap the swing low and swing high, see the retracement, then tap the OTE zone ──
// o: { spec, upto, lowI, highI, dir: 'long' } — long: anchor low → high, OTE = 62–79% retracement down from the high.
function wFib(el, done, o) {
  const box = h('div', 'w'), fig = h('figure', 't-vis'), q = h('p', 'w-q'), out = h('div', '');
  fig.style.margin = '0'; fig.style.cursor = 'crosshair'; box.append(q, fig, out); el.append(box);
  const c = o.spec.c, lowP = c[o.lowI].l, highP = c[o.highI].h, rng = highP - lowP, lvl = (r) => highP - r * rng;
  let step = 0; // 0 tap low, 1 tap high, 2 tap OTE, 3 done
  const fibAnn = () => [
    { k: 'band', lo: lvl(0.79), hi: lvl(0.62), col: 'signal', t: 'OTE', fill: 0.16, i0: o.lowI, tx: 'r' },
    ...[[0, 'ice'], [0.5, 'ink2'], [0.62, 'signal'], [0.79, 'signal'], [1, 'ice']].map(([r, col]) => ({ k: 'h', p: lvl(r), col, i0: o.lowI, t: `${r}`, tpos: 'l', dash: '3 3', w: 1 })),
  ];

  const base = { ...o.spec, ann: [...(o.spec.ann || []), ...fibAnn().map((a) => ({ ...a, at: HIDE }))] };
  const paint = (s) => { fig.innerHTML = tSvg({ ...s, range: [lowP - rng * 0.15, highP + rng * 0.25] }); };
  const prompt = ['Tap the candle that made the <b>swing low</b> (where the move started).', 'Now tap the candle that made the <b>swing high</b>.', 'The fib is drawn. Tap inside the zone where Orbit looks for its entry.'];
  const draw = (msg) => {
    q.innerHTML = prompt[Math.min(step, 2)];
    if (step < 2) paint(show(o.upto, step === 1 ? [{ k: 'dot', i: o.lowI, p: lowP, col: 'ice' }] : []));
    else paint(show(o.upto, fibAnn()));
    out.innerHTML = msg || '';
  };
  fig.addEventListener('click', (e) => {
    if (step > 2) return; const svg = fig.querySelector('svg'); if (!svg) return;
    const p = svgPt(svg, e), m = chartMap({ ...base, c: c.slice(0, o.upto), slots: o.spec.slots || c.length, range: [lowP - rng * 0.15, highP + rng * 0.25] }), i = m.idx(p.x), price = m.price(p.y);
    if (step === 0) { if (i === o.lowI) { step = 1; draw(fbHtml(true, 'Swing low', `Anchor 1 at ${fmt(lowP)}.`)); } else draw(fbHtml(false, 'Not that one', 'Find the lowest point the whole move started from.')); }
    else if (step === 1) { if (i === o.highI) { step = 2; draw(fbHtml(true, 'Swing high', `Anchor 2 at ${fmt(highP)}. Range: ${fmt(rng)} points.`)); } else draw(fbHtml(false, 'Not that one', 'Find the highest point the move reached before pulling back.')); }
    else if (step === 2) {
      if (price <= lvl(0.62) && price >= lvl(0.79)) { step = 3; fig.style.cursor = 'default'; paint(show(c.length, fibAnn())); out.innerHTML = fbHtml(true, 'The OTE zone', o.ok || 'Deep in the pullback, between the 62% and 79% levels. Price pulled into it and turned.'); done(); }
      else draw(fbHtml(false, price > lvl(0.62) ? 'Too shallow' : 'Too deep', price > lvl(0.62) ? 'That’s above the zone. Orbit wants a deep pullback, between the 0.62 and 0.79 lines.' : 'That’s below the zone, close to where the idea fails.'));

    if (orbitA > 0) {
      for (let k = 0; k < 4; k++) { const ph = ((t * 0.55 + k / 4) % 1); const r = 12 + ph * Math.min(w, hh * 2.2) * 0.42; ctx.strokeStyle = alpha(k % 2 ? COL.ice : COL.signal, (1 - ph) * 0.55 * orbitA); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(cx, cy, r, r * 0.62, 0, 0, Math.PI * 2); ctx.stroke(); }

      ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.18);
      ctx.setLineDash([3, 6]); ctx.strokeStyle = alpha(COL.ice, 0.35 * orbitA); ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);

      ctx.restore();

    const pulse = (0.6 + 0.4 * Math.sin(t * 3.4)) * Math.max(orbitA, u > 5.9 && u < 6.9 ? 1 : 0.25), R = 26 * flare, gc = ctx.createRadialGradient(cx, cy, 0, cx, cy, R); gc.addColorStop(0, alpha(COL.ice, 0.85 * pulse)); gc.addColorStop(1, alpha(COL.ice, 0)); ctx.fillStyle = gc; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();

      const x0 = w * 0.16, x1 = w * 0.84, yLo = hh * 0.74, yHi = hh * 0.3, X = (i) => x0 + (i + 0.5) * ((x1 - x0) / n), Y = (p) => yLo - p * (yLo - yHi), cw = Math.max(4, Math.min(14, ((x1 - x0) / n) * 0.55));

function scene(el, done, S) {

  const ro = new ResizeObserver(() => { sz = fit(); }); ro.observe(wrap);
  const C = S.c, lo = Math.min(...C.map((k) => k.l), ...(S.extra || [])), hi = Math.max(...C.map((k) => k.h), ...(S.extra || [])), pad = (hi - lo) * 0.12;
  const map = () => { const { w, h: hh } = sz, L = 10, Rm = 66, T = 16, B = 18, bw = (w - L - Rm) / (S.slots || C.length); return { w, hh, bw, x: (i) => L + (i + 0.5) * bw, y: (p) => T + ((hi + pad - p) / (hi - lo + 2 * pad)) * (hh - T - B), R: w - Rm }; };
  const tab = (x, y, txt, col, up) => { ctx.font = '600 10px JetBrains Mono, monospace'; const tw = ctx.measureText(txt).width + 10; const yy = up ? y - 18 : y + 4; ctx.fillStyle = alpha(COL.ink, 0.1); ctx.fillRect(x, yy, tw, 14); ctx.strokeStyle = alpha(COL.ink2, 0.5); ctx.strokeRect(x + 0.5, yy + 0.5, tw - 1, 13); ctx.fillStyle = col; ctx.fillText(txt, x + 5, yy + 10.5); };

    if (!wrap.isConnected) { cancelAnimationFrame(raf); ro.disconnect(); return; }
    const m = map(); api.t = Math.max(0, now - t0) / 1000; api.m = m;
    if (shown < target && now - last > (RM() ? 0 : 95)) { shown = RM() ? target : shown + 1; last = now; }
    ctx.clearRect(0, 0, m.w, m.hh);
    ctx.strokeStyle = alpha(COL.ink2, 0.08); for (let g = 1; g < 5; g++) { const y = (m.hh * g) / 5; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(m.w, y); ctx.stroke(); }
    for (let k = 0; k <= ph; k++) if (S.phases[k].under) S.phases[k].under(api, shown, k === ph);
    const cw = Math.max(2, Math.min(12, m.bw * 0.62));

    for (let k = 0; k <= ph; k++) if (S.phases[k].over) S.phases[k].over(api, shown, k === ph);
    if (shown >= target && ph >= 0 && !ui.dataset.ready) { ui.dataset.ready = '1'; buttons(); }
    raf = requestAnimationFrame(frame);
  };

}
const rings = (api, x, y, t, col, n = 3) => { const { ctx } = api; for (let k = 0; k < n; k++) { const ph = (t * 0.7 + k / n) % 1; ctx.strokeStyle = api.alpha(col, (1 - ph) * 0.7); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, 4 + ph * 46, 0, Math.PI * 2); ctx.stroke(); } };
