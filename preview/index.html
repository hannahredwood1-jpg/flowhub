/* Animated perspective grid behind the whole app */
.grid-bg {
    position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background-image:

.hud {
    position: relative;

  }
.hud::before, .hud::after {

    border-color: var(--color-ice-dim); border-style: solid;
  }
.hud::before { top: 5px; left: 5px; border-width: 1px 0 0 1px; }

.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;

.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { position: relative; overflow: hidden; border-color: var(--color-ice-dim); background: linear-gradient(180deg, #131c28, #0d131c); color: #f2f6fb; }
.btn-primary::after { /* the orange edge */

  }

    content: ""; position: absolute; inset: 0; width: 40%;

  }

.field {
