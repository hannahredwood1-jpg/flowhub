<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#030405">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23030405'/%3E%3Ctext x='16' y='25' font-family='Arial Black,Arial' font-weight='900' font-size='24' text-anchor='middle' fill='%23ff6a00'%3EF%3C/text%3E%3C/svg%3E">
<title>Practice · FLOWHUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,100..125,700..900;1,100..125,700..900&family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: FLOWHUB top bar → stats strip (reps, accuracy, today's reps) → one stage that swaps between the home grid and a drill. Single dark theme, same tokens as the app. */
:root{
  color-scheme:dark;
  --void:#030405; --abyss:#07090c; --panel:#0a0d12; --panel2:#0e1219;
  --line:#1a2029; --line2:#28313e;
  --ink:#e6ebf2; --ink2:#929fb2; --ink3:#5f6a78;
  --ice:#9ccbff; --icedim:#3b5f86; --signal:#ff6a00;
  --win:#3ee0a1; --loss:#ff4f6d; --lag:#b69cff; --gold:#f2c14e;
  --f-display:"Archivo","Arial Black","Helvetica Neue",system-ui,sans-serif;
  --f-hud:"Orbitron","Eurostile",system-ui,sans-serif;
  --f-body:"Rajdhani","Barlow Semi Condensed",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--void);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;font-weight:500;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:1px solid var(--ice);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hud{font-family:var(--f-hud);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* top bar */
.top{border-bottom:1px solid var(--line);background:var(--abyss)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:58px;flex-wrap:wrap;padding-block:8px}
.logo{font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:-.01em;line-height:1}
.logo b{color:var(--signal)}
.by{display:block;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:8.5px;letter-spacing:.14em;color:var(--ink3);margin-top:2px}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav span{position:relative;padding:8px 10px;font-family:var(--f-hud);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.nav span[aria-current]{color:var(--ink)}
.nav span[aria-current]::after{content:"";position:absolute;left:10px;right:10px;bottom:-4px;height:2px;background:linear-gradient(90deg,var(--signal) 8px,var(--ice) 8px)}
.nav .new{color:var(--signal);font-size:8px;margin-left:4px}
.preview-tag{margin-left:auto;font-family:var(--f-hud);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--lag);border:1px solid #4d3f7a;padding:4px 8px}

/* HUD */
.hudbar{border-bottom:1px solid var(--line)}
.hudbar .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);padding:0;margin-block:0}
.stat{background:var(--void);padding:12px 16px;display:grid;gap:4px;min-width:0}
.stat .v{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v small{font-size:12px;color:var(--ink3)}
.meter{height:4px;background:var(--line);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--ice)}
.meter.sig i{background:var(--signal)}
.flame{color:var(--signal)}

main{padding-block:22px 60px}
.h1{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,4vw,38px);letter-spacing:-.01em;line-height:1.05;margin:0;text-wrap:balance}
.h1 em{font-style:italic;font-weight:800;color:var(--signal)}
.lede{color:var(--ink2);max-width:62ch;margin:8px 0 0}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-hud);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);margin:0;font-weight:500}

/* daily reps hero */
.daily{border:1px solid var(--line2);background:linear-gradient(180deg,var(--panel2),var(--abyss));padding:20px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;margin-top:20px}
.daily .pips{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap}
.daily .pip{width:26px;height:8px;background:var(--line2)}
.daily .pip.ok{background:var(--win)}.daily .pip.miss{background:var(--loss)}
.daily p{margin:6px 0 0;color:var(--ink2);max-width:60ch}
@media (max-width:640px){.daily{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 16px;border:1px solid var(--line2);background:var(--panel2);font-family:var(--f-hud);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--icedim)}
.btn.primary{border-color:var(--ice);color:var(--ice);background:rgb(156 203 255 / .08);box-shadow:inset 0 -2px 0 var(--signal)}
.btn.big{min-height:48px;padding:0 22px;font-size:11px}
.btn.ghost{background:transparent;color:var(--ink2)}
.btn.on{border-color:var(--signal);color:var(--signal)}

/* drill grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{border:1px solid var(--line);background:var(--panel);padding:16px;display:grid;gap:8px;text-align:left;align-content:start;min-width:0}
button.card:hover{border-color:var(--icedim);background:var(--panel2)}
.card h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.005em}
.card p{margin:0;color:var(--ink2);font-size:15px}
.card .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-family:var(--f-hud);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ice);border:1px solid var(--icedim);padding:3px 6px;white-space:nowrap}
.chip.sig{color:var(--signal);border-color:#6b3510}
.chip.win{color:var(--win);border-color:#1d6b4f}
.chip.loss{color:var(--loss);border-color:#7a2636}
.chip.lag{color:var(--lag);border-color:#4d3f7a}
.chip.dim{color:var(--ink3);border-color:var(--line2)}
.card.lab{border-color:#6b3510;background:linear-gradient(180deg,rgb(255 106 0 / .07),var(--panel))}
.card.locked{opacity:.6}

/* mastery */
.mastery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.m{border:1px solid var(--line);background:var(--panel);padding:14px;display:grid;gap:8px}
.m .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.m .t b{font-family:var(--f-display);font-weight:800;font-size:16px}
.tier{font-family:var(--f-hud);font-size:9px;letter-spacing:.16em;text-transform:uppercase;padding:3px 7px;border:1px solid}
.tier.none{color:var(--ink3);border-color:var(--line2)}
.tier.bronze{color:#d39a6a;border-color:#6e4a2c}
.tier.silver{color:#cfd8e3;border-color:#5b6573}
.tier.gold{color:var(--gold);border-color:#7a6224}
.tier.elite{color:var(--lag);border-color:#4d3f7a}
.m .sub{display:flex;justify-content:space-between;color:var(--ink3);font-size:13px}

/* coach */
.coach{border:1px dashed var(--line2);padding:16px;display:grid;gap:14px}
.coach table{width:100%;border-collapse:collapse;font-size:15px}
.coach td,.coach th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.coach th{font-family:var(--f-hud);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.bar{height:6px;background:var(--line);min-width:80px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0}
.tblwrap{overflow-x:auto}

/* stage */
.stage-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.stage-head .t{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:-.01em}
.crumbs{margin-left:auto;display:flex;gap:8px;align-items:center}
.drill{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px}
@media (max-width:880px){.drill{grid-template-columns:1fr}}
.chartbox{border:1px solid var(--line);background:var(--abyss);min-width:0;display:flex;flex-direction:column}
.chart-top{display:flex;gap:6px;align-items:center;padding:7px 9px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sym{font-family:var(--f-mono);font-size:13px;padding:3px 8px;border:1px solid var(--line2);background:var(--panel)}
.cv{width:100%;height:380px;display:block;touch-action:manipulation}
@media (max-width:640px){.cv{height:300px}}
.chart-foot{display:flex;gap:6px;align-items:center;padding:8px 9px;border-top:1px solid var(--line);flex-wrap:wrap}
.side{border:1px solid var(--line);background:var(--panel);padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.side .task{font-size:17px;line-height:1.4}
.side .task b{color:var(--ink)}
.side .hint{color:var(--ink2);font-size:15px}
.opts{display:grid;gap:6px}
.opt{border:1px solid var(--line2);background:var(--panel2);padding:10px 12px;text-align:left;font-size:16px;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--icedim)}
.opt.right{border-color:var(--win);color:var(--win)}
.opt.wrong{border-color:var(--loss);color:var(--loss)}
.fb{border-left:2px solid var(--line2);padding:8px 0 8px 12px;display:grid;gap:6px;font-size:15.5px}
.fb.good{border-color:var(--win)} .fb.bad{border-color:var(--loss)}
.fb .v{font-family:var(--f-hud);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.fb.good .v{color:var(--win)} .fb.bad .v{color:var(--loss)}
.fb ul{margin:0;padding-left:18px;display:grid;gap:4px}
.fb li.ok::marker{color:var(--win)} .fb li.no::marker{color:var(--loss)}
.xpfloat{font-family:var(--f-mono);color:var(--signal);font-size:13px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{border:1px solid var(--line2);background:var(--panel2);padding:7px 10px;font-family:var(--f-hud);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;display:flex;gap:6px;align-items:center}
.tool .sw{width:10px;height:2px}
.tool.active{border-color:var(--ice);color:var(--ice)}
.tool .pv{font-family:var(--f-mono);font-size:11px;letter-spacing:0;color:var(--ink2);text-transform:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.kv dt{color:var(--ink3)} .kv dd{margin:0;font-family:var(--f-mono);font-size:13.5px;align-self:center}

/* ticket */
.ticket{border:1px solid var(--line2);background:var(--panel2);display:grid;gap:10px;padding:14px}
.ticket .r{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center}
.ticket label{font-family:var(--f-hud);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.seg{display:flex;border:1px solid var(--line2)}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;font-family:var(--f-hud);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:rgb(156 203 255 / .1);color:var(--ice)}
.seg.side-seg button.on.buy{background:rgb(62 224 161 / .12);color:var(--win)}
.seg.side-seg button.on.sell{background:rgb(255 79 109 / .12);color:var(--loss)}
input.in{width:100%;background:var(--abyss);border:1px solid var(--line2);color:var(--ink);font-family:var(--f-mono);font-size:15px;padding:8px 10px;min-width:0}
input.in:focus{border-color:var(--ice);outline:none}
.sigcard{border:1px solid #6b3510;background:rgb(255 106 0 / .06);padding:12px;display:grid;gap:6px}
.sigcard .hd{font-family:var(--f-hud);font-size:10px;letter-spacing:.16em;color:var(--signal)}

/* big question (size/clock/speed) */
.qbox{border:1px solid var(--line);background:var(--panel);padding:22px;display:grid;gap:16px;max-width:760px}
.qbox .q{font-size:22px;line-height:1.35;font-weight:600;text-wrap:balance}
.qbox .q .num{color:var(--ice)}
.clockface{font-family:var(--f-mono);font-size:44px;color:var(--ink);line-height:1}
.ansrow{display:flex;gap:8px;flex-wrap:wrap}
.timer{height:4px;background:var(--line);position:relative}
.timer i{position:absolute;inset:0 auto 0 0;background:var(--signal);transition:width .2s linear}
.mini{width:100%;max-width:420px;height:200px;display:block;background:var(--abyss);border:1px solid var(--line)}
.speedgrid{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:16px;align-items:center}
@media (max-width:700px){.speedgrid{grid-template-columns:1fr}}
.score{font-family:var(--f-mono);font-size:30px}

/* lab summary */
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sum{border:1px solid var(--line);background:var(--panel);padding:16px;display:grid;gap:6px}
.sum .v{font-family:var(--f-mono);font-size:28px}
.pos{color:var(--win)} .neg{color:var(--loss)}
.labhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid #6b3510;background:rgb(255 106 0 / .06);padding:10px 12px;margin-bottom:12px}
.labhead b{font-family:var(--f-display);font-weight:800}
.ctx{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--signal);padding:10px 16px;font-family:var(--f-hud);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);z-index:5}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.3}to{transform:none;opacity:1}}}
body{margin:0}
.fh-nav{display:flex;gap:2px;flex-wrap:wrap}
.fh-nav a{position:relative;padding:8px 10px;font-family:var(--f-hud);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);text-decoration:none}
.fh-nav a:hover{color:var(--ink2)}
.fh-nav a[aria-current]{color:var(--ink)}
.fh-nav a[aria-current]::after{content:"";position:absolute;left:10px;right:10px;bottom:-4px;height:2px;background:linear-gradient(90deg,var(--signal) 8px,var(--ice) 8px)}
</style>
</head><body>

<header class="top"><div class="wrap">
  <div><div class="logo">FLOW<b>HUB</b></div><span class="by">BY FLOWMTD TRADING</span></div>
  <!--FH_NAV-->
</div></header>

<div class="hudbar"><div class="wrap" id="hud"></div></div>
<main class="wrap" id="stage"></main>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
// ───────────────────────── utils ─────────────────────────
const $ = (s, r = document) => r.querySelector(s);
const R = (a, b) => a + Math.random() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const qt = (p) => Math.round(p * 4) / 4;
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = (p) => p.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pts = (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2) + " pts";
const usd = (v) => (v >= 0 ? "+$" : "−$") + Math.abs(Math.round(v)).toLocaleString("en-US");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const PV = { NQ: 20, MNQ: 2 };
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (el.hidden = true), 1800); }
function timeLabel(min) { min = ((min % 1440) + 1440) % 1440; let h = Math.floor(min / 60), m = min % 60; const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${String(m).padStart(2, "0")} ${ap}`; }

const MODELS = { dl: "Extended Learning", hl: "H/L", po3: "PO3 · New York", asia: "PO3 · Asia", exo: "ECHO X ORBIT" };
const DRILLS = {
  mark: { name: "Mark the trade", desc: "Place entry, stop and target on a live NQ setup. Graded line by line." },
  replay: { name: "Replay & decide", desc: "The session plays candle by candle. At each pause: take it, wait, or skip." },
  levels: { name: "Draw the levels", desc: "Mark the pre-market range or the Asia range yourself, then see the real lines." },
  ticket: { name: "Order ticket", desc: "A signal fires. Fill the order panel: side, order type, size, stop, target." },
  size: { name: "Size it", desc: "Account, risk and stop. How many NQ or MNQ? Until it's automatic." },
  clock: { name: "Session clock", desc: "Is this a valid time to trade your model? Quick-fire timing reps." },
  speed: { name: "Speed round", desc: "45 seconds. Spot real gaps and real flips as fast as you can." },
  limit: { name: "Set the limit", desc: "Extended Learning: price is coming to a level. Limit or wait for confirmation? Then place it, manage it, see it play out." },
  echo: { name: "Mark the Echo", desc: "Find the CISD and the rejection block inside the FVG, then decide if the draw makes it a trade." },
  orbit: { name: "Draw the Orbit", desc: "Anchor the fib on the big swing, find the OTE zone, then spot the inversion on the leg in." },
  draw: { name: "Valid draw?", desc: "Stop vs. distance to liquidity. Is it at least 2× the stop? Quick-fire." },
};
const TAGS = {
  "early-entry": "Enters before the flip closes",
  "traded-range": "Trades while the range is still building",
  "sold-the-trap": "Trades the fake move (the sweep) as if it's real",
  "counter-trend": "Takes setups against the 4H trend",
  "forced-trade": "Forces a trade on a no-sweep day",
  "stop-inside": "Stop inside the swept wick",
  "stop-wide": "Stop far wider than needed",
  "wrong-target": "Target not at the draw",
  "entry-off": "Entry not at the flip close",
  "wrong-side": "Stop on the wrong side of entry",
  "level-off": "Marks levels at closes, not wicks",
  "window": "Uses candles outside the session window",
  "oversize": "Sizes too big for the risk",
  "order-type": "Wrong order type for the entry",
  "timing": "Trades outside the model's hours",
  "fvg-read": "Misreads fair value gaps",
  "flip-read": "Counts a wick as a flip",
  "missed-setup": "Skips valid A+ setups",
  "limit-no-lrl": "Sets limits without LRL and a short-term low",
  "limit-news": "Sets limits into the open or news",
  "entry-zone": "Limit outside the posted level",
  "stop-50": "Stop not at 50 ticks",
  "be-missed": "Doesn't move the stop to breakeven at 1:1",
  "cisd-read": "Misreads the CISD",
  "rb-read": "Marks the rejection block outside the FVG",
  "fib-anchor": "Anchors the fib on the wrong swing",
  "ote-read": "Enters outside the OTE zone",
  "inv-read": "Misses the inversion on the leg in",
  "draw-invalid": "Takes trades without a 2× draw",
};

// ───────────────────────── state ─────────────────────────
const KEY = "fh-practice-preview-v1";
const LIVE = /^https?:$/.test(location.protocol);
let S = blank();
// Drills unlock with the Trading School: basics always, model drills after the Intermediate exam, ECHO X ORBIT drills with its section.
const GATE = { adv: !LIVE, exo: !LIVE };
const BASIC = ["ticket", "size", "clock", "speedq"], ADV = ["mark", "replay", "levels", "speed", "limit"], EXO = ["echo", "orbit", "draw"];
const drillOpen = (d) => BASIC.includes(d) || (ADV.includes(d) && GATE.adv) || (EXO.includes(d) && GATE.exo);
async function loadGate() {
  if (!LIVE) return;
  try {
    const r = await fetch("/api/school"); if (!r.ok) return; const j = await r.json(); const st = j.state || {}, ex = st.ex || {}, un = j.unlocks || [];

    const c1 = bar(b0, b0 + 4, b0 + 6, b0 - 1); const gapTop = yes ? c1.h + qt(R(2.5, 6)) : c1.h - qt(R(0.5, 2.5));
    const c2 = bar(c1.c, gapTop + 9, gapTop + 10, c1.c - 0.5); const c3 = bar(c2.c, c2.c + 3, c2.c + 5, gapTop);
    bars.push(bar(b0 - 3, b0, b0 + 1, b0 - 4), c1, c2, c3, bar(c3.c, c3.c + 2, c3.c + 3, c3.c - 1));
    let sc = { bars, B: b0 + 10, k: {} }; if (!bull) { sc = mirror({ ...sc, k: {}, zones: [] }); }
    return { kind: "fvg", bars: sc.bars, yes, q: `Is there a ${bull ? "bullish" : "bearish"} fair value gap between candles 2–4?`, why: yes ? "Candle 2 and candle 4 don't overlap: the empty space is the gap." : "Candle 2 and candle 4 overlap, so there's no gap." };
  }
  const yes = Math.random() < 0.5; const top = qt(R(24400, 24800)); const bars = [bar(top + 2, top - 6, top + 3, top - 7), bar(top - 6, top - 9, top - 4, top - 11), bar(top - 9, top - 7, top - 5, top - 10)];
  const c = yes ? top + qt(R(1, 3)) : top - qt(R(1, 3)); bars.push(bar(top - 7, c, yes ? c + 1 : top + qt(R(1.5, 4)), top - 8));
  return { kind: "flip", bars, zone: { a: top - 4, b: top }, yes, q: "Did the last candle flip the gap (iFVG)?", why: yes ? "It CLOSED above the top of the gap. The close is what counts." : "Only the wick went through. It closed back inside, so no flip yet." };
}

      <div class="opts">${qs.map(([id, t, h]) => `<div style="display:grid;gap:4px"><div style="font-weight:700">${t}</div><div class="hint" style="font-size:13.5px">${h}</div><div class="seg" data-c="${id}"><button type="button" data-v="1" class="${checks[id] === true ? "on" : ""}">Yes</button><button type="button" data-v="0" class="${checks[id] === false ? "on" : ""}">No</button></div></div>`).join("")}</div>
      <div class="ansrow"><button class="btn primary" data-dec="limit" ${Object.values(checks).includes(null) ? "disabled" : ""}>Set a limit</button><button class="btn" data-dec="wait" ${Object.values(checks).includes(null) ? "disabled" : ""}>Wait for confirmation</button></div>`;
    document.querySelectorAll("[data-c] button").forEach((b) => (b.onclick = () => { checks[b.parentElement.dataset.c] = b.dataset.v === "1"; paintCheck(); }));
    document.querySelectorAll("[data-dec]").forEach((b) => (b.onclick = () => decide(b.dataset.dec)));
  }
  paintCheck();
  const tags = []; let score = { checks: 0, dec: false, place: null, be: null };
  function decide(dec) {
    const items = qs.map(([id, t]) => { const ok = checks[id] === truth[id]; if (ok) score.checks++; return [ok, `${t}: ${truth[id] ? "yes" : "no"}.${ok ? "" : id === "lrl" ? (truth.lrl ? " Price stepped down slowly, low after low." : " The move was one fast push, not a slow staircase.") : id === "stl" ? (truth.stl ? ` The swing at ${fmt(k.stlP)} is it.` : " Price ran straight into the level with no swing before it.") : (truth.time ? "" : " 8:30 news is right here. No limits into news.")}`]; });
    score.dec = (dec === "limit") === k.okLimit;
    if (!score.dec) tags.push(k.okLimit ? "missed-setup" : k.news ? "limit-news" : "limit-no-lrl");
    const verdict = k.okLimit ? "All three line up → a limit at the level is allowed." : "Not everything lines up → wait for confirmation: a reaction within ~50 ticks, then an IFVG or change of structure, a retrace, and entry at the first PD-array.";
    $("#side").innerHTML = fbBox(score.dec, score.dec ? (dec === "limit" ? "Right: set the limit" : "Right: wait") : (dec === "limit" ? "Not a limit day" : "This one could be limited"), items, `<div>${verdict}</div>`) + (k.okLimit ? `<button class="btn primary" id="go">Place the limit →</button>` : `<button class="btn primary" id="go">▶ See what happened</button>`);
    $("#go").onclick = k.okLimit ? place : showNoLimit;
  }
  function showNoLimit() {
    $("#go").disabled = true; let n = ch.shown; const h = setInterval(() => { n++; ch.shown = n; ch.draw(); if (n >= sc.bars.length) { clearInterval(h); end(`Price ran ${long ? "through" : "above"} the level to ${fmt(k.flushLow)}. A limit with a 50-tick stop would have been stopped out. ${k.news ? "That's the news spike. " : ""}Confirmation keeps you out of this, and if price reacts and flips, you get a cleaner entry after it.`); } }, 70); timers.push(h);
  }
  function place() {
    const placed = { entry: null, stop: null, target: null }; let tool = "entry"; const colors = { entry: css("--ice"), stop: css("--loss"), target: css("--win") };
    const redraw = () => { base(); for (const t of ["entry", "stop", "target"]) if (placed[t] != null) ch.lines.push({ p: placed[t], color: colors[t], label: t.toUpperCase(), w: 1.8 }); ch.draw(); paint(); };
    function paint() {
      $("#side").innerHTML = `<div class="task"><b>Place the limit order</b> on the chart: entry, stop, first target.</div><div class="hint">Entry inside the posted level · stop 50 ticks (12.5 pts) · first target: session liquidity.</div>
        <div class="tools">${["entry", "stop", "target"].map((t) => `<button class="tool ${tool === t ? "active" : ""}" data-t="${t}"><span class="sw" style="background:${colors[t]}"></span>${t}<span class="pv">${placed[t] != null ? fmt(placed[t]) : "—"}</span></button>`).join("")}</div>
        <button class="btn primary" id="check" ${placed.entry != null && placed.stop != null && placed.target != null ? "" : "disabled"}>Send the order</button>`;
      document.querySelectorAll("[data-t]").forEach((b) => (b.onclick = () => { tool = b.dataset.t; paint(); }));
      $("#check").onclick = () => grade(placed);
    }
    ch.onTap = ({ price }) => { placed[tool] = price; const nx = ["entry", "stop", "target"].find((t) => placed[t] == null); if (nx) tool = nx; redraw(); };
    redraw();
  }
  function grade(pl) {
    ch.onTap = null; const items = []; const lo = Math.min(k.zLo, k.zHi), hi = Math.max(k.zLo, k.zHi);
    const eOk = pl.entry >= lo && pl.entry <= hi; items.push([eOk, eOk ? `Entry ${fmt(pl.entry)}: inside the level.` : `Entry ${fmt(pl.entry)} is outside the posted level (${lvlTxt}). The limit goes at the level.`]); if (!eOk) tags.push("entry-zone");
    const want = qt(pl.entry - sg * 12.5); const sOk = Math.abs(pl.stop - want) <= 0.75;
    items.push([sOk, sOk ? `Stop ${fmt(pl.stop)}: 50 ticks from entry. Past that, the level is invalid.` : sg * (pl.entry - pl.stop) <= 0 ? `Stop ${fmt(pl.stop)} is on the wrong side of entry.` : `Stop ${fmt(pl.stop)} is ${(sg * (pl.entry - pl.stop) * 4).toFixed(0)} ticks away. The rule is 50 ticks: ${fmt(want)}.`]); if (!sOk) tags.push(sg * (pl.entry - pl.stop) <= 0 ? "wrong-side" : "stop-50");
    const tOk = Math.abs(pl.target - k.tgt) <= 2; items.push([tOk, tOk ? `Target ${fmt(pl.target)}: the Asia ${long ? "high" : "low"}, session liquidity.` : `First target: the Asia ${long ? "high" : "low"} at ${fmt(k.tgt)}, the nearest session liquidity.`]); if (!tOk) tags.push("wrong-target");
    score.place = eOk && sOk && tOk;
    const E = eOk ? pl.entry : qt((lo + hi) / 2), SL = qt(E - sg * 12.5), risk = 12.5, rew = Math.abs(k.tgt - E);
    base(); ch.lines.push({ p: E, color: css("--ice"), label: `LIMIT ${fmt(E)}`, w: 1.8 }, { p: SL, color: css("--loss"), label: "STOP −50 TICKS", w: 1.8 }, { p: k.tgt, color: css("--win"), label: "TARGET", w: 1.8 }); ch.draw();
    $("#side").innerHTML = fbBox(score.place, score.place ? "Order placed right" : "Order corrected", items, `<dl class="kv"><dt>Risk</dt><dd>12.5 pts · $250 / NQ · $25 / MNQ</dd><dt>Reward</dt><dd>${rew.toFixed(2)} pts · ${(rew / risk).toFixed(1)}R</dd></dl>${eOk ? "" : `<div class="hint">Playing it out from the middle of the level, ${fmt(E)}.</div>`}`) + `<button class="btn primary" id="go">▶ Play</button>`;
    $("#go").onclick = () => run(E, SL);
  }
  function run(E, SL) {
    $("#go").disabled = true; const after = sc.bars.slice(k.decI + 1); const fillJ = after.findIndex((b) => (long ? b.l <= E : b.h >= E));
    if (fillJ < 0) { playTo(sc.bars.length, () => end(`Price turned at ${fmt(k.soupLow)} without reaching your ${fmt(E)} limit, so no fill. Deeper in the level is safer but can miss the trade.`)); return; }
    const beJ = after.findIndex((b, j) => j >= fillJ && (long ? b.h >= E + 12.5 : b.l <= E - 12.5));
    playTo(k.decI + 1 + beJ + 1, () => {
      $("#side").innerHTML = `<div class="hud" style="color:var(--win)">Filled at ${fmt(E)} · turtle soup into the level</div><div class="task">Price is now <b>50 ticks in your favor (1:1)</b>. What do you do?</div><div class="opts"><button class="opt" data-b="be">Move the stop to breakeven</button><button class="opt" data-b="tp">Close the whole trade now</button><button class="opt" data-b="no">Leave everything as is</button></div>`;
      document.querySelectorAll("[data-b]").forEach((b) => (b.onclick = () => {
        score.be = b.dataset.b === "be"; if (!score.be) tags.push("be-missed");
        document.querySelectorAll("[data-b]").forEach((x) => { x.disabled = true; if (x.dataset.b === "be") x.classList.add("right"); }); if (!score.be) b.classList.add("wrong");
        const why = score.be ? "Right. At 1:1 the stop goes to breakeven: worst case is now $0." : b.dataset.b === "tp" ? "That cuts a winner at 1R. The rule is breakeven at 1:1, then let it deliver to the target." : "Leaving the full stop risks a winner turning into a full loss. Breakeven at 1:1.";
        $("#side").insertAdjacentHTML("beforeend", fbBox(score.be, score.be ? "Managed right" : "Not the rule", [], `<div>${why}</div>`));
        ch.lines = ch.lines.map((l) => (l.label === "STOP −50 TICKS" ? { ...l, p: E, label: "STOP · BREAKEVEN" } : l)); ch.draw();
        playTo(sc.bars.length, () => end(`Target hit: ${pts(sg * (k.tgt - E))} from a 12.5-point stop · ${usd(sg * (k.tgt - E) * 20)} on 1 NQ, ${usd(sg * (k.tgt - E) * 2)} on 1 MNQ.`));
      }));
    });
  }
  function playTo(to, then) { let n = ch.shown; const h = setInterval(() => { n++; ch.shown = Math.min(n, to); ch.draw(); if (n >= to) { clearInterval(h); then(); } }, 75); timers.push(h); }
  function end(msg) {
    const ok = score.checks === 3 && score.dec && score.place !== false && score.be !== false;
    const gain = record("dl", "limit", ok, [...new Set(tags)], score.checks * 3 + (score.dec ? 8 : 0) + (score.place ? 8 : 0) + (score.be ? 6 : 0)); if (!ok) missed("limit", "dl", tags);
    $("#side").insertAdjacentHTML("beforeend", `<div class="hud" style="color:var(--ink2)">${msg}</div>` + nextBtn()); wireNext();
  }
}

// ───────────────────────── boot ─────────────────────────
loadState().then(loadGate).then(() => { renderHud(); home(); });
</script>
